<title>SDLC Hub Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: an app shell. A slim top bar with the viewer controls, a left rail of screens, and one working area. Same visual language as the AI-SDLC map this product grows out of: role colours, mono for anything typed or stored. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E2E7EC; --ink:#17212B; --muted:#566472; --line:#CDD5DD; --wire:#8492A0; --accent:#0C6B73;
  --po:#A65F00; --pm:#6247CF; --des:#B82C78; --dev:#1C68C4; --qa:#127A52; --ops:#66700F; --admin:#17212B;
  --ok:#1B7A4B; --warn:#9A6200; --bad:#C2352B; --on:#FFFFFF; --scrim:rgba(16,22,30,.45);
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Onest','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141A; --surface:#171E27; --sunk:#1F2833; --ink:#E4EAF0; --muted:#94A2B1; --line:#2B3644; --wire:#6C7A8A; --accent:#56C5CE;
    --po:#F2B24C; --pm:#AC9BFF; --des:#F47DB9; --dev:#74B4FF; --qa:#55D3A0; --ops:#C5CF5A; --admin:#E4EAF0;
    --ok:#5FD39A; --warn:#F0B95A; --bad:#FF8073; --on:#0F141A; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#171E27; --sunk:#1F2833; --ink:#E4EAF0; --muted:#94A2B1; --line:#2B3644; --wire:#6C7A8A; --accent:#56C5CE;
  --po:#F2B24C; --pm:#AC9BFF; --des:#F47DB9; --dev:#74B4FF; --qa:#55D3A0; --ops:#C5CF5A; --admin:#E4EAF0;
  --ok:#5FD39A; --warn:#F0B95A; --bad:#FF8073; --on:#0F141A; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f-body)}
h1,h2,h3,p,ul,ol,pre,figure{margin:0}
ul,ol{padding-left:1.15em}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
code{background:var(--sunk);padding:.08em .36em;border-radius:4px;overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.role-po{--rc:var(--po)} .role-pm{--rc:var(--pm)} .role-des{--rc:var(--des)} .role-dev{--rc:var(--dev)} .role-qa{--rc:var(--qa)} .role-ops{--rc:var(--ops)} .role-admin{--rc:var(--admin)}
.muted{color:var(--muted)}

.app{max-width:1500px;margin-inline:auto;padding-inline:clamp(16px,2vw,26px);padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;min-width:0}
.brand b{font:600 1.08rem/1.2 var(--f-display);letter-spacing:-.01em}
.proto{font:600 .72rem/1.5 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--on);background:var(--accent);border-radius:99px;padding:1px 10px}
.brand .proj{color:var(--muted);font-size:.9rem}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0;max-width:100%}
.ctl label{min-width:0;max-width:100%}
.ctl select{min-width:0;max-width:min(270px,100%);font-family:var(--f-body);font-weight:500}
.ctl label{display:inline-flex;align-items:center;gap:6px;font:500 .68rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],input[type=url],textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:5px 9px;font-size:.9rem;letter-spacing:0;text-transform:none;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}

.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
.side .grp{font:500 .66rem/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nb{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:500;color:var(--ink)}
.nb:hover{background:var(--sunk)}
a.nb{text-decoration:none}
.nb[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nb .lock{font:500 .62rem/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.7}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.ph h1{font:600 1.5rem/1.2 var(--f-body);text-wrap:balance}
.ph .sub{color:var(--muted);font-size:.92rem}
section{display:flex;flex-direction:column;gap:9px;min-width:0}
h2{font:500 .7rem/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h3{font:600 1rem/1.3 var(--f-body)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.sp{justify-content:space-between}

.rc{display:inline-block;padding:0 8px;border-radius:99px;border:1.5px solid var(--rc);color:var(--rc);font-weight:600;font-size:.76rem;line-height:1.55;background:color-mix(in srgb,var(--rc) 9%,var(--surface));white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:0 8px;border-radius:6px;font:600 .74rem/1.6 var(--f-body);white-space:nowrap;border:1.5px solid var(--pc,var(--line));color:var(--pc,var(--muted));background:color-mix(in srgb,var(--pc,var(--muted)) 10%,var(--surface))}
.pill.ok{--pc:var(--ok)} .pill.warn{--pc:var(--warn)} .pill.bad{--pc:var(--bad)} .pill.info{--pc:var(--accent)} .pill.mute{--pc:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.tag{font:500 .7rem/1 var(--f-mono);border:1px solid var(--line);border-radius:99px;padding:3px 8px;color:var(--muted);white-space:nowrap}
.rl{display:inline-flex;align-items:baseline;gap:5px;border:1.5px solid var(--ink);border-radius:6px;padding:0 8px;font:600 .78rem/1.6 var(--f-mono);white-space:nowrap;background:var(--surface)}
.rl.ro{border-style:dashed;border-color:var(--muted);color:var(--muted);font-weight:500}
.k{font:500 .68rem/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:2px 9px;font-size:.8rem}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sim{border-style:dashed;color:var(--muted)}
.btn.sim[aria-pressed="true"]{border-style:solid;border-color:var(--ink);color:var(--ink)}
.cmd{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:8px;padding:5px 6px 5px 10px;min-width:0;max-width:100%}
.cmd code{background:transparent;padding:0;font-size:.86rem;font-weight:500;flex:1;min-width:0;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 8px;font-size:.76rem;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.copy:hover{color:var(--ink);border-color:var(--ink)}
pre{background:var(--sunk);border-radius:8px;padding:10px 12px;overflow-x:auto;line-height:1.5;white-space:pre;max-width:100%}
pre.wrap{white-space:pre-wrap;overflow-wrap:anywhere}
details.more>summary{cursor:pointer;color:var(--muted);font-size:.86rem;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ ";font-family:var(--f-mono)}
details.more[open]>summary::before{content:"\2013 "}
details.more>div{padding-top:8px;display:flex;flex-direction:column;gap:8px}
.note{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--muted);font-size:.9rem;max-width:80ch}
.note.warn{border-color:var(--warn)} .note.bad{border-color:var(--bad)}
.lockbox{border:1.5px dashed var(--line);border-radius:10px;padding:14px 16px;color:var(--muted)}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font:500 .66rem/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.nw,th.nw{white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
.ftbl td:first-child{min-width:210px}
tr.click:hover td{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}

/* home */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.act.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.act-t{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font:600 1.5rem/1.2 var(--f-body);font-variant-numeric:tabular-nums}
.kpi b.bad{color:var(--bad)} .kpi b.ok{color:var(--ok)} .kpi b.warn{color:var(--warn)}
.kpi span{color:var(--muted);font-size:.84rem}
.prog{display:flex;align-items:center;gap:8px;min-width:110px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:block}
.prog i::after{content:"";display:block;height:100%;width:var(--p);background:var(--accent);border-radius:3px}
.prog span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* feature */
.fhead{display:flex;flex-direction:column;gap:8px}
.fpick{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 12px;cursor:pointer;font-size:.86rem;font-weight:500;white-space:nowrap}
.chipbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:7px 12px 6px;border-bottom:2px solid transparent;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.flowgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.mapwrap{overflow-x:auto}
svg.flow{display:block;width:100%;min-width:430px;max-width:620px;height:auto;margin-inline:auto}
.band{fill:var(--rc);fill-opacity:.07}
.lanehead{fill:var(--rc);font:600 11px var(--f-body)}
.rownum{fill:var(--muted);font:400 9.5px var(--f-mono)}
.wire{fill:none;stroke:var(--wire);stroke-width:1.2}
.wire.done{stroke:var(--ink);stroke-width:1.5}
.loopw{fill:none;stroke:var(--bad);stroke-width:1.3;stroke-dasharray:4 3}
.node{cursor:pointer}
.node rect.b{fill:var(--surface);stroke:var(--rc);stroke-width:1.5}
.node text{fill:var(--ink);font:500 11.5px var(--f-mono)}
.node.st-done rect.b{fill:color-mix(in srgb,var(--rc) 20%,var(--surface))}
.node.st-running rect.b{fill:var(--rc)} .node.st-running text{fill:var(--on);font-weight:600}
.node.st-signoff rect.b{stroke:var(--warn);stroke-dasharray:4 2.5;stroke-width:2;fill:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.node.st-blocked rect.b{stroke:var(--bad);stroke-width:2;fill:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.node.st-ready rect.b{stroke-width:2.2}
.node.st-todo rect.b{stroke:var(--line)} .node.st-todo text{fill:var(--muted)}
.node.st-skipped rect.b{stroke:var(--line);stroke-dasharray:2 3} .node.st-skipped text{fill:var(--muted);text-decoration:line-through}
.node rect.sel{fill:none;stroke:var(--ink);stroke-width:2}
.node:focus{outline:none} .node:focus-visible rect.b{stroke:var(--ink);stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:20px;height:12px;border-radius:3px;border:1.5px solid var(--dev);background:var(--surface);flex:none}
.lg.done{background:color-mix(in srgb,var(--dev) 20%,var(--surface))} .lg.running{background:var(--dev)} .lg.signoff{border-color:var(--warn);border-style:dashed;background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.lg.blocked{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))} .lg.todo{border-color:var(--line)} .lg.skipped{border-color:var(--line);border-style:dotted}
.sd{border-left:3px solid var(--rc,var(--ink));padding-left:12px;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:8.6em minmax(0,1fr);gap:6px 12px;align-items:baseline}
.kv>.k{padding-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.filechip{border:0;background:var(--sunk);border-radius:5px;padding:1px 8px;font:500 .8rem/1.6 var(--f-mono);cursor:pointer;color:var(--ink)}
.filechip:hover{outline:1.5px solid var(--ink)}

/* documents */
.docgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.doclist{display:flex;flex-direction:column;gap:4px}
.docbtn{display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;cursor:pointer;min-width:0}
.docbtn[aria-pressed="true"]{border-color:var(--ink)}
.docbtn .fn{font:500 .84rem/1.4 var(--f-mono);overflow-wrap:anywhere}
.ac{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.ac:last-child{border-bottom:0}
.ac .id{font:600 .84rem/1.5 var(--f-mono)}
.editbox{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:9px;padding:10px}
.radio{display:flex;flex-direction:column;gap:4px}
.radio label{display:flex;gap:8px;align-items:baseline}

/* tasks */
.dag{display:block;height:auto}
.tnode rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.tnode.s-done rect{fill:color-mix(in srgb,var(--ok) 13%,var(--surface));stroke:var(--ok)}
.tnode.s-in_progress rect{stroke:var(--dev);stroke-width:2.2}
.tnode.s-waiting rect{stroke:var(--bad);stroke-dasharray:4 3}
.tnode text{fill:var(--ink);font:500 11px var(--f-body)}
.tnode text.id{font:600 11px var(--f-mono)}
.tnode text.st{fill:var(--muted);font-size:10px}
.edge{fill:none;stroke:var(--wire);stroke-width:1.3}
.edge.x{stroke:var(--bad);stroke-dasharray:5 3;stroke-width:1.6}
.lanelab{fill:var(--muted);font:600 11px var(--f-mono);letter-spacing:.06em}
.laneband{fill:var(--sunk);fill-opacity:.5}

/* QA */
.stepper{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.sstep{flex:1 1 130px;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.sstep b{font-size:.9rem}
.sstep span{font-size:.8rem;color:var(--muted)}
.sstep.ok{border-color:var(--ok)} .sstep.bad{border-color:var(--bad)} .sstep.cur{border-color:var(--ink);border-width:2px}
.mx td,.mx th{text-align:center} .mx td:first-child,.mx th:first-child{text-align:left}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font:500 .68rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px}
.checks label{display:inline-flex;gap:6px;align-items:center}
.gates{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px}
.gates li{display:flex;gap:8px;align-items:baseline}

/* costs */
.rngrow{display:grid;grid-template-columns:9.5em minmax(120px,1fr) 5.2em 5.6em;gap:4px 12px;align-items:center;padding:4px 0;font-size:.88rem}
.rngrow .lbl{display:flex;gap:6px;align-items:center;min-width:0}
.rngrow .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{position:relative;height:16px}
.track .grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.track .band{position:absolute;top:5px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--accent) 30%,var(--surface))}
.track .pt{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;margin-left:-6px;background:var(--accent);border:2px solid var(--surface)}
.track .pt.over{background:var(--bad)}
.axis{display:grid;grid-template-columns:9.5em minmax(120px,1fr) 5.2em 5.6em;gap:4px 12px;font:400 .72rem/1.3 var(--f-mono);color:var(--muted)}
.axis .ticks{position:relative;height:14px}
.axis .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:8.5em minmax(60px,1fr) 4.6em;gap:10px;align-items:center;font-size:.88rem}
.bar i{display:block;height:10px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:7px;padding:4px 9px;font-size:.8rem;max-width:260px}

/* admin */
.steps{display:flex;flex-wrap:wrap;gap:6px}
.wz{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 12px;font-size:.84rem;font-weight:500;cursor:pointer}
.wz[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wz.done{border-color:var(--ok)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.list{list-style:none;padding:0;display:flex;flex-direction:column;gap:7px}
.list li{display:flex;flex-direction:column;gap:3px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
/* navigation, breadcrumbs, view switch */
.nb .cnt{font:500 .72rem/1.5 var(--f-mono);color:var(--muted);background:var(--sunk);border-radius:99px;padding:0 7px}
.nb[aria-current="page"] .cnt{background:transparent;color:inherit;opacity:.75}
.nb .ext{color:var(--muted)}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:.9rem;color:var(--muted)}
.crumb button{border:0;background:transparent;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.crumb select{max-width:min(340px,100%)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 16px;cursor:pointer;font-weight:500}

function tiOpen(){return TI.bugs.filter(b=>b.status!=="closed"&&b.status!=="rejected");}

function tiCi(){const last={};TI.runs.filter(r=>r.src==="ci").forEach(r=>{if(!(r.repo in last))last[r.repo]=r;});return ["backend","web-admin","android-app","ios-app"].map(k=>[k,last[k]&&last[k].fail===0]);}

function syncTI(){

  s.fix=TI.bugs.some(b=>b.status==="open"||b.status==="fixing")?"running":"todo";
  const pass=TI.decision==="pass";
  s.verify=pass?"done":TI.returned?"blocked":(open||!tiVerdicts()?"running":"done");
  s.autotests=ci?"done":"blocked";
  s.qafinal=pass?"done":(!tiHigh().length&&ci&&tiVerdicts()?"signoff":"todo");
  FB["tasks-issues"].ball=TI.returned&&!pass?"dev":null;
  s.accept=TI.decision==="pass"?(TI.accepted&&TI.go?"done":"signoff"):"todo";
  s.release=TI.accepted&&TI.go?(TI.rel.every(r=>r.done&&(r.roll===undefined||r.roll===100))?"done":"running"):"todo";
  FB["tasks-issues"].wait=s.release==="done"?"Released":s.release==="running"?"Rollout in progress":s.accept==="signoff"?(TI.accepted?(TI.nogo?"No-go from the PM":"PM go or no-go"):"PO acceptance"):TI.returned?"Returned by QA: the owning teams fix the open bugs":s.qafinal==="signoff"?"QA final check":[tiFailing()&&!open?"a failing criterion":"",tiHigh().length?tiHigh().length+" high bug":"",!ci?"Android CI":"",open&&!tiHigh().length?"bugs to close":""].filter(Boolean).join(", ");

function curStep(f){const o=FLOW.find(id=>["running","signoff","blocked","ready"].includes(f.st[id]));return o||null;}

function actualTok(f,id){if(f.actual&&id in f.actual)return f.actual[id];const s=SB[id],m=(s.est[0]+s.est[1])/2;const x=f.st[id];return x==="done"?Math.round(m*9)/10:x==="running"?Math.round(m*4)/10:0;}
function costOf(f,id){return actualTok(f,id)*RATE[SB[id].est[2]];}

function flowSVG(f){
  const W=540,rowH=30,top=26,numW=20,laneW=(W-numW-6)/6,H=top+FLOW.length*rowH+8;
  const P={};FLOW.forEach((id,i)=>{const s=SB[id],w=Math.round(s.label.length*7+16);P[id]={cx:numW+(LANES.indexOf(s.role)+.5)*laneW,cy:top+i*rowH+rowH/2,w};});
  P.fix={cx:numW+(3+.5)*laneW,cy:P.verify.cy,w:40};
  let s=`<svg class="flow" viewBox="0 0 ${W} ${H}" role="group" aria-label="Flow of ${esc(f.slug)}: twenty steps in six role lanes">`;
  s+=`<defs><marker id="fa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L7.5 4L0 7Z" fill="var(--wire)"/></marker><marker id="fb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L7.5 4L0 7Z" fill="var(--bad)"/></marker></defs>`;
  LANES.forEach((r,i)=>{s+=`<rect class="band role-${r}" x="${numW+i*laneW+2}" y="18" width="${laneW-4}" height="${H-20}" rx="7"/><text class="lanehead role-${r}" x="${numW+(i+.5)*laneW}" y="12" text-anchor="middle">${ROLES[r].s}</text>`;});
  FLOW.forEach((id,i)=>{s+=`<text class="rownum" x="${numW/2}" y="${P[id].cy+3}" text-anchor="middle">${i+1}</text>`;});
  for(let i=0;i<FLOW.length-1;i++){const a=P[FLOW[i]],b=P[FLOW[i+1]],y1=a.cy+11,y2=b.cy-12,my=(y1+y2)/2;const done=f.st[FLOW[i]]==="done"&&["done","running","signoff","blocked","ready"].includes(f.st[FLOW[i+1]]);
    s+=`<path class="wire${done?" done":""}" d="${Math.abs(a.cx-b.cx)<1?`M${a.cx} ${y1}V${y2}`:`M${a.cx} ${y1}V${my}H${b.cx}V${y2}`}" marker-end="url(#fa)"/>`;}
  const v=P.verify,fx=P.fix;
  s+=`<path class="loopw" d="M${v.cx-v.w/2-1} ${v.cy-4}H${fx.cx+fx.w/2+2}" marker-end="url(#fb)"/><path class="loopw" d="M${fx.cx+fx.w/2+1} ${fx.cy+4}H${v.cx-v.w/2-2}" marker-end="url(#fb)"/>`;
  FLOW.concat(["fix"]).forEach(id=>{const p=P[id],x=SB[id],stt=fstat(f,id),sel=st.step===id;
    s+=`<g class="node st-${stt} role-${x.role}" data-step="${id}" tabindex="0" role="button" aria-label="${id==="fix"?"Fix":"Step "+(FLOW.indexOf(id)+1)}, ${esc(x.title)}, ${STLAB[stt][1]}">${sel?`<rect class="sel" x="${p.cx-p.w/2-3.5}" y="${p.cy-14.5}" width="${p.w+7}" height="29" rx="9"/>`:""}<rect class="b" x="${p.cx-p.w/2}" y="${p.cy-11}" width="${p.w}" height="22" rx="${x.eng?6:11}"/><text x="${p.cx}" y="${p.cy+3.8}" text-anchor="middle">${esc(x.label)}</text></g>`;});
  return s+"</svg>";
}

  const teams=Object.keys(T).filter(t=>st.team==="all"||st.team===t);

  const W=left+cols*cw+8,H=y+4;

  shown.forEach(x=>{const b=pos(x);x.deps.forEach(d=>{const dx=by[d];if(!dx||!teams.includes(dx.team))return;const a=pos(dx),cross=dx.team!==x.team,x1=a.x+nw,y1=a.y+nh/2,x2=b.x-2,y2=b.y+nh/2,mx=(x1+x2)/2;
    s+=`<path class="edge${cross?" x":""}" d="M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" marker-end="url(#${cross?"tb":"ta"})"/>`;});});
  const SL={done:"done",in_progress:"in progress",todo:"to do",waiting:"waiting for backend"};

   ${waiting?`<p class="note bad">${waiting} client tasks wait for the backend. They are the last task of each client; the screens before them run on the mock.</p>`:""}

   <p class="muted">Read from each team's <code>tasks.json</code> and <code>tasks/tracker.md</code>, published to the <code>hub-state</code> branch by the <code>hub-report</code> job.</p>`;
}

/* ---------- QA ---------- */
const SEV={critical:"bad",high:"bad",medium:"warn",low:"mute"};

function tabQA(f){
  if(f.slug!=="tasks-issues") return `<div class="lockbox">${f.st.staging==="done"?"This feature is released; its QA record would be shown here.":"QA verifies at step 16, after the feature reaches staging at step 15. This feature is at step "+(FLOW.indexOf(curStep(f))+1)+"."} The QA screen in this prototype is filled in for <code>tasks-issues</code>. <button type="button" class="btn sm" data-feat="tasks-issues">Open tasks-issues</button></div>`;

  const mx=`<div class="scroll"><table class="mx"><thead><tr><th>Criterion</th><th>Web</th><th>Android</th><th>iOS</th><th>Backend</th></tr></thead><tbody>${TI.acs.filter(a=>TI.matrix[a.id]).map(a=>`<tr><td><code>${a.id}</code> ${esc(a.text)}</td>${["web","android","ios","backend"].map(k=>{const v=TI.matrix[a.id][k];return `<td>${v==="pass"?pill("ok","pass"):v==="fail"?pill("bad","fail"):v==="todo"?pill("mute","to check"):'<span class="muted">n/a</span>'}</td>`;}).join("")}</tr>`).join("")}</tbody></table></div>`;
  const bugs=`<div class="scroll"><table><thead><tr><th>Bug</th><th>Criterion</th><th>Platforms</th><th>Team</th><th>Severity</th><th>Status</th></tr></thead><tbody>${TI.bugs.map(b=>{const can=isQA||(p.role==="dev"&&p.team===b.team);const opts=isQA?["open","fixing","retest","closed","rejected"]:["open","fixing","retest"];
     return `<tr><td class="wide"><code>${b.id}</code> ${esc(b.title)}</td><td class="nw">${b.ac}</td><td class="nw">${b.platforms.join(", ")}</td><td class="nw"><span class="rl">${TEAMREPO[b.team]}</span></td><td class="nw">${pill(SEV[b.sev],b.sev)}</td><td class="nw">${can?`<select data-bug="${b.id}" aria-label="Status of ${b.id}">${(opts.includes(b.status)?opts:[b.status].concat(opts)).map(o=>`<option${o===b.status?" selected":""}>${o}</option>`).join("")}</select>`:pill(BST[b.status],b.status)}</td></tr>`;}).join("")}</tbody></table></div>`;
  const form=st.bugForm?`<form class="card" id="bugform"><h3>New bug</h3><div class="form"><label class="fld full"><span>Title</span><input type="text" id="bf-title" required placeholder="What is wrong, in one line"></label>
     <label class="fld"><span>Criterion</span><select id="bf-ac">${TI.acs.map(a=>`<option>${a.id}</option>`).join("")}</select></label>
     <label class="fld"><span>Owning team</span><select id="bf-team">${Object.keys(TEAMS).map(t=>`<option value="${t}">${TEAMS[t]}</option>`).join("")}</select></label>
     <label class="fld"><span>Severity</span><select id="bf-sev"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select></label>
     <div class="fld"><span>Platforms</span><div class="checks">${["web","android","ios"].map(k=>`<label><input type="checkbox" id="bf-${k}" checked> ${k}</label>`).join("")}</div></div>
     <label class="fld full"><span>Steps, expected, actual</span><textarea id="bf-steps" placeholder="1. Sign in as the test order manager&#10;2. ..."></textarea></label></div>
     <div class="row"><button type="submit" class="btn pri">Save bug</button><button type="button" class="btn" data-act="bugform">Cancel</button><span class="muted">Saved as <code>hub/bugs/BUG-NNNN.md</code>. No LLM is involved.</span></div></form>`:"";
  const runs=`<div class="scroll"><table><thead><tr><th>Source</th><th>Repository</th><th>Suite</th><th class="num">Passed</th><th class="num">Failed</th><th>When</th><th>Reference</th></tr></thead><tbody>${TI.runs.map(r=>`<tr><td class="nw">${r.src==="ci"?pill("info","CI"):pill("mute","local")}</td><td class="nw"><span class="rl">${r.repo}</span></td><td>${esc(r.what)}</td><td class="num">${r.pass}</td><td class="num">${r.fail?`<b style="color:var(--bad)">${r.fail}</b>`:"0"}</td><td class="nw muted">${r.when}</td><td class="nw">${esc(r.ref)}</td></tr>`).join("")}</tbody></table></div>`;
  const gates=[["Every criterion passes or is not applicable on every platform",ver],["No open bug of severity high or above",!high.length],["The latest CI run is green in all four repositories",ciOK]];
  const ready=gates.every(g=>g[1]);
  const fin=`<div class="card"><div class="row sp"><h3>Final check</h3>${TI.decision==="pass"?pill("ok","Passed to release"):TI.returned?pill("warn","Returned to development"):pill(ready?"warn":"mute",ready?"Waiting for the QA decision":"Gates not met yet")}</div>
     <ul class="gates">${gates.map(g=>`<li>${pill(g[1]?"ok":"bad",g[1]?"met":"not met")}<span>${g[0]}</span></li>`).join("")}</ul>
     ${TI.decision==="pass"?`<p>Recorded in <code>hub/signoffs.yaml</code> by ${esc(firstOf("qa").name)}. Next: acceptance and go or no-go.</p><div><button type="button" class="btn" data-ftab="release">Open Release</button></div>`
       :`<div class="row"><button type="button" class="btn pri" data-act="qapass"${isQA&&ready?"":" disabled"}>Pass to release</button><button type="button" class="btn danger" data-act="retform"${isQA&&(open.length||tiFailing())&&!TI.returned?"":" disabled"}>Return to development</button><span class="reason">${!isQA?"Only QA records this decision.":TI.returned?"Already returned. Waiting for the fixes.":ready?"":"Pass opens when all three gates are met."+(open.length||tiFailing()?"":" Nothing to return: no bug is open.")}</span></div>
        ${st.retForm&&isQA&&!TI.returned?`<div class="editbox"><label class="fld"><span>Reason for the return</span><textarea id="ret-reason" placeholder="What must be fixed before the feature can pass">AC-4 still fails: a task stays visible after access to the order is revoked.</textarea></label><p class="muted">Goes back to: <b>fix</b>, with ${open.length} open bug${open.length===1?"":"s"} (${open.map(b=>b.id).join(", ")||"none"}). Bugs waiting for retest are reopened.</p><div class="row"><button type="button" class="btn danger" data-act="qareturn">Record the return</button><button type="button" class="btn" data-act="retform">Cancel</button></div></div>`:""}
        ${TI.returned?`<p class="note warn">Returned: ${esc(TI.retReason)} The owning teams run ${"<code>"+esc(hubCmd("run","fix "+f.slug))+"</code>"} and QA retests.</p>`:""}
        <div class="row"><button type="button" class="btn sim sm" data-act="simfix">Prototype: fixes land, CI turns green, bugs go to retest</button><span class="muted">Then close the bugs as QA to open the gate.</span></div>`}</div>`;
  return `<div class="stepper">${stepper.map(x=>`<div class="sstep ${x[2]}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>
   <div class="row">${cmdBox(hubCmd("verify",f.slug))}${cmdBox(hubCmd("bug",f.slug))}${cmdBox(hubCmd("test",f.slug))}${cmdBox(hubCmd("decide",f.slug))}</div>
   <section><h2>Criteria by platform</h2>${mx}</section>

   <section><h2>Test runs</h2>${runs}<p class="muted">Local runs are recorded and shown, but only CI runs open the autotest gate.</p></section>

function tabRelease(f){

  if(f.slug!=="tasks-issues"||TI.decision!=="pass") return `<div class="lockbox">Release opens after QA passes the final check. ${f.slug==="tasks-issues"?'<button type="button" class="btn sm" data-ftab="qa">Open QA and tests</button>':"This feature is at step "+(FLOW.indexOf(curStep(f))+1)+"."}</div>`;
  const live=TI.accepted&&TI.go,isOps=p.role==="ops";
  const gate=`<div class="grid2"><div class="card"><div class="row sp"><h3>Acceptance</h3>${pill(TI.accepted?"ok":"warn",TI.accepted?"Accepted by "+firstOf("po").name:"Waiting for the PO")}</div><p>The analyst walks the criteria on staging, in the web admin and in one mobile app.</p><div class="row"><button type="button" class="btn pri" data-act="accept"${p.role==="po"&&!TI.accepted?"":" disabled"}>Accept the feature</button><span class="reason">${TI.accepted?"":p.role==="po"?"":"Only the PO accepts."}</span></div></div>
    <div class="card"><div class="row sp"><h3>Go or no-go</h3>${pill(TI.go?"ok":TI.nogo?"bad":"warn",TI.go?"Go from "+firstOf("pm").name:TI.nogo?"No-go from "+firstOf("pm").name:"Waiting for the PM")}</div><p>Stories closed, no blocker open, four merge requests approved. Release window: Thursday 10:00.</p>${TI.nogo&&!TI.go?`<p class="note bad">No-go recorded. The feature stays on staging until the PM gives the go.</p>`:""}<div class="row"><button type="button" class="btn pri" data-act="go"${p.role==="pm"&&TI.accepted&&!TI.go?"":" disabled"}>Give the go</button><button type="button" class="btn danger" data-act="nogo"${p.role==="pm"&&TI.accepted&&!TI.go&&!TI.nogo?"":" disabled"}>No-go</button><span class="reason">${TI.go?"":p.role!=="pm"?"Only the PM decides.":!TI.accepted?"Opens after the PO accepts.":""}</span></div></div></div>`;
  const prev=i=>i===0||TI.rel[i-1].done;
  const list=`<div class="scroll"><table><thead><tr><th>#</th><th>Part</th><th>Version</th><th>Rollback</th><th>State</th><th>Action</th></tr></thead><tbody>${TI.rel.map((r,i)=>`<tr><td>${i+1}</td><td><span class="rl">${r.k}</span></td><td class="nw">${r.v}</td><td>${r.roll===undefined?"redeploy the previous tag":"halt the rollout, turn the flag off"}</td><td class="nw">${!r.done?pill("mute","not deployed"):r.roll===undefined?pill("ok","production"):pill(r.roll===100?"ok":"info","rollout "+r.roll+"%")}</td>
      <td class="nw">${!r.done?`<button type="button" class="btn sm" data-act="deploy" data-id="${i}"${live&&isOps&&prev(i)?"":" disabled"}>Mark deployed</button>`:r.roll!==undefined&&r.roll<100?`<button type="button" class="btn sm" data-act="roll" data-id="${i}"${isOps?"":" disabled"}>Next rollout stage</button>`:'<span class="muted">done</span>'}</td></tr>`).join("")}</tbody></table></div>`;
  const all=TI.rel.every(r=>r.done&&(r.roll===undefined||r.roll===100));

   ${all?`<div class="card"><div class="row sp"><h3>Watch period</h3>${pill("ok","Released")}</div><p>The watch period is 7 days. First 24 hours: API 5xx rate unchanged, crash-free sessions 99.7% on Android and 99.9% on iOS, notification queue normal. The report goes to the PO.</p></div>`:""}`;
}

  const p=me(),ids=FLOW.filter(id=>f.st[id]!=="skipped"&&SB[id].est[1]).concat(f.st.fix!=="todo"||actualTok(f,"fix")?["fix"]:[]),fc=featCost(f);

    return `<div class="rngrow" data-tip="${esc(s.label+": actual "+tok(a)+", estimate "+s.est[0]+"–"+s.est[1]+"M on "+s.est[2]+(over?", over by "+Math.round(r-100)+"%":""))}"><span class="lbl">${rchip(s.role)}<span>${esc(s.label)}</span></span><div class="track"><span class="grid" style="left:0"></span><span class="grid" style="left:${pct(50)}%"></span><span class="grid" style="left:${pct(100)}%"></span><span class="grid" style="left:${pct(150)}%"></span><span class="band" style="left:${pct(lo)}%;width:${pct(100)-pct(lo)}%"></span>${a?`<span class="pt${over?" over":""}" style="left:${pct(r)}%"></span>`:""}</div><span class="v">${a?tok(a):"—"}${over?" ▲":""}</span><span class="v c2">${a?money(costOf(f,id)):"—"}</span></div>`;}).join("");
  const byRole={},byModel={};ids.forEach(id=>{const s=SB[id],c=costOf(f,id);byRole[s.role]=(byRole[s.role]||0)+c;byModel[s.est[2]]=(byModel[s.est[2]]||0)+c;});
  const bars=(obj,lab)=>{const mx=Math.max(...Object.values(obj),0.01);return `<div class="bars">${Object.keys(obj).sort((a,b)=>obj[b]-obj[a]).map(k=>`<div class="bar" data-tip="${esc(lab(k)+": "+money(obj[k]))}"><span>${lab(k)}</span><i style="width:${Math.max(obj[k]/mx*100,1)}%"></i><span class="v">${money(obj[k])}</span></div>`).join("")}</div>`;};
  const ppl=[];Object.keys(byRole).forEach(r=>{const g=PEOPLE.filter(x=>x.role===r);g.forEach(x=>ppl.push([x,byRole[r]/g.length]));});
  const asst={};ppl.forEach(x=>{const k={claude:"Claude Code",codex:"Codex",cursor:"Cursor"}[x[0].asst];asst[k]=(asst[k]||0)+x[1];});
  const own=ppl.find(x=>x[0].id===p.id);
  const see=p.role==="admin"||p.role==="pm";
  return `<div class="kpis"><div class="kpi"><b>${tok(fc.t)}</b><span>Tokens so far · estimate ${Math.round(fc.lo)}–${Math.round(fc.hi)}M</span></div><div class="kpi"><b>${money(fc.c)}</b><span>API-equivalent cost so far</span></div><div class="kpi"><b>${f.days} of ${f.estDays}</b><span>Working days used of the estimate</span></div><div class="kpi"><b class="${ids.some(id=>actualTok(f,id)>SB[id].est[1])?"warn":"ok"}">${ids.filter(id=>actualTok(f,id)>SB[id].est[1]).length}</b><span>Steps over their upper estimate</span></div></div>
   <div class="card"><div class="row sp"><h3>Actual tokens against the estimate, per step</h3><div class="legend"><span><i class="lg" style="border:0;height:6px;background:color-mix(in srgb,var(--accent) 30%,var(--surface))"></i>estimate range</span><span><i style="width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block"></i>actual</span><span><i style="width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block"></i>over ▲</span></div></div>
    <div class="axis"><span></span><div class="ticks"><span style="left:0">0</span><span class="t2" style="left:${pct(50)}%">50%</span><span style="left:${pct(100)}%">upper estimate</span><span class="t2" style="left:${pct(150)}%">150%</span></div><span style="text-align:right">tokens</span><span class="c2" style="text-align:right">cost</span></div>${rows}
    <p class="muted">Every row is drawn on the same scale: percent of that step's upper estimate. Costs are tokens at API list prices; on Team seats they are not billed per step.</p></div>
   <div class="grid3"><div class="card"><h3>Cost by role</h3>${bars(byRole,k=>ROLES[k].n)}</div><div class="card"><h3>Cost by model</h3>${bars(byModel,k=>k)}</div><div class="card"><h3>Cost by assistant</h3>${bars(asst,k=>k)}<p class="muted">Cursor reports usage only for headless runs, so its share is partial.</p></div></div>
   <section><h2>Per person</h2>${see?`<div class="scroll"><table><thead><tr><th>Person</th><th>Role</th><th>Assistant</th><th class="num">Cost on this feature</th></tr></thead><tbody>${ppl.sort((a,b)=>b[1]-a[1]).map(x=>`<tr><td>${esc(x[0].name)}</td><td class="nw">${rchip(x[0].role,roleLabel(x[0]))}</td><td class="nw">${{claude:"Claude Code",codex:"Codex",cursor:"Cursor"}[x[0].asst]}</td><td class="num">${money(x[1])}</td></tr>`).join("")}</tbody></table></div><p class="muted">Decrypted on this machine with your key. In the repository these records are encrypted to the admin and PM keys.</p>`
     :`<div class="lockbox">Spend per person is visible to the admin and the PM only.${own?" Your own usage on this feature: about <b>"+money(own[1])+"</b>.":""}</div>`}</section>`;
}

/* ---------- admin: setup script ---------- */
function genScript(p,os){
  const repos=roleRepos(p).map(r=>r[0]).filter(x=>x!=="product-specs").map(x=>st.cfg.group+"/"+x);
  const inst={claude:["claude","curl -fsSL https://claude.ai/install.sh | bash","irm https://claude.ai/install.ps1 | iex"],codex:["codex","npm install -g @openai/codex","npm install -g @openai/codex"],cursor:["agent","see https://cursor.com/cli","see https://cursor.com/cli"]}[p.asst];
  if(os==="bash") return `#!/usr/bin/env bash
# SDLC Hub setup for ${p.user} (${roleLabel(p)})
# Generated 2026-10-07 by the admin. Contains no secrets. Safe to run again.
set -euo pipefail

HUB_GIT_PROVIDER="${st.cfg.gitHost}"
HUB_GIT_HOST="https://${st.cfg.host}"
HUB_REPO="${st.cfg.group}/${st.cfg.repo}"
HUB_USER="${p.user}"
HUB_ROLE="${p.role}"${p.team?`\nHUB_TEAM="${p.team}"`:""}
HUB_TEAM_REPOS="${repos.join(" ")}"
HUB_ASSISTANT="${p.asst}"
HUB_RELEASE="v1.0.0"
WORK="$HOME/work/${st.cfg.group}"

need() { command -v "$1" >/dev/null 2>&1 || { echo "Missing: $1. $2"; exit 1; }; }

echo "1/6 Checking what is installed"
need git  "Install it from https://git-scm.com/downloads"
need node "Install Node.js 20 or newer from https://nodejs.org"
need ${inst[0]} "Install it: ${inst[1]}"

echo "2/6 Signing in to GitLab (browser or SSH key; nothing is stored in this script)"
git ls-remote "$HUB_GIT_HOST/$HUB_REPO.git" >/dev/null

echo "3/6 Cloning into $WORK"
mkdir -p "$WORK" && cd "$WORK"
for r in "$HUB_REPO" $HUB_TEAM_REPOS; do
  d="$(basename "$r")"
  [ -d "$d/.git" ] || git clone "$HUB_GIT_HOST/$r.git" "$d"
done

echo "4/6 Checking your role on main"
cd "$WORK/${st.cfg.repo}"
node hub/cli.js setup --user "$HUB_USER" --role "$HUB_ROLE" --expect "$HUB_RELEASE"

echo "5/6 Writing the files for your role and assistant"
node hub/cli.js setup --role-files --assistant "$HUB_ASSISTANT"

echo "6/6 Health check, then the site opens on your guide"
node hub/cli.js doctor
node hub/cli.js serve --open /guide`;
  return `# SDLC Hub setup for ${p.user} (${roleLabel(p)})
# Generated 2026-10-07 by the admin. Contains no secrets. Safe to run again.
$ErrorActionPreference = "Stop"

$HubProvider  = "${st.cfg.gitHost}"
$HubGitHost   = "https://${st.cfg.host}"
$HubRepo      = "${st.cfg.group}/${st.cfg.repo}"
$HubUser      = "${p.user}"
$HubRole      = "${p.role}"${p.team?`\n$HubTeam      = "${p.team}"`:""}
$HubTeamRepos = @(${repos.map(r=>'"'+r+'"').join(", ")})
$HubAssistant = "${p.asst}"
$HubRelease   = "v1.0.0"
$Work         = Join-Path $HOME "work\\${st.cfg.group}"

function Need($cmd, $hint) {
  if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) { Write-Host "Missing: $cmd. $hint"; exit 1 }
}

Write-Host "1/6 Checking what is installed"
Need git  "winget install Git.Git"
Need node "winget install OpenJS.NodeJS.LTS"
Need ${inst[0]} "Install it: ${inst[2]}"

Write-Host "2/6 Signing in to GitLab (Git Credential Manager; nothing is stored in this script)"
git ls-remote "$HubGitHost/$HubRepo.git" | Out-Null

Write-Host "3/6 Cloning into $Work"
New-Item -ItemType Directory -Force -Path $Work | Out-Null
Set-Location $Work
foreach ($r in @($HubRepo) + $HubTeamRepos) {
  $d = Split-Path $r -Leaf

Write-Host "4/6 Checking your role on main"
Set-Location (Join-Path $Work "${st.cfg.repo}")
node hub/cli.js setup --user $HubUser --role $HubRole --expect $HubRelease

Write-Host "5/6 Writing the files for your role and assistant"
node hub/cli.js setup --role-files --assistant $HubAssistant

Write-Host "6/6 Health check, then the site opens on your guide"
node hub/cli.js doctor
node hub/cli.js serve --open /guide`;
}

/* ---------- git host: what it must enforce ---------- */
function hostKind(){
  const c=st.cfg;
  if(c.gitHost==="gitlab") return c.host==="gitlab.com"?{k:"saas",ver:"GitLab.com",tier:"Free"}:{k:"self",ver:"GitLab 19.3, self-managed",tier:"Free"};
  return c.host==="github.com"?{k:"saas",ver:"GitHub.com",tier:"Team"}:{k:"self",ver:"GitHub Enterprise Server 3.19",tier:"Enterprise"};
}
/* What the host must enforce. 1 = init applied it, 0 = someone does it by hand. */
function hostChecks(){
  const c=st.cfg,self=hostKind().k==="self";
  return (c.gitHost==="gitlab"?[
    ["Branch main is protected: nobody pushes, every change is a merge request",1],
    ["Merge check \"Pipelines must succeed\" is on",1],
    ["CI/CD configuration file points to ci/product-specs.yml@"+c.group+"/hub-ci",1],
    ["Merge requests may merge by themselves when the pipeline succeeds",1],
    ["Branch hub-state exists and accepts pushes from Developers",1],
    ["Project access token for hub-report is stored as the masked group variable HUB_STATE_TOKEN",1],
    self?["Pre-receive server hook (optional, needs access to the GitLab server)",0]:null
  ]:[
    ["Ruleset on main: pull requests only, nobody bypasses",1],
    ["Required status check hub-guard",1],
    ["hub-guard runs on pull_request_target, so its definition always comes from the default branch",1],
    ["Auto-merge is allowed, so a pull request merges by itself when the checks pass",1],
    ["Branch hub-state exists and accepts pushes from members with write access",1],
    ["Secret HUB_STATE_TOKEN for hub-report: a fine-grained token someone creates by hand",0],
    self?["Pre-receive hook (optional, needs a site administrator)",0]:null
  ]).filter(Boolean);
}

/* Rendering replaces the markup, so remember which control had the focus and give it back. */
function fkey(el){
  if(!el||el===document.body||!el.getAttribute) return null;
  const root=el.closest("#dlg,#sheet,#nav,#main,.top"),pre=root?(root.id?"#"+root.id:".top")+" ":"";
  if(el.id) return "#"+el.id;
  const A=["data-ftab","data-fview","data-ffilter","data-step","data-task","data-doc","data-docopen","data-team","data-os","data-bug","data-info","data-page","data-go","data-act"];
  for(const a of A){if(el.hasAttribute(a)){let q="["+a+'="'+el.getAttribute(a).replace(/["\\]/g,"\\$&")+'"]';if(a==="data-act"&&el.hasAttribute("data-id"))q+='[data-id="'+el.getAttribute("data-id")+'"]';return pre+q;}}
  return null;
}
let focusTop=false;
function render(){
  const key=fkey(document.activeElement);
  syncTI();

  $("#asst").querySelectorAll("option").forEach(o=>{o.disabled=!st.cfg.assts[o.value];});

  renderNav();

  renderInfo();
  const over=st.info!=null?$("#dlg"):st.task!=null?$("#sheet"):null;
  $(".app").inert=!!over; $("#sheet").inert=st.info!=null;
  let n=null;
  if(focusTop&&!over){n=$("#main h1");if(n)n.setAttribute("tabindex","-1");}
  else if(key){try{n=document.querySelector(key);}catch(e){n=null;}}
  if(over&&(!n||!over.contains(n)))n=over.querySelector("#dlg-x,#sheet-x");
  if(n&&n.focus&&!n.disabled)n.focus({preventScroll:true});
  focusTop=false;
  document.querySelectorAll(".mapwrap").forEach(w=>{const c=w.querySelector(".node rect.sel,.node.st-running,.node.st-signoff,.node.st-blocked,.node.st-ready");if(c&&w.scrollWidth>w.clientWidth){const r=c.getBoundingClientRect(),b=w.getBoundingClientRect();w.scrollLeft+=r.left-b.left-b.width/2+r.width/2;}});
}

/* ---------- command help: what a command does, how to write it, its prompt and a sample of its output ---------- */
function parseCmd(text){
  let m=text.match(/^(\/hub:|\$hub-|\/hub-)([a-z]+)(?: (.*))?$/),key=null,rest="";
  if(m){key=m[2];rest=m[3]||"";}else if((m=text.match(/^node hub\/cli\.js ([a-z]+)/))){key=m[1];}
  if(!key||!CMDS[key]) return null;
  const tok=rest.split(" ").filter(Boolean),slug=tok.find(x=>FB[x])||null,stage=key==="run"?(tok[0]||null):null;
  return {key,rest,slug,f:slug?FB[slug]:null,stage,p:me(),text};
}
function stageStep(stage){return stage==="fix"?FIX:STEPS.find(s=>s.label===stage||s.eng===stage||s.id===stage||s.id===stage.replace(/-/g,""))||null;}
function pickFeat(c){return c.f||FEATS.find(f=>{const b=ball(f);return b&&b.role===c.p.role;})||FB[SAMPLE];}
function stepPrompt(s,f){
  if(!s||s.noLLM) return "";
  return (s.eng?engCmd(s.eng,f.slug)+"\n\n":"")+(s.hint?s.hint+"\n\n":"")+"Feature: "+f.title+" ("+f.slug+"). Jira: "+f.jira+".";
}
function stepRun(s,f,c,rerun){

   case "canceled": st.edit=null;render();break;
   case "savead": {const txt=$("#ed-text").value.trim(),kind=(document.querySelector('input[name="edkind"]:checked')||{}).value;const ac=TI.acs.find(x=>x.id===id);if(txt)ac.text=txt;st.edit=null;
     if(kind==="meaning"){DOCS.forEach(d=>{if(d.refs.includes(id))TI.stale[d.id]=true;});TI.report=null;render();toast(id+" saved as a change of meaning. "+Object.keys(TI.stale).length+" documents now need validation.");}
     else{render();saved("spec.md (wording of "+id+")");}break;}
   case "addac": {const n="AC-"+(TI.acs.length+1);TI.acs.push({id:n,text:"When an assignee is deactivated, their open tasks return to the author with a notification."});TI.matrix[n]={web:"todo",android:"todo",ios:"todo",backend:"todo"};["test-plan.md","contracts/openapi.yaml","backend: tasks.json"].forEach(d=>TI.stale[d]=true);TI.report=null;render();{const k=Object.keys(TI.stale).length;toast(n+" added. "+k+" document"+(k===1?"":"s")+" now need validation, and QA has a new row to verify.");}break;}
   case "validate": case "simvalidate": TI.report=Object.keys(TI.stale).map(d=>[d,DOCS.find(x=>x.id===d).owner,CONFLICT[d]]);render();toast(act==="validate"?"Validation finished. The assistant read "+TI.report.length+" documents and changed nothing.":"Sample report shown.");break;
   case "clearstale": delete TI.stale[id];if(!Object.keys(TI.stale).length)TI.report=null;render();saved("hub/signoffs.yaml");break;
   case "bugform": st.bugForm=!st.bugForm;render();break;
   case "simfix": TI.bugs.forEach(b=>{if(b.status==="open"||b.status==="fixing")b.status="retest";});TI.runs.unshift({src:"ci",repo:"android-app",what:"Maestro flows",pass:14,fail:0,when:"just now",ref:"pipeline #4128"});TI.matrix["AC-4"]={web:"pass",android:"pass",ios:"pass",backend:"pass"};TI.returned=false;render();toast("Fixes merged, staging redeployed, Android pipeline #4128 is green. Bugs are waiting for retest.");break;
   case "qapass": TI.decision="pass";st.ftab="release";render();saved("hub/signoffs.yaml (qa-final: pass)");break;
   case "retform": st.retForm=!st.retForm;render();break;
   case "qareturn": {const r=($("#ret-reason")||{}).value||"";if(!r.trim()){toast("Write the reason for the return first.");break;}TI.retReason=r.trim().replace(/\.?$/,".");TI.returned=true;st.retForm=false;TI.bugs.forEach(b=>{if(b.status==="retest")b.status="open";});render();saved("hub/signoffs.yaml (qa-final: return)");break;}
   case "nogo": TI.nogo=true;render();saved("hub/release.yaml (no-go)");break;
   case "savefy": {const d=parseInt(($("#fy-days")||{}).value,10),j=(($("#fy-jira")||{}).value||"").trim();if(d>0)f.estDays=d;if(j)f.jira=j;render();saved("hub/feature.yaml");break;}
   case "addteam": toast("In the product this opens a form: team name, repository and kind. The hub then opens a merge request there that adds the hub-report job.");break;
   case "apform": st.addForm=!st.addForm;render();break;
   case "accept": TI.accepted=true;render();saved("hub/signoffs.yaml (accept)");break;
   case "go": TI.go=true;TI.nogo=false;render();saved("hub/release.yaml (go)");break;
   case "deploy": {const r=TI.rel[+id];r.done=true;if(r.roll!==undefined)r.roll=10;render();saved("hub/release.yaml ("+r.k+")");break;}
   case "roll": {const r=TI.rel[+id];r.roll=r.roll===10?50:100;render();saved("hub/release.yaml ("+r.k+" "+r.roll+"%)");break;}
   case "script": go("script",{scriptUser:id,scriptOs:PB[id].os==="Windows"?"ps":"bash"});break;
   case "viewas": st.persona=id;st.asst=PB[id].asst;$("#persona").value=id;$("#asst").value=st.asst;go("guide");break;
   case "addperson": {const u=($("#ap-user").value||"").trim(),nm=($("#ap-name").value||"").trim(),role=$("#ap-role").value;if(!u||!nm){toast("Enter the username and the name.");break;}if(PEOPLE.some(x=>x.user===u)){toast(u+" is already on the list.");break;}
     const np={id:u.replace(/[^a-z0-9]/gi,"")+PEOPLE.length,user:u,name:nm,role,asst:$("#ap-asst").value,os:$("#ap-os").value,setup:"none",seen:"never"};if(role==="dev"){np.team=$("#ap-team").value;np.lead=$("#ap-lead").checked;}
     PEOPLE.push(np);PB[np.id]=np;$("#persona").insertAdjacentHTML("beforeend",`<option value="${np.id}">${esc(np.name)} · ${esc(roleLabel(np))}</option>`);st.addForm=false;render();saved(".hub/roles.yaml");break;}
   case "savelinks": st.cfg.jira=$("#set-jira").value;st.cfg.conf=$("#set-conf").value;st.cfg.figma=$("#set-figma").value;saved(".hub/config.yaml");break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="set-headless"){st.headless=t.checked;render();toast(st.headless?"Headless runs are on. Run and Validate buttons are enabled for the owning role.":"Headless runs are off.");return;}
  if(t.id==="featsel"){st.feat=t.value;st.step=null;st.team="all";render();return;}
  if(t.id==="sc-user"){st.scriptUser=t.value;st.scriptOs=PB[t.value].os==="Windows"?"ps":"bash";render();return;}
  if(t.hasAttribute&&t.hasAttribute("data-asst")){const k=t.getAttribute("data-asst"),users=PEOPLE.filter(x=>x.asst===k);
    if(!t.checked&&users.length){toast(users.map(x=>x.name).join(", ")+" "+(users.length===1?"uses":"use")+" "+{codex:"Codex",cursor:"Cursor"}[k]+". Change their assistant on People and roles first.");render();return;}
    st.cfg.assts[k]=t.checked;render();saved(".hub/config.yaml");return;}
  if(t.id==="set-engine"){st.cfg.engine=t.value;render();saved(".hub/config.yaml");return;}
  if(t.hasAttribute&&t.hasAttribute("data-bug")){const b=TI.bugs.find(x=>x.id===t.getAttribute("data-bug"));b.status=t.value;render();saved("hub/bugs/"+b.id+".md");}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="bugform")return;e.preventDefault();
  const title=$("#bf-title").value.trim();if(!title)return;
  const n="BUG-00"+(12+TI.bugs.length);
  TI.bugs.unshift({id:n,title,ac:$("#bf-ac").value,platforms:["web","android","ios"].filter(k=>$("#bf-"+k).checked),team:$("#bf-team").value,sev:$("#bf-sev").value,status:"open",by:st.persona});
  st.bugForm=false;render();saved("hub/bugs/"+n+".md");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&st.info!=null){closeInfo();return;}
  if(e.key==="Escape"&&st.task!=null){closeTask();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest(".fm,.fhd")){e.preventDefault();const [f,tab,step]=e.target.closest(".fm,.fhd").getAttribute("data-go").split("|");go("feature",{feat:f,ftab:tab,step:step||null,team:"all"});return;}if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest(".node")){e.preventDefault();st.step=e.target.closest(".node").getAttribute("data-step");render();}});
const tip=$("#tip");
document.addEventListener("mousemove",e=>{const m=e.target.closest&&e.target.closest("[data-tip]");if(!m){tip.hidden=true;return;}tip.textContent=m.getAttribute("data-tip");tip.hidden=false;const w=tip.offsetWidth;tip.style.left=Math.min(e.clientX+14,window.innerWidth-w-8)+"px";tip.style.top=(e.clientY+16)+"px";});
if(location.hash==="#admin"){st.persona="nazar";st.asst=PB.nazar.asst;st.page="people";$("#persona").value="nazar";$("#asst").value=st.asst;}
render();
})();
</script>
