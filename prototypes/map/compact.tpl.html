<title>AI-SDLC One-Screen Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: a one-screen app. A slim top bar, then two panes that share the viewport height: the role-lane map on the left (rows scale to the height), a tabbed detail pane on the right with collapsible sections. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E2E7EC; --ink:#17212B; --muted:#566472; --line:#CDD5DD; --wire:#8492A0; --accent:#0C6B73;
  --po:#A65F00; --pm:#6247CF; --des:#B82C78; --dev:#1C68C4; --qa:#127A52; --bug:#C2352B; --on-role:#FFFFFF;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Onest','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141A; --surface:#171E27; --sunk:#1F2833; --ink:#E4EAF0; --muted:#94A2B1; --line:#2B3644; --wire:#6C7A8A; --accent:#56C5CE;
    --po:#F2B24C; --pm:#AC9BFF; --des:#F47DB9; --dev:#74B4FF; --qa:#55D3A0; --bug:#FF8073; --on-role:#0F141A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#171E27; --sunk:#1F2833; --ink:#E4EAF0; --muted:#94A2B1; --line:#2B3644; --wire:#6C7A8A; --accent:#56C5CE;
  --po:#F2B24C; --pm:#AC9BFF; --des:#F47DB9; --dev:#74B4FF; --qa:#55D3A0; --bug:#FF8073; --on-role:#0F141A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{box-sizing:border-box;height:100%}
body{height:100%;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f-body)}
.role-po{--rc:var(--po)} .role-pm{--rc:var(--pm)} .role-des{--rc:var(--des)} .role-dev{--rc:var(--dev)} .role-qa{--rc:var(--qa)}
h1,h2,h3,p,ul,ol,pre,figure{margin:0}
ul,ol{padding-left:1.15em}
code,pre{font-family:var(--f-mono);font-size:.86em}
code{background:var(--sunk);padding:.08em .36em;border-radius:4px;overflow-wrap:anywhere}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

.app{height:100%;max-width:1480px;margin-inline:auto;padding-inline:clamp(16px,2vw,28px);padding-block:12px;display:flex;flex-direction:column;gap:10px}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 18px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{font:600 1.08rem/1.25 var(--f-display);letter-spacing:-.01em}
.h1row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.ver{flex:none;font:700 .8rem/1.5 var(--f-body);letter-spacing:.02em;white-space:nowrap;color:var(--surface);background:var(--accent);border-radius:99px;padding:1px 10px}
.sub{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:.86rem;color:var(--muted)}
.sub b{color:var(--ink);font-weight:600}
.sub .meta{display:inline-flex;flex-wrap:wrap;gap:2px 10px}
.bar-right{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px 10px}
.btn.restart{padding:3px 12px;font-size:.84rem}
.hchips{display:inline-flex;flex-wrap:wrap;gap:6px}
.hchip{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--surface));background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink);border-radius:99px;padding:1px 10px;font-size:.8rem;line-height:1.5;cursor:pointer;white-space:nowrap}
.hchip:hover{border-color:var(--accent)}
.hchip b{color:var(--accent);font-weight:600}
.coststrip{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;background:color-mix(in srgb,var(--accent) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--surface));border-radius:9px;padding:5px 10px}
.coststrip .cv{display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
.coststrip b{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.coststrip{position:relative}
.info-btn{margin-left:auto;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--surface));background:var(--surface);color:var(--accent);border-radius:99px;padding:0 9px;font-size:.76rem;font-weight:600;line-height:1.5;cursor:pointer}
.info-btn:hover,.info-btn[aria-expanded="true"]{background:var(--accent);color:var(--surface)}
.cost-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:4;width:min(380px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.86rem;line-height:1.45;box-shadow:0 6px 18px rgba(10,14,20,.18)}
.coststrip .money b{color:var(--bug);font-weight:700;font-size:1.04em}
.hchip.money b{color:var(--bug);font-weight:700}
.coststrip .est{margin-left:auto;font:500 .66rem/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lang{flex:none;display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;padding:4px 11px;font:500 .76rem/1.4 var(--f-mono);cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible{outline-offset:-2px}

/* stage */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,.8fr) minmax(0,1.2fr);gap:16px}
.mapcol{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.hintrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;position:relative}
.hr-right{display:inline-flex;align-items:center;gap:12px}
.hint{font-size:.8rem;color:var(--muted)}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.lane-btn{border:1.5px solid var(--rc);color:var(--rc);background:color-mix(in srgb,var(--rc) 9%,var(--surface));border-radius:7px;padding:3px 2px;font-weight:600;font-size:.8rem;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden}
.lane-btn[aria-pressed="true"]{background:var(--rc);color:var(--on-role)}
.lane-btn .s{display:none}
.compact .lane-btn .l{display:none} .compact .lane-btn .s{display:inline}
#map{flex:1;min-height:0;position:relative}
#map svg{position:absolute;left:0;top:0;display:block}
.band{fill:var(--rc);fill-opacity:.07} .band.on{fill-opacity:.17}
.rownum{fill:var(--muted);font-family:var(--f-mono)}
.wire{fill:none;stroke:var(--wire);stroke-width:1.3}
.wire.hand{stroke:var(--ink);stroke-width:1.7}
.wire{transition:stroke-width .18s ease}
.wire.hot{stroke:var(--ink);stroke-width:3.4}
@media (prefers-reduced-motion:reduce){.wire{transition:none}}
.ah{fill:var(--wire)} .ahs{fill:var(--ink)} .ahb{fill:var(--bug)}
.loop{fill:none;stroke:var(--bug);stroke-width:1.4;stroke-dasharray:5 4;opacity:.55}
.loop.solid{stroke-dasharray:none}
.focus .wire{opacity:.28}
.has-loop .loop{opacity:.16}
.has-loop .loop.on{opacity:1;stroke-width:2.3}
.node{cursor:pointer}
.node rect{fill:var(--surface);stroke:var(--rc);stroke-width:1.5}
.node text{fill:var(--ink);font-family:var(--f-mono);font-weight:500}
.node.team text{font-family:var(--f-body)}
.node:hover rect{stroke-width:2.6}
.node:focus{outline:none}
.node:focus-visible rect{stroke:var(--ink);stroke-width:3}
.node.active rect{fill:var(--rc)}
.node.active text{fill:var(--on-role);font-weight:600}
.node.dim{opacity:.28}
.node.ring rect{stroke:var(--bug);stroke-width:2.6}
.under{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.under .lbl{font-size:.8rem;color:var(--muted)}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 9px;cursor:pointer;font-size:.8rem;white-space:nowrap}
.chipbtn b{font-family:var(--f-mono);font-weight:600;font-size:.92em}
.chipbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.loop-btn{border-style:dashed;border-color:var(--bug)}
.loop-btn[aria-pressed="true"]{border-style:solid;border-color:var(--bug);background:var(--bug);color:var(--on-role)}
.lg summary{list-style:none;cursor:pointer;font-size:.8rem;color:var(--muted);border-bottom:1px dotted var(--muted)}
.lg summary::-webkit-details-marker{display:none}
.lg .legend{position:absolute;right:0;top:calc(100% + 6px);z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.82rem;max-width:300px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.lg-box{flex:none;width:22px;height:13px;border:1.5px solid var(--muted);border-radius:3px;background:var(--surface)}
.lg-pill{flex:none;width:22px;height:13px;border:1.5px solid var(--muted);border-radius:99px;background:var(--surface)}
.lg-line{flex:none;width:22px;height:0;border-top:2px solid var(--ink)}
.lg-thin{flex:none;width:22px;height:0;border-top:1.3px solid var(--wire)}
.lg-dash{flex:none;width:22px;height:0;border-top:2px dashed var(--bug)}

/* pane */
.pane{container-type:inline-size;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs{display:flex;gap:2px;padding:4px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{border:0;background:transparent;padding:7px 9px 6px;border-bottom:2px solid transparent;font-weight:500;font-size:.88rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible{outline-offset:-2px}
.pane-body{flex:1;min-height:0;overflow:auto;padding:12px 18px 12px;display:flex;flex-direction:column;gap:12px}
.d-top{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--rc,var(--ink));padding-left:12px}
.d-line{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.82rem;color:var(--muted)}
.tag{font:500 .7rem/1 var(--f-mono);border:1px solid var(--line);border-radius:99px;padding:3px 8px;color:var(--muted)}
.walk{margin-left:auto;display:inline-flex;gap:4px}
.ib{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 12px;cursor:pointer;font-weight:600;font-size:.92rem;line-height:1.5;min-width:46px}
.ib.arrow{font-size:1.3rem;line-height:1.1;padding:3px 12px 5px}
.ib .ar{display:inline-block}
.ib.hint{border-color:var(--accent);background:var(--accent);color:var(--surface);animation:ring 1.15s ease-out infinite}
.ib.hint .ar{animation:nudge 1.15s ease-in-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent) 0%,transparent)}}
@keyframes nudge{0%,100%{transform:translateX(-2px)}50%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.ib.hint,.ib.hint .ar{animation:none}}
.ib:hover:not(:disabled){border-color:var(--ink)}
.ib:disabled{opacity:.4;cursor:default}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane h2{font:600 1.2rem/1.25 var(--f-body);text-wrap:balance}
.sum{max-width:62ch}
.cmdrow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.cmd{display:inline-flex;align-items:center;gap:6px;max-width:100%}
.cmd code{padding:3px 8px;border-radius:6px;font-weight:500}
.copy{border:1px solid var(--line);background:transparent;border-radius:6px;padding:1px 7px;font-size:.74rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.copy:hover{color:var(--ink);border-color:var(--ink)}
.jira{font-size:.84rem;color:var(--muted)} .jira b{color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px}
@container (max-width:470px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tools{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px}
.tools li{display:grid;grid-template-columns:11.5em minmax(0,1fr);gap:1px 12px;align-items:baseline;font-size:.9rem}
.tools b{font-weight:600}
.tw{display:inline-block;background:var(--sunk);border-radius:5px;padding:0 6px;margin-right:6px;font-size:.78rem;color:var(--muted)}
@container (max-width:470px){.tools li{grid-template-columns:minmax(0,1fr)}}
.handline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.cell{display:flex;flex-direction:column;gap:5px;min-width:0}
.k{font:500 .68rem/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips code,.src{background:var(--sunk);border-radius:5px;padding:1px 7px;font-size:.82rem;overflow-wrap:anywhere}
.src b{font-weight:600}
.plain{font-size:.88rem;color:var(--muted)}
.rows{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px}
.rows li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:3px 12px;align-items:baseline}
.rows .kk{font-weight:600}
.rows .v{color:var(--muted)}
.rchip{display:inline-block;padding:0 8px;border-radius:99px;border:1.5px solid var(--rc);color:var(--rc);font-weight:600;font-size:.76rem;line-height:1.55;background:color-mix(in srgb,var(--rc) 9%,var(--surface));white-space:nowrap}
.more{display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}
.more-tabs{display:flex;flex-wrap:wrap;gap:6px}
.mt{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 12px;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--muted)}
.mt::after{content:" +";font-family:var(--f-mono)}
.mt:hover{border-color:var(--ink);color:var(--ink)}
.mt[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mt[aria-expanded="true"]::after{content:" \2013"}
.more-body{display:flex;flex-direction:column;gap:8px}
.cap{font-size:.84rem;color:var(--muted)}
.rolepick{display:flex;flex-wrap:wrap;gap:6px}
.rolepick .lane-btn{padding:3px 12px;font-size:.84rem}
.setup-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:9px}
.setup-list li{display:flex;flex-direction:column;gap:4px}
.setup-list .v{color:var(--muted)}
.acc .in > p{max-width:70ch}
.caprow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px}
.more-body pre{line-height:1.42}
.pblock{display:flex;flex-direction:column;gap:4px}
.pblock .cap{flex:1;min-width:0}
.chat{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.9rem}
.chat li{display:grid;grid-template-columns:4.4em minmax(0,1fr);gap:2px 10px;align-items:baseline}
.chat .who{font:600 .74rem/1.5 var(--f-mono);letter-spacing:.04em}
.chat .say{white-space:pre-wrap;overflow-wrap:anywhere}
.chat .c-po .who{color:var(--po)}
.chat .c-po .say{background:color-mix(in srgb,var(--po) 9%,var(--surface));border-radius:7px;padding:2px 9px;justify-self:start}
.chat .c-cl .who{color:var(--accent)}
.chat .c-note .say{color:var(--muted);font-style:italic}
.chat .c-sec{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font:500 .68rem/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chat .c-sec:first-child{margin-top:0;padding-top:0;border-top:0}
.cap b{color:var(--ink);font-weight:600}
.more-body ul:not(.rows){display:flex;flex-direction:column;gap:4px}
.acc{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;padding:8px 2px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 .7rem/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:1rem;line-height:1;letter-spacing:0}
.acc details[open] > summary{color:var(--ink)}
.acc details[open] > summary::after{content:"\2013"}
.acc .in{padding:0 2px 12px;display:flex;flex-direction:column;gap:10px}
.acc .in ul:not(.rows){display:flex;flex-direction:column;gap:4px}
pre{background:var(--sunk);border-radius:8px;padding:10px 12px;overflow-x:auto;line-height:1.5;white-space:pre;max-width:100%}
pre.wrap{white-space:pre-wrap;overflow-wrap:anywhere}
.step-link{border:1.5px solid var(--rc,var(--line));background:var(--surface);border-radius:6px;padding:1px 8px;font:500 .82rem/1.5 var(--f-mono);cursor:pointer;white-space:nowrap}
.step-link:hover{background:color-mix(in srgb,var(--rc,var(--ink)) 12%,var(--surface))}
.steps-in{display:flex;flex-wrap:wrap;gap:5px}
.loop-steps{padding-left:1.3em;display:flex;flex-direction:column;gap:7px}
.trigger{border-left:3px solid var(--bug);padding-left:12px}
.foot{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:.88rem}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);padding:7px 22px;font-size:.95rem}
dialog.intro{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:920px;max-width:calc(100vw - 32px);height:fit-content;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:hidden}
dialog.intro[open]{display:flex;flex-direction:column}
.intro-body{flex:0 1 auto;min-height:0;overflow:auto;padding:20px 26px 16px;display:flex;flex-direction:column;gap:13px}
.intro-foot{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:12px 26px 16px;border-top:1px solid var(--line)}
.intro-body > p{max-width:92ch}
dialog.intro::backdrop{background:rgba(10,14,20,.58)}
.intro-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
dialog.intro h2{font:500 1.12rem/1.3 var(--f-display);text-wrap:balance}
.abbr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px;border-block:1px solid var(--line);padding-block:12px}
.abbr > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.abbr p{font-size:.9rem}
.ab{font:600 1rem/1.2 var(--f-mono);letter-spacing:.04em}
.intro-block{display:flex;flex-direction:column;gap:5px}
.intro-block .rows{margin-top:4px;font-size:.92rem}
.intro-block .rows li{grid-template-columns:7.6em minmax(0,1fr)}
@media (max-width:560px){.abbr{grid-template-columns:minmax(0,1fr)} .intro-body{padding:16px 16px 14px} .intro-foot{padding:10px 16px 14px}}
.btn:hover{border-color:var(--ink)}
.btn.up{display:none}
.intro{color:var(--muted);font-size:.9rem;max-width:66ch}

/* reference tabs */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:500px;font-size:.9rem}
th,td{text-align:left;padding:6px 10px;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font:500 .68rem/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
td.nw{white-space:nowrap}
td.num,th.num{font-variant-numeric:tabular-nums}
table.tight{font-size:.86rem}
table.tight th,table.tight td{padding:2px 9px}
table.tight .step-link{line-height:1.3;border-width:1px;font-size:.8rem}
.models li{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:2px 10px;align-items:baseline}
.models b{font-family:var(--f-mono);font-weight:600}
.acc summary.mcp-sum{flex-wrap:wrap;padding-block:6px;text-transform:none;letter-spacing:0;font:600 .95rem/1.3 var(--f-body);color:var(--ink)}
.mcp-name{flex:1;min-width:0}
.slots{display:grid;grid-template-columns:repeat(5,58px);gap:4px}
.slot{display:flex;justify-content:center;align-items:baseline;gap:5px;border:1.5px solid var(--rc);border-radius:7px;padding:2px 0;line-height:1.3;font-size:.74rem}
.slot .r{font-weight:600;color:var(--rc)}
.slot .a{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}

/* map: rows scale to the height the layout gives it */
function build(){
  var W=Math.floor(host.clientWidth); if(!W) return;
  var compact=W<480;
  if(free.matches){host.style.height=(8+16*(stacked.matches?(compact?40:42):34))+"px";} else host.style.height="";
  var H=Math.floor(host.clientHeight); if(!H) return;
  lastW=W; lastH=H;
  var rowH=Math.min(50,(H-8)/16);
  var nodeH=Math.max(15,Math.min(28,rowH-7));
  var fs=(compact||rowH<25)?10:(rowH<30?11:12), ms=rowH<32?5:7;
  var numW=compact?16:24, railW=compact?22:34, laneW=(W-numW-railW)/5;
  var top=(H-16*rowH)/2;
  lanesEl.style.paddingLeft=(numW+2)+"px"; lanesEl.style.paddingRight=(railW+2)+"px";
  mapcol.classList.toggle("compact",compact||laneW<84);
  host.textContent="";
  svg=el("svg",{viewBox:"0 0 "+W+" "+H,width:W,height:H,role:"group","aria-label":tr(U.svgLabel)},host);
  var defs=el("defs",{},svg);
  [["ah",ms,"ah"],["ahs",ms,"ahs"],["ahb",ms,"ahb"],["ahh",ms+5,"ahs"]].forEach(function(m){
    var mk=el("marker",{id:m[0],viewBox:"0 0 8 8",refX:7.2,refY:4,markerWidth:m[1],markerHeight:m[1],orient:"auto",markerUnits:"userSpaceOnUse"},defs);
    el("path",{d:"M0 0.9 L7.6 4 L0 7.1 Z","class":m[2]},mk);
  });
  ROLE_ORDER.forEach(function(r,i){el("rect",{x:numW+i*laneW+2,y:0,width:laneW-4,height:H,rx:8,"class":"band role-"+r,"data-role":r,"aria-hidden":"true"},svg);});
  for(var r=0;r<16;r++){var t=el("text",{x:numW/2,y:top+r*rowH+rowH/2+0.5,"text-anchor":"middle","dominant-baseline":"central","font-size":fs-1,"class":"rownum","aria-hidden":"true"},svg);t.textContent=r+1;}
  var P={};
  STEPS.forEach(function(s){
    var lab=tr((compact&&s.short)?s.short:s.label);
    var w=Math.max(38,Math.round(lab.length*fs*0.6+(compact?10:18)));
    P[s.id]={cx:numW+(ROLE_ORDER.indexOf(s.role)+0.5)*laneW,cy:top+s.row*rowH+rowH/2,w:w,h:nodeH,lab:lab};
  });
  var wires=el("g",{"aria-hidden":"true"},svg);
  for(var i=0;i<FLOW.length-1;i++){
    var a=P[FLOW[i]],b=P[FLOW[i+1]],cross=BY[FLOW[i]].role!==BY[FLOW[i+1]].role;
    var y1=a.cy+a.h/2,y2=b.cy-b.h/2-1,d;
    if(Math.abs(a.cx-b.cx)<1) d="M"+a.cx+" "+y1+"V"+y2;
    else {var my=Math.round((y1+y2)/2); d="M"+a.cx+" "+y1+"V"+my+"H"+b.cx+"V"+y2;}
    el("path",{d:d,"class":"wire"+(cross?" hand":""),"data-a":FLOW[i],"data-b":FLOW[i+1],"data-m":(cross?"ahs":"ah"),"marker-end":"url(#"+(cross?"ahs":"ah")+")"},wires);
  }
  var end=numW+5*laneW, rail1=end+railW*0.4, rail2=end+railW*0.82;
  var v=P.verify,f=P.fix,c=P.clarify,sc=P.screens,rv=P.review,im=P.implement;
  var vr=v.cx+v.w/2,vl=v.cx-v.w/2,fr=f.cx+f.w/2,off=Math.min(5,nodeH/2-4);
  function loop(k,d,solid){el("path",{d:d,"class":"loop"+(solid?" solid":""),"data-loop":k,"marker-end":"url(#ahb)"},wires);}
  loop("regress","M"+(vl-1)+" "+(v.cy-off)+"H"+(fr+2),true);
  loop("regress","M"+(fr+1)+" "+(f.cy+off)+"H"+(vl-2));
  loop("ac","M"+vr+" "+(v.cy-off+1)+"H"+rail1+"V"+c.cy+"H"+(c.cx+c.w/2+2));
  loop("screen","M"+vr+" "+(v.cy+off-1)+"H"+rail2+"V"+sc.cy+"H"+(sc.cx+sc.w/2+2));
  var bx=Math.max(rv.cx+rv.w/2,im.cx+im.w/2)+(compact?14:22);
  loop("review","M"+(rv.cx+rv.w/2+1)+" "+rv.cy+"C"+bx+" "+rv.cy+" "+bx+" "+im.cy+" "+(im.cx+im.w/2+2)+" "+im.cy);
  STEPS.forEach(function(s){
    var p=P[s.id];
    var g=el("g",{"class":"node role-"+s.role+(s.team?" team":""),"data-id":s.id,tabindex:0,role:"button","aria-label":tr(U.stepOf).replace("{n}",s.row+1)+", "+tr(ROLES[s.role].name)+": "+tr(s.title)},svg);
    el("rect",{x:p.cx-p.w/2,y:p.cy-p.h/2,width:p.w,height:p.h,rx:s.team?p.h/2:6},g);
    var t=el("text",{x:p.cx,y:p.cy+0.5,"text-anchor":"middle","dominant-baseline":"central","font-size":fs},g);t.textContent=p.lab;
  });
  svg.addEventListener("click",function(e){var n=e.target.closest(".node");if(n)choose("step",n.getAttribute("data-id"),true);});
  svg.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var n=e.target.closest(".node");if(n){e.preventDefault();choose("step",n.getAttribute("data-id"),false);}});
  applyState();
}
function applyState(){
  if(!svg) return;
  var lp=sel.kind==="loop"?LOOPS[sel.id]:null, st=sel.kind==="step"?sel.id:null;
  svg.classList.toggle("has-loop",!!lp);
  svg.classList.toggle("focus",!!lp||sel.kind==="role");
  svg.querySelectorAll(".loop").forEach(function(p){p.classList.toggle("on",!!lp&&p.getAttribute("data-loop")===sel.id);});
  svg.querySelectorAll(".wire").forEach(function(p){
    var hot=!!st&&(p.getAttribute("data-a")===st||p.getAttribute("data-b")===st);
    p.classList.toggle("hot",hot);
    p.setAttribute("marker-end","url(#"+(hot?"ahh":p.getAttribute("data-m"))+")");
    if(hot) p.parentNode.appendChild(p);
  });
  svg.querySelectorAll(".node").forEach(function(n){
    var id=n.getAttribute("data-id"),s=BY[id];
    n.classList.toggle("active",st===id);
    n.classList.toggle("dim",(sel.kind==="role"&&s.role!==sel.id)||(!!lp&&lp.nodes.indexOf(id)<0));
    n.classList.toggle("ring",!!lp&&lp.nodes.indexOf(id)>=0);
  });
  svg.querySelectorAll(".band").forEach(function(b){b.classList.toggle("on",sel.kind==="role"&&b.getAttribute("data-role")===sel.id);});
  lanesEl.querySelectorAll(".lane-btn").forEach(function(b){b.setAttribute("aria-pressed",String(sel.kind==="role"&&b.getAttribute("data-role")===sel.id));});
  document.querySelectorAll(".loop-btn").forEach(function(b){b.setAttribute("aria-pressed",String(sel.kind==="loop"&&b.getAttribute("data-loop")===sel.id));});
  $("prep").setAttribute("aria-pressed",String(sel.kind==="prep"));
}

  h+='<div class="d-top role-'+s.role+'"><div class="d-line">'+rchip(s.role)+'<span>'+esc(tr(U.stepOf).replace("{n}",s.row+1))+'</span><span class="tag">'+esc(tr(s.team?U.tagTeam:U.tagSdd))+'</span><span class="jira">Jira: <b>'+esc(s.jira)+'</b></span>'+
    '<span class="walk"><button class="ib arrow" type="button" data-restart="1"'+(p?"":" disabled")+' aria-label="'+esc(tr(S.restart))+'" title="'+esc(tr(S.restart))+'">«</button>'+
    '<button class="ib arrow" type="button" data-nav="'+(p||"")+'"'+(p?"":" disabled")+' aria-label="'+esc(tr(U.prev))+'">←</button>'+
    '<button class="ib" type="button" data-play="1" aria-pressed="'+String(!!timer)+'">'+esc(tr(timer?U.pause:U.play))+'</button>'+
    '<button class="ib arrow'+(hintNext&&n?" hint":"")+'" type="button" data-nav="'+(n||"")+'"'+(n?"":" disabled")+' aria-label="'+esc(tr(U.next))+'" title="'+esc(tr(U.next))+'"><span class="ar">→</span></button></span></div>'+
    '<h2>'+esc(tr(s.title))+'</h2><p class="sum">'+esc(tr(SUM[s.id]))+'</p>'+
    (s.cmds.length?'<div class="cmdrow">'+s.cmds.map(function(c){return '<span class="cmd"><code>'+esc(c)+'</code>'+copyBtn(c)+'</span>';}).join("")+'</div>':'')+'</div>';
  var to=s.handoff.filter(function(x){return x[0]!==s.role;});
  var info=cell(U.toolsHere,'<ul class="tools">'+toolsFor(s).map(function(t){var g=TOOLREG[t[0]];return '<li><b>'+esc(g.name)+'</b><span><span class="tw">'+esc(tr(g.where))+'</span>'+fmt(t[1])+'</span></li>';}).join("")+'</ul>');
  info+='<div class="grid2">'+
    cell(U.reads,'<div class="chips">'+s.reads.map(src).join("")+'</div>')+
    cell(U.outShort,'<div class="chips">'+s.writes.map(function(w){return artChip(w[0]);}).join("")+'</div>')+
    '</div>';
  info+='<div class="handline"><span class="k">'+esc(tr(U.handShort))+'</span>'+(to.length?to.map(function(x){return rchip(x[0]);}).join(""):'<span class="plain">'+esc(tr(n?U.sameRole:U.endCycle))+'</span>')+'</div>';
  var pr=PROMPT[s.id]||s.prompt, ex=EXADD[s.id]||s.example;
  var parts=[["what",U.secWhat,'<ul>'+s.does.map(function(d){return '<li>'+fmt(d)+'</li>';}).join("")+'</ul>']];
  if(pr){
    var blocks=Array.isArray(pr)?pr:[[null,pr]];
    parts.push(["prompt",U.secPrompt,'<p class="cap">'+esc(tr(U.promptBy))+' <b>'+esc(tr(ROLES[s.role].name))+'</b></p>'+blocks.map(function(bk){
      return '<div class="pblock"><div class="caprow"><p class="cap">'+(bk[0]?esc(tr(bk[0])):"")+'</p>'+copyBtn(tr(bk[1]))+'</div><pre class="wrap">'+esc(tr(bk[1]))+'</pre></div>';}).join("")]);
  }
  if(CHAT[s.id]) parts.push(["chat",U.secChat,'<p class="cap">'+esc(tr(U.chatCap))+'</p><ul class="chat">'+CHAT[s.id].map(function(m){
    return m[0]==="sec"?'<li class="c-sec">'+esc(tr(m[1]))+'</li>':'<li class="c-'+m[0]+'"><span class="who">'+(m[0]==="po"?esc(tr(ROLES[s.role].s)):m[0]==="cl"?"Claude":"")+'</span><span class="say">'+esc(tr(m[1]))+'</span></li>';}).join("")+'</ul>']);
  if(ex) parts.push(["ex",U.secEx,(EXCAP[s.id]?'<p class="cap">'+esc(tr(EXCAP[s.id]))+'</p>':'')+'<pre>'+esc(tr(ex))+'</pre>']);
  parts.push(["out",U.secOut,'<ul class="rows">'+s.writes.map(function(w){return '<li><span>'+art(w[0])+'</span><span class="v">'+esc(tr(w[1]))+'</span></li>';}).join("")+'</ul>'+
    (s.handoff.length?'<ul class="rows">'+s.handoff.map(function(x){return '<li><span>→ '+rchip(x[0])+'</span><span>'+fmt(x[1])+'</span></li>';}).join("")+'</ul>':'')]);
  var want=openSec===null?"what":openSec;
  var cur=parts.some(function(x){return x[0]===want;})?want:(openSec==="none"?null:"what");
  h+='<div class="more"><div class="more-tabs" role="group" aria-label="'+esc(tr(U.moreLabel))+'">'+parts.map(function(x){return '<button type="button" class="mt" data-sec="'+x[0]+'" aria-expanded="'+String(x[0]===cur)+'">'+esc(tr(x[1]))+'</button>';}).join("")+'</div>'+
    parts.map(function(x){return '<div class="more-body" data-body="'+x[0]+'"'+(x[0]===cur?"":" hidden")+'>'+x[2]+'</div>';}).join("")+'</div>';
  h+=info;
  if(stacked.matches) h+='<div class="foot"><button class="btn up" type="button" data-up="1">'+esc(tr(U.toMap))+'</button></div>';
  return h;
}
function roleHTML(k){
  var r=ROLES[k];
  var mine=STEPS.filter(function(s){return s.role===k;});
  var mcp=MCP.filter(function(m){return m.cells[k]!=="-";});
  var h='<div class="d-top role-'+k+'"><div class="d-line">'+rchip(k)+'<span>'+esc(tr(U.roleCard))+' · '+mine.length+' '+plural(mine.length)+' '+esc(tr(U.onMap))+'</span></div><h2>'+esc(tr(r.name))+'</h2><p class="sum">'+esc(tr(r.scope))+'</p>'+
    '<div class="steps-in">'+mine.map(function(s){return '<button type="button" class="step-link" data-nav="'+s.id+'">'+(s.row+1)+' · '+esc(tr(s.label))+'</button>';}).join("")+'</div></div>';
  h+='<div class="acc">'+
    sec("r1",U.secTools,'<div class="grid2">'+
      cell(U.tools,'<ul>'+r.tools.map(function(t){return '<li>'+esc(tr(t))+'</li>';}).join("")+'</ul>')+
      cell("MCP",'<ul class="rows">'+mcp.map(function(m){return '<li><span class="kk">'+esc(m.name)+'</span><span class="v">'+esc(tr(U[m.cells[k]]))+'</span></li>';}).join("")+'</ul>')+'</div>',true)+
    sec("r2",U.secCtx,'<div class="grid2">'+
      cell(U.context,'<div class="chips">'+r.ctx.map(src).join("")+'</div>')+
      cell(U.commands,'<div class="chips">'+r.cmds.map(function(c){return '<code>'+esc(tr(c))+'</code>';}).join("")+'</div>')+'</div>',false)+
    sec("r3",U.secOutH,'<div class="grid2">'+
      cell(U.out,'<ul>'+r.out.map(function(o){return '<li>'+rich(o)+'</li>';}).join("")+'</ul>')+
      cell(U.handsTo,'<ul class="rows">'+r.to.map(function(x){return '<li><span>'+rchip(x[0])+'</span><span>'+fmt(x[1])+'</span></li>';}).join("")+'</ul>')+'</div>',false)+
    '</div>';
  h+='<div><button type="button" class="btn" data-setup="'+k+'">'+esc(tr(U.setupBtn))+'</button></div>';
  return h+footRow();
}
function loopHTML(k){
  var l=LOOPS[k];
  var h='<div class="d-top" style="--rc:var(--bug)"><div class="d-line"><span>'+esc(tr(U.back))+'</span></div><h2>'+esc(tr(l.title))+'</h2><p class="trigger">'+esc(tr(l.trigger))+'</p></div>';
  h+=cell(U.who,'<ol class="loop-steps">'+l.steps.map(function(s){return '<li>'+rchip(s[0])+' '+fmt(s[1])+'</li>';}).join("")+'</ol>');
  h+='<div class="grid2">'+cell(U.updates,'<p>'+fmt(l.updates)+'</p>')+
    cell(U.stepsOnMap,'<div class="steps-in">'+l.nodes.map(function(id){return '<button type="button" class="step-link role-'+BY[id].role+'" data-nav="'+id+'">'+(BY[id].row+1)+' · '+esc(tr(BY[id].label))+'</button>';}).join("")+'</div>')+'</div>';
  return h+footRow();
}
function prepHTML(){
  var h='<div class="d-top"><div class="d-line"><span>'+esc(tr(U.step0))+'</span><span class="tag">'+esc(tr(U.once))+'</span></div><h2>'+esc(tr(U.prepTitle))+'</h2><p class="sum">'+esc(tr(U.prepSub))+'</p>'+
    '<div class="cmdrow"><span class="cmd"><code>/plugin marketplace add genkovich/sdd</code>'+copyBtn("/plugin marketplace add genkovich/sdd")+'</span><span class="cmd"><code>/plugin install sdd@sdd</code>'+copyBtn("/plugin install sdd@sdd")+'</span></div></div>';
  h+=cell(U.whoPrep,'<ul class="rows">'+
    '<li><span>'+rchip("dev")+'</span><span>'+tr(U.prepDev)+'</span></li>'+
    '<li><span>'+rchip("des")+'</span><span>'+tr(U.prepDes)+'</span></li>'+
    '<li><span>'+rchip("pm")+'</span><span>'+tr(U.prepPm)+'</span></li></ul>');
  h+='<div class="acc">'+
    sec("shared",U.shared,'<ul class="rows">'+
      '<li><span><code>CLAUDE.md</code></span><span class="v">'+esc(tr(U.fClaude))+'</span></li>'+
      '<li><span><code>.mcp.json</code></span><span class="v">'+esc(tr(U.fMcp))+'</span></li>'+
      '<li><span><code>.claude/sdd.local.md</code></span><span class="v">'+esc(tr(U.fLocal))+'</span></li></ul>',true)+
    sec("teamset",U.teamSet,'<pre>'+esc(tr(U.settings))+'</pre>',false)+'</div>';
  return h+footRow();
}
/* reference tabs */
function handHTML(){
  var rows=[];
  STEPS.forEach(function(s){s.handoff.forEach(function(x){if(x[0]!==s.role)rows.push([s,x]);});});
  return '<p class="intro">'+tr(S.handIntro)+'</p><div class="scroll"><table><thead><tr><th>'+esc(tr(U.thAfter))+'</th><th>'+esc(tr(U.fromTo))+'</th><th>'+esc(tr(U.thWhat))+'</th></tr></thead><tbody>'+rows.map(function(r){
    return '<tr><td class="nw"><button type="button" class="step-link role-'+r[0].role+'" data-nav="'+r[0].id+'">'+(r[0].row+1)+' · '+esc(tr(r[0].label))+'</button></td><td class="nw">'+rchip(r[0].role)+' → '+rchip(r[1][0])+'</td><td>'+fmt(r[1][1])+'</td></tr>';}).join("")+'</tbody></table></div>';
}
function mcpHTML(){
  return '<p class="intro">'+tr(S.toolsIntro)+'</p><div class="acc">'+TOOLTAB.map(function(m,i){
    var used=STEPS.filter(function(st){return toolsFor(st).some(function(t){return t[0]===m.key;});});
    return '<details name="acc" data-sec="m'+i+'"'+(i===0?" open":"")+'><summary class="mcp-sum"><span class="mcp-name">'+esc(m.name)+'</span><span class="slots">'+ROLE_ORDER.map(function(r){var c=m.cells[r];return '<span class="slot role-'+r+' s-'+(c==="-"?"none":c)+'" title="'+esc(tr(ROLES[r].name))+'"><span class="r">'+esc(tr(ROLES[r].s))+'</span><span class="a">'+(c==="-"?"—":c)+'</span></span>';}).join("")+'</span></summary><div class="in"><p class="plain">'+esc(tr(m.what))+'</p>'+
      '<div class="handline"><span class="k">'+esc(tr(U.usedAt))+'</span>'+used.map(function(st){return '<button type="button" class="step-link role-'+st.role+'" data-nav="'+st.id+'">'+(st.row+1)+' · '+esc(tr(st.label))+'</button>';}).join("")+'</div>'+
      (m.cmds.length?'<div class="mcp-cmd">'+m.cmds.map(function(c){return '<span class="cmd"><code>'+esc(c)+'</code>'+copyBtn(c)+'</span>';}).join("")+'</div>':'')+
      '</div></details>';}).join("")+
    '</div><div class="keyline">'+tr(S.mcpLegend)+'</div>';
}
function filesHTML(){
  return '<p class="intro">'+tr(S.artIntro)+'</p><div class="scroll"><table><thead><tr><th>'+esc(tr(U.thFile))+'</th><th>'+esc(tr(U.thWrites))+'</th><th>'+esc(tr(U.thReads))+'</th><th>'+esc(tr(U.thCopy))+'</th></tr></thead><tbody>'+ARTS.map(function(a){
    return '<tr><td><code>'+esc(a[0])+'</code></td><td class="nw">'+rchip(a[1])+'</td><td>'+esc(tr(a[2]))+'</td><td>'+esc(tr(a[3]))+'</td></tr>';}).join("")+'</tbody></table></div>';
}
function rulesHTML(){
  return '<h2>'+esc(tr(S.rulesH))+'</h2><ul class="rule-list"><li>'+tr(S.rule1)+'</li><li>'+tr(S.rule2)+'</li><li>'+tr(S.rule3)+'</li></ul>'+
    '<p class="intro">'+esc(tr(U.roleProposal))+'</p>'+
    '<div class="acc">'+sec("hb",U.handBlock,'<figure><pre>'+esc(tr(S.figPre))+'</pre><figcaption>'+esc(tr(S.figCap))+'</figcaption></figure>',false)+
    sec("dec",S.decH,'<ul class="decide">'+tr(S.decList)+'</ul>',false)+'</div>'+
    '<p class="sources"><span>'+esc(tr(S.srcLabel))+'</span><a href="https://github.com/genkovich/sdd">genkovich/sdd</a><a href="https://support.atlassian.com/atlassian-rovo-mcp-server/docs/getting-started-with-the-atlassian-remote-mcp-server/">Atlassian Rovo MCP Server</a><a href="https://shopify.dev/docs/apps/build/devmcp">Shopify Dev MCP</a><a href="https://claude.ai/design">Claude Design</a></p>';
}
function renderPane(){
  $("tabs").innerHTML=TABS.map(function(t){return '<button type="button" class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+String(tab===t[0])+'">'+esc(tr(t[1]))+'</button>';}).join("");
  panel.innerHTML=tab==="hand"?handHTML():tab==="mcp"?mcpHTML():tab==="files"?filesHTML():tab==="cost"?costHTML():tab==="rules"?rulesHTML():tab==="setup"?setupHTML():
    (sel.kind==="step"?stepHTML(BY[sel.id]):sel.kind==="role"?roleHTML(sel.id):sel.kind==="loop"?loopHTML(sel.id):prepHTML());
  /* keep the pane free of scrolling: a section opened by default closes again if it does not fit */
  if(!free.matches&&tab==="step"&&!(sel.kind==="step"&&openSec!==null)&&panel.scrollHeight>panel.clientHeight+2){
    var o=panel.querySelector(".acc details[open]"); if(o) o.open=false;
    var mb=panel.querySelector(".more-body:not([hidden])");
    if(mb){mb.hidden=true; var bt=panel.querySelector('.mt[aria-expanded="true"]'); if(bt) bt.setAttribute("aria-expanded","false");}
  }
}
function stopPlay(){if(timer){clearInterval(timer);timer=null;}}
function choose(kind,id,scroll,fromPlay){
  if(!fromPlay) stopPlay();
  if(kind==="step"&&!(sel.kind==="step"&&sel.id===id)) hintNext=false;
  if(sel.kind===kind&&sel.id===id&&kind!=="step"){sel={kind:"step",id:lastStep};}
  else sel={kind:kind,id:id};
  if(sel.kind==="step") lastStep=sel.id;
  tab="step";
  applyState(); renderPane(); panel.scrollTop=0;
  if(scroll&&stacked.matches) $("pane").scrollIntoView({block:"start"});
}
function step(delta){
  var i=ORDER.indexOf(sel.kind==="step"?sel.id:lastStep)+delta;
  if(i>=0&&i<ORDER.length) choose("step",ORDER[i],false);
}
function togglePlay(){
  if(timer){stopPlay();renderPane();return;}
  if(ORDER.indexOf(sel.id)>=ORDER.length-1) choose("step",ORDER[0],false);
  timer=setInterval(function(){
    var i=ORDER.indexOf(sel.id);
    if(sel.kind!=="step"||i<0||i>=ORDER.length-1){stopPlay();renderPane();return;}
    choose("step",ORDER[i+1],false,true);
    if(ORDER.indexOf(sel.id)>=ORDER.length-1){stopPlay();renderPane();}
  },2800);
  renderPane();
}

/* everything that depends on the language */
function renderChrome(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(function(e){e.innerHTML=tr(S[e.getAttribute("data-i18n")]);});
  document.querySelectorAll(".lang").forEach(function(g){g.setAttribute("aria-label",tr(U.langLabel));});
  document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-lang")===LANG));});
  var tt=totals(),mx=seatMix();
  $("hchips").innerHTML='<button type="button" class="hchip money" data-cost="c1" title="'+esc(tr(U.costTip))+'">'+esc(tr(U.hFeature))+' <b>≈ '+tt.tok+'</b> '+esc(tr(U.tokens))+' · <b>≈ '+tt.usd+'</b></button>'+
    '<button type="button" class="hchip" data-cost="c3">'+esc(tr(U.hPlan))+': <b>'+mx.std+' Standard + '+mx.prem+' Premium</b> · <b>$'+mx.month+'</b>'+esc(tr(U.perMonth))+'</button>';
  $("intro-roles").innerHTML=ROLE_ORDER.map(function(r){return '<li><span>'+rchip(r)+'</span><span>'+esc(tr(INTRO_ROLE[r]))+'</span></li>';}).join("");
  lanesEl.innerHTML=ROLE_ORDER.map(function(r){return '<button type="button" class="lane-btn role-'+r+'" data-role="'+r+'" aria-pressed="false" title="'+esc(tr(ROLES[r].name))+'"><span class="l">'+esc(tr(ROLES[r].l))+'</span><span class="s">'+esc(tr(ROLES[r].s))+'</span></button>';}).join("");
  $("loopbtns").innerHTML=Object.keys(LOOPS).map(function(k){return '<button type="button" class="chipbtn loop-btn" data-loop="'+k+'" aria-pressed="false" title="'+esc(tr(LOOPS[k].btn))+'">'+esc(tr(LB[k]))+'</button>';}).join("");
  lastW=0; build(); renderPane();
}
function setLang(l){
  if(l!=="en"&&l!=="uk") return;
  LANG=l;
  try{localStorage.setItem("sdlc-map-lang",l);}catch(e){}
  renderChrome();
}

/* events */
var intro=$("intro");
function openIntro(){if(intro.open)return;try{intro.showModal();}catch(e){intro.setAttribute("open","");}}
function closeIntro(){if(!intro.open)return;try{intro.close();}catch(e){intro.removeAttribute("open");}}
intro.addEventListener("click",function(e){
  if(e.target!==intro) return;
  var r=intro.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) closeIntro();
});
lanesEl.addEventListener("click",function(e){var b=e.target.closest(".lane-btn");if(b)choose("role",b.getAttribute("data-role"),true);});
$("loopbtns").addEventListener("click",function(e){var b=e.target.closest(".loop-btn");if(b)choose("loop",b.getAttribute("data-loop"),true);});
$("prep").addEventListener("click",function(){choose("prep","prep",true);});
$("tabs").addEventListener("click",function(e){var b=e.target.closest("[data-tab]");if(b){stopPlay();tab=b.getAttribute("data-tab");renderPane();panel.scrollTop=0;}});
panel.addEventListener("toggle",function(e){
  var d=e.target; if(!d.matches||!d.matches("details[data-sec]")||!d.open) return;
  d.parentNode.querySelectorAll("details[open]").forEach(function(o){if(o!==d)o.open=false;});
  if(tab==="setup"&&/^s\d$/.test(d.getAttribute("data-sec"))) setupOpen=d.getAttribute("data-sec");
},true);
panel.addEventListener("click",function(e){
  var b=e.target.closest(".mt"); if(!b) return;
  var id=b.getAttribute("data-sec");
  openSec=b.getAttribute("aria-expanded")==="true"?"none":id;
  renderPane();
  var again=panel.querySelector('.mt[data-sec="'+id+'"]'); if(again) again.focus();
});
document.addEventListener("click",function(e){
  var lg=$("lg"); if(lg.open&&!lg.contains(e.target)) lg.open=false;
  var ib=e.target.closest("[data-info]"),pop=$("cost-pop");
  if(pop&&!pop.contains(e.target)){
    var show=!!ib&&pop.hidden; pop.hidden=!show;
    var btn=panel.querySelector("[data-info]"); if(btn) btn.setAttribute("aria-expanded",String(show));
    if(ib) return;
  }
  var c=e.target.closest("[data-copy]");
  if(c){
    var t=c.getAttribute("data-copy"),reset=function(){setTimeout(function(){c.textContent=tr(U.copy);},1400);};
    var done=function(){c.textContent=tr(U.copied);reset();};
    var fallback=function(){var codeEl=c.parentNode.querySelector("code")||((c.closest(".pblock")||c.parentNode.parentNode||c.parentNode).querySelector("pre"));if(codeEl){var r=document.createRange();r.selectNodeContents(codeEl);var s=window.getSelection();s.removeAllRanges();s.addRange(r);c.textContent=tr(U.selected);reset();}};
    try{navigator.clipboard.writeText(t).then(done,fallback);}catch(err){fallback();}
    return;
  }
  var lb=e.target.closest("[data-lang]");
  if(lb){if(lb.getAttribute("data-lang")!==LANG)setLang(lb.getAttribute("data-lang"));return;}
  if(e.target.closest("[data-about]")){stopPlay();openIntro();return;}
  var su=e.target.closest("[data-setup]");
  if(su){stopPlay();tab="setup";setupRole=su.getAttribute("data-setup");renderPane();panel.scrollTop=0;if(stacked.matches)$("pane").scrollIntoView({block:"start"});return;}
  var cc=e.target.closest("[data-cost]");
  if(cc){stopPlay();tab="cost";costOpen=cc.getAttribute("data-cost");renderPane();panel.scrollTop=0;if(stacked.matches)$("pane").scrollIntoView({block:"start"});return;}
  if(e.target.closest("[data-close]")) closeIntro();
  if(e.target.closest("[data-restart]")){choose("step",ORDER[0],true);return;}
  if(e.target.closest("[data-play]")){togglePlay();return;}
  if(e.target.closest("[data-up]")){$("app").scrollIntoView({block:"start"});return;}
  var n=e.target.closest("[data-nav]");
  if(n&&n.getAttribute("data-nav")) choose("step",n.getAttribute("data-nav"),false);
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){var cp=$("cost-pop");if(cp&&!cp.hidden){cp.hidden=true;var ibn=panel.querySelector("[data-info]");if(ibn){ibn.setAttribute("aria-expanded","false");ibn.focus();}}return;}
  if(intro.open||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey) return;
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft") return;
  var tg=e.target&&e.target.tagName; if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT") return;
  e.preventDefault(); step(e.key==="ArrowRight"?1:-1);
});
if(window.ResizeObserver){new ResizeObserver(function(){var w=Math.floor(host.clientWidth),h=Math.floor(host.clientHeight);if(w!==lastW||(!free.matches&&h!==lastH))build();}).observe(host);}
else window.addEventListener("resize",build);
renderChrome();
openIntro();
})();
</script>
