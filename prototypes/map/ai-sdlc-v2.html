<title>AI-SDLC Map V2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: a one-screen app. A slim top bar, then two panes that share the viewport height: the role-lane map on the left (rows scale to the height), a tabbed detail pane on the right with collapsible sections. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E2E7EC; --ink:#17212B; --muted:#566472; --line:#CDD5DD; --wire:#8492A0; --accent:#0C6B73;
  --po:#A65F00; --pm:#6247CF; --des:#B82C78; --dev:#1C68C4; --qa:#127A52; --ops:#66700F; --bug:#C2352B; --on-role:#FFFFFF;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Onest','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141A; --surface:#171E27; --sunk:#1F2833; --ink:#E4EAF0; --muted:#94A2B1; --line:#2B3644; --wire:#6C7A8A; --accent:#56C5CE;
    --po:#F2B24C; --pm:#AC9BFF; --des:#F47DB9; --dev:#74B4FF; --qa:#55D3A0; --ops:#C5CF5A; --bug:#FF8073; --on-role:#0F141A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#171E27; --sunk:#1F2833; --ink:#E4EAF0; --muted:#94A2B1; --line:#2B3644; --wire:#6C7A8A; --accent:#56C5CE;
  --po:#F2B24C; --pm:#AC9BFF; --des:#F47DB9; --dev:#74B4FF; --qa:#55D3A0; --ops:#C5CF5A; --bug:#FF8073; --on-role:#0F141A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{box-sizing:border-box;height:100%}
body{height:100%;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f-body)}
.role-po{--rc:var(--po)} .role-pm{--rc:var(--pm)} .role-des{--rc:var(--des)} .role-dev{--rc:var(--dev)} .role-qa{--rc:var(--qa)} .role-ops{--rc:var(--ops)}
h1,h2,h3,p,ul,ol,pre,figure{margin:0}
ul,ol{padding-left:1.15em}
code,pre{font-family:var(--f-mono);font-size:.86em}
code{background:var(--sunk);padding:.08em .36em;border-radius:4px;overflow-wrap:anywhere}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

.app{height:100%;max-width:1480px;margin-inline:auto;padding-inline:clamp(16px,2vw,28px);padding-block:10px;display:flex;flex-direction:column;gap:8px}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 18px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{font:600 1.08rem/1.25 var(--f-display);letter-spacing:-.01em}
.h1row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.ver{flex:none;font:700 .8rem/1.5 var(--f-body);letter-spacing:.02em;white-space:nowrap;color:var(--surface);background:var(--accent);border-radius:99px;padding:1px 10px}
.sub{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:.86rem;color:var(--muted)}
.sub b{color:var(--ink);font-weight:600}
.sub .meta{display:inline-flex;flex-wrap:wrap;gap:2px 10px}
.bar-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.bar-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px 10px}
@media (max-width:759px){.bar-right{flex:1 1 100%;align-items:flex-start}.bar-btns{justify-content:flex-start}}
.btn.restart{padding:3px 12px;font-size:.84rem}
.hchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:759px){.hchips{justify-content:flex-start}}
.hchip{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--surface));background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink);border-radius:99px;padding:1px 10px;font-size:.8rem;line-height:1.5;cursor:pointer;white-space:nowrap}
.hchip:hover{border-color:var(--accent)}
.hchip b{color:var(--accent);font-weight:600}
.coststrip{display:flex;flex-wrap:wrap;gap:2px 11px;align-items:baseline;background:color-mix(in srgb,var(--accent) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--surface));border-radius:9px;padding:5px 10px}
.coststrip .cv{display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
.coststrip b{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.coststrip{position:relative}
.info-btn{margin-left:auto;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--surface));background:var(--surface);color:var(--accent);border-radius:99px;padding:0 9px;font-size:.76rem;font-weight:600;line-height:1.5;cursor:pointer}
.info-btn:hover,.info-btn[aria-expanded="true"]{background:var(--accent);color:var(--surface)}
.cost-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:4;width:min(380px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.86rem;line-height:1.45;box-shadow:0 6px 18px rgba(10,14,20,.18)}
.coststrip .money b{color:var(--bug);font-weight:700;font-size:1.04em}
.hchip.money b{color:var(--bug);font-weight:700}
.coststrip .est{margin-left:auto;font:500 .66rem/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lang{flex:none;display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;padding:4px 11px;font:500 .76rem/1.4 var(--f-mono);cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible{outline-offset:-2px}

/* stage */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(360px,.88fr) minmax(0,1.12fr);gap:16px}
.mapcol{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.hintrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;position:relative}
.hr-right{display:inline-flex;align-items:center;gap:12px}
.hint{font-size:.8rem;color:var(--muted)}
.lanes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.lane-btn{border:1.5px solid var(--rc);color:var(--rc);background:color-mix(in srgb,var(--rc) 9%,var(--surface));border-radius:7px;padding:3px 2px;font-weight:600;font-size:.8rem;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden}
.lane-btn[aria-pressed="true"]{background:var(--rc);color:var(--on-role)}
.lane-btn .s{display:none}
.compact .lane-btn .l{display:none} .compact .lane-btn .s{display:inline}
#map{flex:1;min-height:0;position:relative}
#map svg{position:absolute;left:0;top:0;display:block}
.band{fill:var(--rc);fill-opacity:.07} .band.on{fill-opacity:.17}
.rownum{fill:var(--muted);font-family:var(--f-mono)}
.wire{fill:none;stroke:var(--wire);stroke-width:1.3}
.wire.hand{stroke:var(--ink);stroke-width:1.7}
.wire{transition:stroke-width .18s ease}
.wire.hot{stroke:var(--ink);stroke-width:3.4}
@media (prefers-reduced-motion:reduce){.wire{transition:none}}
.ah{fill:var(--wire)} .ahs{fill:var(--ink)} .ahb{fill:var(--bug)}
.loop{fill:none;stroke:var(--bug);stroke-width:1.4;stroke-dasharray:5 4;opacity:.55}
.loop.solid{stroke-dasharray:none}
.focus .wire{opacity:.28}
.has-loop .loop{opacity:.16}
.has-loop .loop.on{opacity:1;stroke-width:2.3}
.node{cursor:pointer}
.node rect{fill:var(--surface);stroke:var(--rc);stroke-width:1.5}
.node text{fill:var(--ink);font-family:var(--f-mono);font-weight:500}
.node.team text{font-family:var(--f-body)}
.node:hover rect{stroke-width:2.6}
.node:focus{outline:none}
.node:focus-visible rect{stroke:var(--ink);stroke-width:3}
.node.active rect{fill:var(--rc)}
.node.active text{fill:var(--on-role);font-weight:600}
.node.dim{opacity:.28}
.node.ring rect{stroke:var(--bug);stroke-width:2.6}
.under{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.under .lbl{font-size:.8rem;color:var(--muted)}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 9px;cursor:pointer;font-size:.8rem;white-space:nowrap}
.chipbtn b{font-family:var(--f-mono);font-weight:600;font-size:.92em}
.chipbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.loop-btn{border-style:dashed;border-color:var(--bug)}
.loop-btn[aria-pressed="true"]{border-style:solid;border-color:var(--bug);background:var(--bug);color:var(--on-role)}
.lg summary{list-style:none;cursor:pointer;font-size:.8rem;color:var(--muted);border-bottom:1px dotted var(--muted)}
.lg summary::-webkit-details-marker{display:none}
.lg .legend{position:absolute;right:0;top:calc(100% + 6px);z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.82rem;max-width:300px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.lg-box{flex:none;width:22px;height:13px;border:1.5px solid var(--muted);border-radius:3px;background:var(--surface)}
.lg-pill{flex:none;width:22px;height:13px;border:1.5px solid var(--muted);border-radius:99px;background:var(--surface)}
.lg-line{flex:none;width:22px;height:0;border-top:2px solid var(--ink)}
.lg-thin{flex:none;width:22px;height:0;border-top:1.3px solid var(--wire)}
.lg-dash{flex:none;width:22px;height:0;border-top:2px dashed var(--bug)}

/* pane */
.pane{container-type:inline-size;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs{display:flex;gap:2px;padding:4px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{border:0;background:transparent;padding:7px 9px 6px;border-bottom:2px solid transparent;font-weight:500;font-size:.88rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible{outline-offset:-2px}
.pane-body{flex:1;min-height:0;overflow:auto;padding:10px 18px 9px;display:flex;flex-direction:column;gap:9px}
.d-top{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--rc,var(--ink));padding-left:12px}
.d-line{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.82rem;color:var(--muted)}
.tag{font:500 .7rem/1 var(--f-mono);border:1px solid var(--line);border-radius:99px;padding:3px 8px;color:var(--muted)}
.walk{margin-left:auto;display:inline-flex;gap:4px}
.ib{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 12px;cursor:pointer;font-weight:600;font-size:.92rem;line-height:1.5;min-width:46px}
.ib.arrow{font-size:1.3rem;line-height:1.1;padding:3px 12px 5px}
.ib .ar{display:inline-block}
.ib.hint{border-color:var(--accent);background:var(--accent);color:var(--surface);animation:ring 1.15s ease-out infinite}
.ib.hint .ar{animation:nudge 1.15s ease-in-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent) 0%,transparent)}}
@keyframes nudge{0%,100%{transform:translateX(-2px)}50%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.ib.hint,.ib.hint .ar{animation:none}}
.ib:hover:not(:disabled){border-color:var(--ink)}
.ib:disabled{opacity:.4;cursor:default}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane h2{font:600 1.2rem/1.25 var(--f-body);text-wrap:balance}
.sum{max-width:62ch}
.cmdrow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.cmd{display:inline-flex;align-items:center;gap:6px;max-width:100%}
.cmd code{padding:3px 8px;border-radius:6px;font-weight:500}
.copy{border:1px solid var(--line);background:transparent;border-radius:6px;padding:1px 7px;font-size:.74rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.copy:hover{color:var(--ink);border-color:var(--ink)}
.jira{font-size:.84rem;color:var(--muted)} .jira b{color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px}
@container (max-width:470px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tools{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px}
.tools li{display:grid;grid-template-columns:11.5em minmax(0,1fr);gap:1px 12px;align-items:baseline;font-size:.9rem}
.tools b{font-weight:600}
.tw{display:inline-block;background:var(--sunk);border-radius:5px;padding:0 6px;margin-right:6px;font-size:.78rem;color:var(--muted)}
@container (max-width:470px){.tools li{grid-template-columns:minmax(0,1fr)}}
.handline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.cell{display:flex;flex-direction:column;gap:5px;min-width:0}
.k{font:500 .68rem/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips code,.src{background:var(--sunk);border-radius:5px;padding:1px 7px;font-size:.82rem;overflow-wrap:anywhere}
.src b{font-weight:600}
.plain{font-size:.88rem;color:var(--muted)}
.rows{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px}
.rows li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:3px 12px;align-items:baseline}
.rows .kk{font-weight:600}
.rows .v{color:var(--muted)}
.rchip{display:inline-block;padding:0 8px;border-radius:99px;border:1.5px solid var(--rc);color:var(--rc);font-weight:600;font-size:.76rem;line-height:1.55;background:color-mix(in srgb,var(--rc) 9%,var(--surface));white-space:nowrap}
.more{display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);padding-bottom:9px}
.more-tabs{display:flex;flex-wrap:wrap;gap:6px}
.mt{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 12px;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--muted)}
.mt::after{content:" +";font-family:var(--f-mono)}
.mt:hover{border-color:var(--ink);color:var(--ink)}
.mt[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mt[aria-expanded="true"]::after{content:" \2013"}
.more-body{display:flex;flex-direction:column;gap:8px}
.cap{font-size:.84rem;color:var(--muted)}
.rolepick{display:flex;flex-wrap:wrap;gap:6px}
.rolepick .lane-btn{padding:3px 12px;font-size:.84rem}
.setup-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:9px}
.setup-list li{display:flex;flex-direction:column;gap:4px}
.setup-list .v{color:var(--muted)}
.acc .in > p{max-width:70ch}
.caprow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px}
.more-body pre{line-height:1.42}
.pblock{display:flex;flex-direction:column;gap:4px}
.pblock .cap{flex:1;min-width:0}
.chat{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.9rem}
.chat li{display:grid;grid-template-columns:4.4em minmax(0,1fr);gap:2px 10px;align-items:baseline}
.chat .who{font:600 .74rem/1.5 var(--f-mono);letter-spacing:.04em}
.chat .say{white-space:pre-wrap;overflow-wrap:anywhere}
.chat .c-po .who{color:var(--po)}
.chat .c-po .say{background:color-mix(in srgb,var(--po) 9%,var(--surface));border-radius:7px;padding:2px 9px;justify-self:start}
.chat .c-cl .who{color:var(--accent)}
.chat .c-note .say{color:var(--muted);font-style:italic}
.chat .c-sec{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font:500 .68rem/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chat .c-sec:first-child{margin-top:0;padding-top:0;border-top:0}
.cap b{color:var(--ink);font-weight:600}
.more-body ul:not(.rows){display:flex;flex-direction:column;gap:4px}
.acc{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;padding:8px 2px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 .7rem/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:1rem;line-height:1;letter-spacing:0}
.acc details[open] > summary{color:var(--ink)}
.acc details[open] > summary::after{content:"\2013"}
.acc .in{padding:0 2px 12px;display:flex;flex-direction:column;gap:10px}
.acc .in ul:not(.rows){display:flex;flex-direction:column;gap:4px}
pre{background:var(--sunk);border-radius:8px;padding:10px 12px;overflow-x:auto;line-height:1.5;white-space:pre;max-width:100%}
pre.wrap{white-space:pre-wrap;overflow-wrap:anywhere}
.step-link{border:1.5px solid var(--rc,var(--line));background:var(--surface);border-radius:6px;padding:1px 8px;font:500 .82rem/1.5 var(--f-mono);cursor:pointer;white-space:nowrap}
.step-link:hover{background:color-mix(in srgb,var(--rc,var(--ink)) 12%,var(--surface))}
.steps-in{display:flex;flex-wrap:wrap;gap:5px}
.loop-steps{padding-left:1.3em;display:flex;flex-direction:column;gap:7px}
.trigger{border-left:3px solid var(--bug);padding-left:12px}
.foot{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:.88rem}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);padding:7px 22px;font-size:.95rem}
dialog.intro{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:920px;max-width:calc(100vw - 32px);height:fit-content;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:hidden}
dialog.intro[open]{display:flex;flex-direction:column}
.intro-body{flex:0 1 auto;min-height:0;overflow:auto;padding:14px 26px 10px;display:flex;flex-direction:column;gap:8px}
.intro-foot{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:12px 26px 16px;border-top:1px solid var(--line)}
.intro-body > p{max-width:92ch}
dialog.intro::backdrop{background:rgba(10,14,20,.58)}
.intro-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
dialog.intro h2{font:500 1.12rem/1.3 var(--f-display);text-wrap:balance}
.abbr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;border-block:1px solid var(--line);padding-block:9px}
.abbr > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.abbr p{font-size:.9rem}
.ab{font:600 1rem/1.2 var(--f-mono);letter-spacing:.04em}
.intro-block{display:flex;flex-direction:column;gap:5px}
.intro-block .rows{margin-top:3px;font-size:.9rem;gap:2px}
.intro-block .rows li{grid-template-columns:7.6em minmax(0,1fr)}
@media (max-width:560px){.abbr{grid-template-columns:minmax(0,1fr)} .intro-body{padding:16px 16px 14px} .intro-foot{padding:10px 16px 14px}}
.btn:hover{border-color:var(--ink)}
.btn.up{display:none}
.intro{color:var(--muted);font-size:.9rem;max-width:66ch}

/* teams strip, sign-off, repositories, seat inputs */
.scope{display:flex;flex-wrap:wrap;gap:5px 16px;align-items:center}
.teams,.repol{display:inline-flex;flex-wrap:wrap;gap:5px 6px;align-items:center;min-width:0}
.rl{display:inline-flex;align-items:baseline;gap:5px;border:1.5px solid var(--ink);border-radius:6px;padding:0 8px;font:600 .78rem/1.6 var(--f-mono);white-space:nowrap;background:var(--surface);color:var(--ink)}
.rl::before{content:"";align-self:center;width:7px;height:7px;border-radius:2px;background:var(--ink)}
.rl.ro{border-style:dashed;border-color:var(--muted);font-weight:500;color:var(--muted)}
.rl.ro::before{background:transparent;border:1.5px solid var(--muted)}
.rl i{font:400 .72rem/1 var(--f-body);font-style:normal}
.rl.any{font-family:var(--f-body)}
.rl.strong{background:var(--ink);color:var(--bg)}
.rl.strong::before{background:var(--bg)}
.rl.strong i{color:var(--bg)}

  dev:{name:T("Developers","Розробники"),l:T("Engineering","Розробка"),s:"Dev",

var STEPS=[
 {id:"specify",row:0,role:"po",label:"specify",title:T("Spec from an interview","Специфікація з інтерв'ю"),jira:"Discovery",
  cmds:["/sdd:interview "+SLUG,"/sdd:specify "+SLUG],
  does:[T("Claude asks 3–5 questions about the problem, the users and what success looks like. You bring the idea, not a document. `interview` before this is optional: it stress-tests the idea itself.","Claude ставить 3–5 питань про проблему, користувачів і ознаки успіху. Готовий документ приносити не треба, лише ідею. `interview` перед цим необов'язковий: він перевіряє саму ідею на міцність."),
        T("Writes `spec.md` with user stories and acceptance criteria (AC). AC describe behaviour only, with no technology in them.","Пише `spec.md` з історіями користувачів і критеріями приймання (AC). В AC немає технологій, лише поведінка."),
        T("Before writing, a critic agent in a clean context checks coherence.","Перед записом агент-критик у чистому контексті перевіряє зв'язність."),

  reads:["docs/architecture-map.md","docs/roadmap.md",T("Confluence: “Research: order problems handed over in chat”","Confluence: «Дослідження: проблеми із замовленнями в чатах»"),T("Jira: tickets labelled order-followup","Jira: звернення з міткою order-followup")],
  mcp:[[ATL,T("reads research from Confluence, finds related tickets in Jira, publishes a copy of the spec","читає дослідження з Confluence, шукає пов'язані звернення в Jira, публікує копію spec")]],
  writes:[[D+"spec.md",T("source of truth","джерело правди")],[".size, .route","M, standard"],[T("Confluence: “Tasks & issues · Spec”","Confluence: «Tasks & issues · Spec»"),T("copy for discussion","копія для обговорення")]],
  handoff:[],
  example:T("US-1  A staff member creates a task from an order and\n      assigns it to a colleague.\nUS-2  The assignee sees all their tasks in one list.\nUS-3  The author sees on the order when the task is done.\n\nAC-3  The assignee gets one notification when a task is\n      assigned to them.\nAC-4  Only staff with access to the order see its tasks.","US-1  Працівник створює завдання із замовлення\n      й призначає колезі.\nUS-2  Виконавець бачить усі свої завдання в одному списку.\nUS-3  Автор бачить на замовленні, що завдання виконано.\n\nAC-3  Виконавець отримує одне сповіщення, коли завдання\n      призначили йому.\nAC-4  Завдання бачать лише ті, хто має доступ до замовлення."),
  prompt:T("Before the interview, read the Confluence page “Research: order problems handed over in chat” and the Jira tickets labelled order-followup from the last 90 days. After writing spec.md, publish a copy to the SHOP space and add a link to the commit.","Перед інтерв'ю прочитай сторінку Confluence «Дослідження: проблеми із замовленнями в чатах» і звернення в Jira з міткою order-followup за останні 90 днів. Після запису spec.md опублікуй копію в просторі SHOP і додай у неї посилання на коміт.")},
 {id:"clarify",row:1,role:"po",label:"clarify",title:T("Closing ambiguities","Закриття неоднозначностей"),jira:"Spec Ready",
  cmds:["/sdd:clarify "+SLUG,"/sdd:glossary"],

        T("The analyst closes or explicitly defers each question. No silent assumptions remain.","Кожне питання аналітик закриває або явно відкладає. Мовчазних припущень не лишається."),
        T("New terms go into `CONTEXT.md` so everyone downstream uses the same words.","Нові терміни потрапляють у `CONTEXT.md`, щоб далі всі називали речі однаково.")],
  reads:[D+"spec.md"],
  mcp:[[ATL,T("updates the Confluence page, creates epic SHOP-412 linked to the spec","оновлює сторінку в Confluence, створює епік SHOP-412 з посиланням на spec")]],
  writes:[["spec.md",T("tightened","уточнений")],["CONTEXT.md",T("terms: task, issue, assignee","терміни: завдання, проблема, виконавець")],[T("Jira: epic SHOP-412","Jira: епік SHOP-412"),T("status Spec Ready","статус Spec Ready")]],
  handoff:[["pm",T("Epic SHOP-412 linked to `spec.md`, size M, route standard.","Епік SHOP-412 з посиланням на `spec.md`, розмір M, маршрут standard.")]],
  example:T("Question  Is an issue a separate entity or a kind of task?\nDecision  One entity with a type: task or issue.\n\nQuestion  What can a task be linked to?\nDecision  An order, a product or a customer. One link per task.\n\nDeferred  Comments and attachments. Not in this feature.","Питання     Проблема окрема сутність чи вид завдання?\nРішення     Одна сутність із типом: task або issue.\n\nПитання     До чого можна прив'язати завдання?\nРішення     До замовлення, товару або клієнта. Одна прив'язка.\n\nВідкладено  Коментарі й вкладення. Не в цій фічі.")},
 {id:"epic",row:2,role:"pm",label:T("epic","епік"),team:true,title:T("Epic, size, place in the roadmap","Епік, розмір, місце в roadmap"),jira:"Spec Ready → "+JD,
  cmds:["/sdd:classify-size "+SLUG],

        T("Places the feature in `docs/roadmap.md`: dependencies and execution wave. SDD marks the step spec'd on its own after specify.","Ставить фічу в `docs/roadmap.md`: залежності й хвиля виконання. Статус spec'd SDD проставляє сам після specify."),

  handoff:[["des",T("Epic linked to `spec.md`. Start with ux-flows.","Епік з посиланням на `spec.md`. Починати з ux-flows.")],["dev",T("For the tech lead: get ready for tech-design right after ux-flows.","Техліду: готуватися до tech-design одразу після ux-flows.")]],
  example:T("Roadmap, wave 3\n  tasks-issues (M)\n    depends on staff-permissions (shipped)\n    parallel with bulk-order-export: different modules and UI zones","Roadmap, хвиля 3\n  tasks-issues (M)\n    залежить від staff-permissions (shipped)\n    паралельно з bulk-order-export: різні модулі й зони UI")},
 {id:"uxflows",row:3,role:"des",label:"ux-flows",title:T("User flows","Шляхи користувача"),jira:JD,

  handoff:[["dev",T("`ux-flows.md` with the SCR-01…03 inventory. The tech lead reads it as evidence of which surfaces the feature touches.","`ux-flows.md` з реєстром SCR-01…03. Техлід читає його як доказ, які поверхні зачіпає фіча.")]],
  example:T("SCR-01  Order page: tasks block\nSCR-02  Task form\nSCR-03  My tasks\n\nUS-1 → SCR-01 → SCR-02 → the task shows on the order\n               └ assignee has no access to the order →\n                 error in the form (AC-4)","SCR-01  Сторінка замовлення: блок завдань\nSCR-02  Форма завдання\nSCR-03  Мої завдання\n\nUS-1 → SCR-01 → SCR-02 → завдання видно на замовленні\n               └ виконавець не має доступу до замовлення →\n                 помилка у формі (AC-4)")},
 {id:"design",row:4,role:"dev",label:"tech-design",title:T("Technical design: SAD, C4, ADR","Технічний дизайн: SAD, C4, ADR"),jira:JD,

        T("Fits the feature into the existing architecture from `architecture-map.md` instead of designing from scratch.","Вписує фічу в наявну архітектуру з `architecture-map.md`, а не проєктує з нуля."),
        T("Declares the target surfaces (`target_surfaces`). Later stages read that decision and never re-derive it.","Оголошує цільові поверхні (`target_surfaces`). Наступні стадії читають це рішення й не виводять його заново."),
        T("Decisions that are expensive to reverse become ADRs.","Рішення, які дорого відкотити, стають ADR."),
        T("`sequences` draws the runtime flows. Every story and every AC maps to a flow, a branch or an explicit N/A.","`sequences` малює runtime-потоки. Кожна історія й кожен AC мають потік, гілку або явне N/A.")],

  handoff:[],
  example:T("target_surfaces: [web-frontend, backend-service, worker]\n\nADR-001  Notifications go through the existing queue,\n         not a direct call from the request.\nWhy      Creating a task must not fail or slow down\n         when email delivery is slow.","target_surfaces: [web-frontend, backend-service, worker]\n\nADR-001  Сповіщення йдуть через наявну чергу,\n         а не прямим викликом із запиту.\nЧому     Створення завдання не має падати чи гальмувати,\n         коли пошта відповідає повільно.")},

 screen:{btn:T("Screen differs from the mockup","Екран не такий, як у макеті"),nodes:["verify","screens","fix"],title:T("Screen does not match the manifest","Екран не збігається з маніфестом"),
  trigger:T("SCR-02 has no state for a 403 response. The user picks an assignee without access and the form does nothing.","У SCR-02 немає стану для відповіді 403. Користувач обирає виконавця без доступу, а форма нічого не робить."),
  steps:[["qa",T("Compares the environment with `screens.md` and the Figma mockup, files a design bug.","Порівнює стенд зі `screens.md` і макетом у Figma, заводить баг на дизайн.")],
         ["des",T("If the state is missing from the manifest, runs `/sdd:screens tasks-issues` and adds the state and a Figma frame. If the state exists and was built differently, passes the bug to the developer with no mockup changes.","Якщо стану немає в маніфесті, запускає `/sdd:screens tasks-issues` і додає стан та фрейм у Figma. Якщо стан є, а зібрано інакше, передає баг розробнику без змін у макеті.")],
         ["dev",T("`/sdd:fix`: builds the state from design-system components.","`/sdd:fix`: збирає стан із компонентів дизайн-системи.")],
         ["qa",T("Checks the screen in every state.","Перевіряє екран у всіх станах.")]],
  updates:T("`screens.md`, Figma, code","`screens.md`, Figma, код")},
 review:{btn:T("Review sent the work back","Рев'ю повернуло роботу"),nodes:["review","implement"],title:T("Review: CHANGES REQUESTED","Рев'ю: CHANGES REQUESTED"),
  trigger:T("AC-5 has no test, SCR-02 was built without the error state.","Для AC-5 немає тесту, SCR-02 зібрано без стану error."),
  steps:[["dev",T("Stays in the same context with no `/clear`. This is the one transition where context is kept.","Лишається в тому ж контексті без `/clear`. Це єдиний перехід, де контекст зберігають.")],
         ["dev",T("`/sdd:implement` closes the findings with the same TDD cycle.","`/sdd:implement` закриває знахідки тим самим циклом TDD.")],

/* prompts, example captions and extra examples for the tasks-issues feature */
var PROMPT={
 specify:[[T("Optional first step: stress-test the idea. The slug alone is enough: Claude then asks you to state the idea in one sentence.","Необов'язковий перший крок: перевірити ідею на міцність. Достатньо самого slug: далі Claude попросить сформулювати ідею одним реченням."),T("/sdd:interview tasks-issues","/sdd:interview tasks-issues")],[T("Faster: give the idea together with the command.","Швидше: дати ідею разом із командою."),T("/sdd:interview tasks-issues\n\nIn the Marketplace admin, staff who manage orders hand problems over to colleagues in chat, and requests get lost. I want them to create a task or an issue right from an order, a product or a customer, assign it to a colleague and see when it is done.","/sdd:interview tasks-issues\n\nВ адмінці маркетплейсу працівники, які ведуть замовлення, передають проблеми колегам у чаті, і прохання губляться. Хочу, щоб вони створювали завдання або проблему прямо із замовлення, товару чи клієнта, призначали колезі й бачили, коли це виконано.")],[T("Then write the spec. Everything after the command is optional: without it Claude asks for the idea and the sources itself.","Потім написати spec. Усе після команди необов'язкове: без нього Claude сам запитає про ідею та джерела."),T("/sdd:specify tasks-issues\n\nIdea: in the Marketplace admin, staff who manage orders need a way to give a colleague a task or flag an issue right from an order, a product or a customer, and to see when it is done.\nProblem today: these requests go through chat and get lost; nobody sees what is still open on an order.\nUsers: order managers, support agents, warehouse staff.\nSuccess: every request has an owner, a due date and a status, and is visible on the order.\nNot now: comments, attachments, tasks for customers.\n\nContext: read the Confluence page “Research: order problems handed over in chat” and the Jira tickets labelled order-followup from the last 90 days. When spec.md is written, publish a copy to the SHOP space in Confluence with a link to the commit.","/sdd:specify tasks-issues\n\nІдея: в адмінці маркетплейсу працівникам, які ведуть замовлення, потрібен спосіб дати колезі завдання або позначити проблему прямо із замовлення, товару чи клієнта й бачити, коли це виконано.\nПроблема зараз: такі прохання йдуть через чат і губляться; ніхто не бачить, що на замовленні ще відкрито.\nКористувачі: менеджери замовлень, підтримка, склад.\nУспіх: кожне прохання має відповідального, термін і статус та видно на замовленні.\nНе зараз: коментарі, вкладення, завдання для покупців.\n\nКонтекст: прочитай сторінку Confluence «Дослідження: проблеми із замовленнями в чатах» і звернення в Jira з міткою order-followup за останні 90 днів. Коли spec.md буде записано, опублікуй копію в просторі SHOP у Confluence з посиланням на коміт.")]],
 clarify:T("/sdd:clarify tasks-issues\n\nWalk me through every open question one at a time. My positions so far: an issue is a kind of task, not a separate entity; a task links to exactly one order, product or customer; comments and attachments are out of scope. Challenge these if the spec contradicts them. Then create the epic in Jira project SHOP with a link to spec.md.","/sdd:clarify tasks-issues\n\nПроведи мене по кожному відкритому питанню по одному. Мої позиції зараз: проблема є видом завдання, а не окремою сутністю; завдання прив'язане рівно до одного замовлення, товару або клієнта; коментарі й вкладення поза обсягом. Заперечуй, якщо spec цьому суперечить. Потім створи епік у Jira-проєкті SHOP з посиланням на spec.md."),
 epic:T("/sdd:classify-size tasks-issues\n\nCheck that size M and route standard still fit the clarified spec. Then update docs/roadmap.md: this feature depends on staff-permissions and can run in parallel with bulk-order-export. In Jira, set the designer and the tech lead on epic SHOP-412 and link the spec page in Confluence.","/sdd:classify-size tasks-issues\n\nПеревір, чи розмір M і маршрут standard досі відповідають уточненому spec. Потім онови docs/roadmap.md: фіча залежить від staff-permissions і може йти паралельно з bulk-order-export. У Jira признач дизайнера й техліда на епік SHOP-412 і додай посилання на сторінку spec у Confluence."),
 uxflows:T("/sdd:ux-flows tasks-issues\n\nThe entry point is the order page in the admin. Staff create a task without leaving the order. Assignees work from a “My tasks” list. Use components from our Figma library and name each screen SCR-NN. Show the error branch where the chosen assignee has no access to the order.","/sdd:ux-flows tasks-issues\n\nТочка входу — сторінка замовлення в адмінці. Працівник створює завдання, не виходячи із замовлення. Виконавці працюють зі списку «Мої завдання». Бери компоненти з нашої бібліотеки Figma й називай кожен екран SCR-NN. Покажи гілку помилки, коли обраний виконавець не має доступу до замовлення."),
 design:T("/sdd:design tasks-issues\n\nConstraints: reuse the existing notification queue and the staff-permissions module, with no new service. A task must link to an order, a product or a customer without three separate tables. Record as an ADR anything that is expensive to reverse. Afterwards run /sdd:sequences tasks-issues and publish the SAD to Confluence for architecture review.","/sdd:design tasks-issues\n\nОбмеження: використовуй наявну чергу сповіщень і модуль staff-permissions, без нового сервісу. Завдання має прив'язуватися до замовлення, товару або клієнта без трьох окремих таблиць. Усе, що дорого відкотити, запиши як ADR. Після цього запусти /sdd:sequences tasks-issues і опублікуй SAD у Confluence для рев'ю архітектури."),
 datamodel:T("/sdd:data-model tasks-issues\n\nOne table for tasks and issues, with a type column. Expect two frequent queries: tasks by assignee and status, and open tasks for one order. Write forward and rollback migrations and keep them staged in the feature folder.","/sdd:data-model tasks-issues\n\nОдна таблиця для завдань і проблем з колонкою type. Очікуй два частих запити: завдання за виконавцем і статусом та відкриті завдання одного замовлення. Напиши міграції вперед і назад і залиш їх у теці фічі."),
 api:T("/sdd:api tasks-issues\n\nAdmin API only, with the same auth as the other /admin endpoints. Return 403 when the caller or the assignee has no access to the linked object, 422 for validation errors, 409 when the task is already closed. List every error response: the designer needs them for screen states.","/sdd:api tasks-issues\n\nЛише адмінський API, з тією самою авторизацією, що й в інших /admin-ендпоінтів. Повертай 403, коли той, хто викликає, або виконавець не має доступу до пов'язаного об'єкта, 422 для помилок валідації, 409, коли завдання вже закрите. Перелічи всі відповіді з помилками: дизайнеру вони потрібні для станів екранів."),
 screens:T("/sdd:screens tasks-issues\n\nDraw SCR-01…03 in Figma from our library and link each frame in screens.md. Every screen needs default, loading, empty and error states. The task form also needs validation (422) and no access (403) from contracts/openapi.yaml. Reuse existing components and flag any new one with the reason.","/sdd:screens tasks-issues\n\nНамалюй SCR-01…03 у Figma з нашої бібліотеки й додай посилання на кожен фрейм у screens.md. Кожному екрану потрібні стани default, loading, empty та error. Формі завдання ще потрібні validation (422) і «немає доступу» (403) з contracts/openapi.yaml. Використовуй наявні компоненти, а кожен новий познач і поясни причину."),
 tasks:T("/sdd:tasks tasks-issues\n\nSplit the work so the migration and the API land first, then notifications and the two UI tasks can run in parallel. Each task takes a day or less. Every ui task must cite its SCR ids and states.","/sdd:tasks tasks-issues\n\nРозбий роботу так, щоб спершу йшли міграція й API, а потім сповіщення та дві UI-задачі могли йти паралельно. Кожна задача не довша за день. Кожна ui-задача має називати свої SCR і стани."),
 sprint:T("Read docs/features/tasks-issues/tasks.json. For each task create a Story in Jira project SHOP under epic SHOP-412: the title, the AC from spec.md it covers, links to the SCR ids from screens.md. Carry dependencies over as “blocks” links. If a story for that task already exists, update it instead of creating a duplicate. Then list the stories that can start in parallel.","Прочитай docs/features/tasks-issues/tasks.json. Для кожної задачі створи Story у Jira-проєкті SHOP під епіком SHOP-412: назва, AC зі spec.md, які вона закриває, посилання на SCR зі screens.md. Залежності перенеси як зв'язки «blocks». Якщо Story для цієї задачі вже є, онови її й не створюй дубль. Потім перелічи задачі, які можна почати паралельно."),
 plantests:T("/sdd:plan-tests tasks-issues\n\nMap every AC to at least one test and say at which level each test sits. Pay extra attention to access rules (AC-4) and notifications (AC-3): look up past Jira bugs about staff permissions and duplicate notifications, and cover them. Add the e2e paths from ux-flows.md and all states of SCR-02. Publish the plan to Confluence.","/sdd:plan-tests tasks-issues\n\nЗістав кожен AC щонайменше з одним тестом і вкажи рівень кожного тесту. Особливу увагу приділи правам доступу (AC-4) і сповіщенням (AC-3): знайди в Jira минулі баги про права працівників і дублі сповіщень та покрий їх. Додай e2e-шляхи з ux-flows.md і всі стани SCR-02. Опублікуй план у Confluence."),
 implement:T("/sdd:implement tasks-issues\n\nWork through tasks.json in dependency order, one task per commit. Stop and ask me if a test cannot pass without changing the contract or the spec. Move the Jira stories to In Progress and then Code Review as you go.","/sdd:implement tasks-issues\n\nІди по tasks.json у порядку залежностей, одна задача на один коміт. Зупинись і запитай мене, якщо тест не вдається пройти без зміни контракту або spec. Дорогою переводь задачі в Jira в In Progress, а потім у Code Review."),
 review:T("/sdd:review tasks-issues\n\nReview the whole branch against spec.md and screens.md in a clean context. For every AC name the test that proves it, or say that none does. Flag anything that was built but that the spec does not ask for.","/sdd:review tasks-issues\n\nПеревір усю гілку проти spec.md і screens.md у чистому контексті. Для кожного AC назви тест, який його доводить, або скажи, що такого немає. Познач усе, що зроблено, але чого spec не просить."),
 ship:T("/sdd:ship tasks-issues\n\nRun the feature locally and walk AC-1…AC-5 for real before opening the MR. Write the changelog for Marketplace staff, not for developers. Open the MR and do not merge it. Move epic SHOP-412 to QA with links to the MR and staging.","/sdd:ship tasks-issues\n\nЗапусти фічу локально й по-справжньому пройди AC-1…AC-5 перед відкриттям MR. Changelog пиши для працівників маркетплейсу, а не для розробників. Відкрий MR і не мерж його. Переведи епік SHOP-412 у QA з посиланнями на MR і стенд."),
 verify:T("Open staging from the tasks-issues MR, signed in as an order manager. Walk every path in docs/features/tasks-issues/ux-flows.md and check AC-1…AC-5 from spec.md. For each AC give a verdict: passed, failed or cannot verify, with a screenshot. Then propose 10 edge cases the AC do not cover, such as revoked access or a deactivated assignee. Do not create Jira bugs yet: show me the list first.","Відкрий стенд із MR для tasks-issues під обліковим записом менеджера замовлень. Пройди кожен шлях із docs/features/tasks-issues/ux-flows.md і перевір AC-1…AC-5 зі spec.md. Для кожного AC дай вердикт: пройдено, не пройдено або не можу перевірити, зі скриншотом. Потім запропонуй 10 крайових випадків, яких немає в AC, наприклад відкликаний доступ або вимкнений виконавець. Баги в Jira поки не створюй: спершу покажи список мені."),
 fix:T("/sdd:fix tasks-issues\n\nBug SHOP-431 in Jira: a staff member whose access to an order was revoked still sees its task in “My tasks”. Reproduce it and tell me which AC it breaks and whether it is a regression or a gap in the spec. Pin it with a failing test before fixing. Return the bug to QA with a link to the commit.","/sdd:fix tasks-issues\n\nБаг SHOP-431 у Jira: працівник, якому забрали доступ до замовлення, досі бачить його завдання у «Мої завдання». Відтвори його й скажи, який AC порушено і чи це регресія, чи прогалина в spec. Зафіксуй тестом, що падає, і лише тоді виправляй. Поверни баг у QA з посиланням на коміт."),
 release:T("Read the changelog in the tasks-issues MR and the QA report in Confluence. Write release notes for Marketplace staff: what is new, where to find it in the admin, what is not included yet. Publish them to the SHOP space and close epic SHOP-412 once the MR is merged.","Прочитай changelog у MR для tasks-issues і звіт QA в Confluence. Напиши нотатки до релізу для працівників маркетплейсу: що нового, де це знайти в адмінці, чого ще немає. Опублікуй їх у просторі SHOP і закрий епік SHOP-412, щойно MR змерджено.")
};

tification on assignment.\n  Weakest spot: nothing stops tasks piling up with no due date.\n  Next: /sdd:specify tasks-issues","Підсумок\n  Уточнена ідея: завдання й проблеми з одним виконавцем, прив'язані до одного об'єкта, зі сповіщенням про призначення.\n  Найслабше місце: ніщо не заважає завданням накопичуватися без терміну.\n  Далі: /sdd:specify tasks-issues")],["sec",T("Specify. Writes spec.md.","Specify. Пише spec.md.")],["po",T("/sdd:specify tasks-issues --depth=medium","/sdd:specify tasks-issues --depth=medium")],["cl",T("Size M, route standard. Confirm?","Розмір M, маршрут standard. Підтверджуєте?")],["po",T("Yes.","Так.")],["cl",T("Describe the idea in 1–3 sentences.","Опишіть ідею в 1–3 реченнях.")],["po",T("(the revised idea from the interview)","(уточнена ідея з інтерв'ю)")],["cl",T("Is an issue a separate thing or a kind of task? What tells you the feature works: fewer lost requests, faster fixes, something else?","Проблема є окремою сутністю чи видом завдання? Що покаже, що фіча працює: менше загублених прохань, швидші виправлення, щось інше?")],["po",T("A kind of task. Fewer requests lost in chat.","Вид завдання. Менше прохань, загублених у чаті.")],["cl",T("Which extra sources should I read?\n  Module code · Project docs · Jira and Confluence · None","Які додаткові джерела прочитати?\n  Код модуля · Документи проєкту · Jira й Confluence · Жодних")],["po",T("Jira and Confluence: the page “Research: order problems handed over in chat” and the tickets labelled order-followup.","Jira й Confluence: сторінка «Дослідження: проблеми із замовленнями в чатах» і звернення з міткою order-followup.")],["note",T("Claude drafts the spec, walks every user story and acceptance criterion with you, runs the critic, writes docs/features/tasks-issues/spec.md and proposes the commit “spec: tasks-issues”.","Claude пише чернетку spec, проходить з вами кожну історію й кожен критерій приймання, запускає критика, записує docs/features/tasks-issues/spec.md і пропонує коміт «spec: tasks-issues».")]]};

S.artIntro=T("Five repositories. Shared files live in the hub, <code>product-specs</code>, and reach each team's repository as a merge request. Each team keeps its own design, tasks and code.",
  "П'ять репозиторіїв. Спільні файли лежать у хабі <code>product-specs</code> і потрапляють у репозиторій кожної команди як merge request. Кожна команда тримає в себе свій дизайн, задачі й код.");
S.repoFlow=T(
 "<li><b>Hub → teams.</b><span>When <code>main</code> in <code>product-specs</code> changes, a CI job opens a merge request in each team repository with the updated shared files, under <code>docs/features/tasks-issues/</code>. There they are read-only.</span></li>"+
 "<li><b>Backend → hub.</b><span>The contract, <code>sad.md</code> and <code>data-model.md</code> go to the hub by merge request, approved by the Web, Android and iOS leads.</span></li>",
 "<li><b>Хаб → команди.</b><span>Коли змінюється <code>main</code> у <code>product-specs</code>, CI-job відкриває в репозиторії кожної команди merge request з оновленими спільними файлами в <code>docs/features/tasks-issues/</code>. Там вони лише для читання.</span></li>"+
 "<li><b>Backend → хаб.</b><span>Контракт, <code>sad.md</code> і <code>data-model.md</code> потрапляють у хаб через merge request, який погоджують ліди Web, Android та iOS.</span></li>");
S.repoNote=T("SDD itself assumes one repository with one <code>docs/features/</code> folder. The hub and the sync job are a proposal for your five repositories: prove them on the pilot feature. Repository names are placeholders.",
  "Сам SDD розрахований на один репозиторій з однією текою <code>docs/features/</code>. Хаб і sync-job запропоновані під ваші п'ять репозиторіїв: перевірте їх на пілотній фічі. Назви репозиторіїв умовні.");

/* prompts */
PROMPT.epic=T("/sdd:classify-size tasks-issues\n\nCheck that size M and route standard still fit the clarified spec. Then update docs/roadmap.md: this feature depends on staff-permissions and can run in parallel with bulk-order-export. In Jira, set the designer and the Backend, Web, Android and iOS leads on epic SHOP-412 and link the spec page in Confluence.",
  "/sdd:classify-size tasks-issues\n\nПеревір, чи розмір M і маршрут standard досі відповідають уточненому spec. Потім онови docs/roadmap.md: фіча залежить від staff-permissions і може йти паралельно з bulk-order-export. У Jira признач на епік SHOP-412 дизайнера й лідів Backend, Web, Android та iOS і додай посилання на сторінку spec у Confluence.");
PROMPT.uxflows=T("/sdd:ux-flows tasks-issues\n\nThe entry point is the order page in the admin. Staff create a task without leaving the order. Assignees work from a “My tasks” list. The same flows must work in the web admin and in the Android and iOS apps: note where a platform differs. Use components from our Figma library and name each screen SCR-NN. Show the error branch where the chosen assignee has no access to the order.",
  "/sdd:ux-flows tasks-issues\n\nТочка входу — сторінка замовлення в адмінці. Працівник створює завдання, не виходячи із замовлення. Виконавці працюють зі списку «Мої завдання». Ті самі шляхи мають працювати у вебадмінці та в застосунках Android й iOS: познач, де платформа відрізняється. Бери компоненти з нашої бібліотеки Figma й називай кожен екран SCR-NN. Покажи гілку помилки, коли обраний виконавець не має доступу до замовлення.");
PROMPT.design=T("/sdd:design tasks-issues\n\nThis is the backend repository. Constraints: reuse the existing notification queue and the staff-permissions module, with no new service. A task must link to an order, a product or a customer without three separate tables. The API will be called by the web admin and by the Android and iOS apps, including older app versions, so every change must stay backward compatible. Record as an ADR anything that is expensive to reverse. Afterwards run /sdd:sequences tasks-issues and publish the SAD to Confluence for review by the Web, Android and iOS leads.",
  "/sdd:design tasks-issues\n\nЦе репозиторій backend. Обмеження: використовуй наявну чергу сповіщень і модуль staff-permissions, без нового сервісу. Завдання має прив'язуватися до замовлення, товару або клієнта без трьох окремих таблиць. API викликатимуть вебадмінка та застосунки Android й iOS, зокрема старі версії застосунків, тому кожна зміна має лишатися зворотно сумісною. Усе, що дорого відкотити, запиши як ADR. Після цього запусти /sdd:sequences tasks-issues і опублікуй SAD у Confluence для рев'ю лідами Web, Android та iOS.");
PROMPT.api=T("/sdd:api tasks-issues\n\nAdmin API only, with the same auth as the other /admin endpoints. Return 403 when the caller or the assignee has no access to the linked object, 422 for validation errors, 409 when the task is already closed. List every error response: the designer needs them for screen states. The lists are shown on mobile, so each list row must carry everything the row displays, with no extra request per row.\n\nWhen the contract is written, open a merge request in product-specs with contracts/openapi.yaml, sad.md and data-model.md, and request approval from the Web, Android and iOS leads.",
  "/sdd:api tasks-issues\n\nЛише адмінський API, з тією самою авторизацією, що й в інших /admin-ендпоінтів. Повертай 403, коли той, хто викликає, або виконавець не має доступу до пов'язаного об'єкта, 422 для помилок валідації, 409, коли завдання вже закрите. Перелічи всі відповіді з помилками: дизайнеру вони потрібні для станів екранів. Списки показуються на мобільних, тому кожен рядок списку має містити все, що в ньому показано, без додаткового запиту на рядок.\n\nКоли контракт записано, відкрий merge request у product-specs з contracts/openapi.yaml, sad.md і data-model.md та попроси погодження в лідів Web, Android та iOS.");
PROMPT.tasks=[
 [T("In the backend repository:","У репозиторії backend:"),T("/sdd:tasks tasks-issues\n\nSplit the work so the migration and the API land first: three client teams wait for them. Notifications can follow. Each task takes a day or less.","/sdd:tasks tasks-issues\n\nРозбий роботу так, щоб спершу йшли міграція й API: на них чекають три клієнтські команди. Сповіщення можуть іти після. Кожна задача не довша за день.")],
 [T("In a client repository, here Android. First a short design, then the tasks:","У клієнтському репозиторії, тут Android. Спершу короткий дизайн, потім задачі:"),T("/sdd:design tasks-issues\n\nThis is the Android app repository. Keep the design short: how the feature fits our navigation, state and API layers. The contract is in docs/features/tasks-issues/contracts/openapi.yaml and is read-only here.","/sdd:design tasks-issues\n\nЦе репозиторій застосунку Android. Дизайн короткий: як фіча лягає на нашу навігацію, стан і шар API. Контракт лежить у docs/features/tasks-issues/contracts/openapi.yaml і тут лише для читання.")],
 [T("After /clear, in the same client repository:","Після /clear у тому самому клієнтському репозиторії:"),T("/sdd:tasks tasks-issues\n\nUI tasks first, built against a mock generated from the contract. Put switching to the staging API into a separate last task and mark it as waiting for the backend. Every ui task must cite its SCR ids and states.","/sdd:tasks tasks-issues\n\nСпершу UI-задачі на моку, згенерованому з контракту. Перемикання на API стенду винеси в окрему останню задачу й познач, що вона чекає на backend. Кожна ui-задача має називати свої SCR і стани.")]
];
PROMPT.sprint=T("Read docs/features/tasks-issues/tasks.json from the backend, web-admin, android-app and ios-app projects in GitLab. For each task create a Story in Jira project SHOP under epic SHOP-412 with the team as a label: the title, the AC from spec.md it covers, links to its SCR ids. Carry dependencies over as “blocks” links, across teams too: each client's “switch to the staging API” story is blocked by the backend API story. If a story for a task already exists, update it instead of creating a duplicate. Then list what each team can start today and what waits for the backend.",
  "Прочитай docs/features/tasks-issues/tasks.json із проєктів backend, web-admin, android-app та ios-app у GitLab. Для кожної задачі створи Story у Jira-проєкті SHOP під епіком SHOP-412 з міткою команди: назва, AC зі spec.md, які вона закриває, посилання на її SCR. Залежності перенеси як зв'язки «blocks», зокрема між командами: задачу кожного клієнта «перемикання на API стенду» блокує задача backend з API. Якщо Story для задачі вже є, онови її й не створюй дубль. Потім перелічи, що кожна команда може почати сьогодні, а що чекає на backend.");
PROMPT.plantests=T("/sdd:plan-tests tasks-issues\n\nMap every AC to at least one test. For each test say at which level it sits and on which platforms it must pass: web, Android, iOS. Pay extra attention to access rules (AC-4) and notifications (AC-3): look up past Jira bugs about staff permissions and duplicate notifications, and cover them. Add the e2e paths from ux-flows.md and all states of SCR-02. List the test accounts and the seed data staging needs. Publish the plan to Confluence.",
  "/sdd:plan-tests tasks-issues\n\nЗістав кожен AC щонайменше з одним тестом. Для кожного тесту вкажи рівень і платформи, на яких він має пройти: веб, Android, iOS. Особливу увагу приділи правам доступу (AC-4) і сповіщенням (AC-3): знайди в Jira минулі баги про права працівників і дублі сповіщень та покрий їх. Додай e2e-шляхи з ux-flows.md і всі стани SCR-02. Перелічи тестові облікові записи й дані, потрібні на стенді. Опублікуй план у Confluence.");
PROMPT.implement=[
 [T("In the backend repository:","У репозиторії backend:"),T("/sdd:implement tasks-issues\n\nWork through tasks.json in dependency order, one task per commit. Stop and ask me if a test cannot pass without changing the contract or the spec: the contract changes only through a merge request in product-specs. Move the Jira stories to In Progress and then Code Review as you go.","/sdd:implement tasks-issues\n\nІди по tasks.json у порядку залежностей, одна задача на один коміт. Зупинись і запитай мене, якщо тест не вдається пройти без зміни контракту або spec: контракт змінюється лише через merge request у product-specs. Дорогою переводь задачі в Jira в In Progress, а потім у Code Review.")],
 [T("In a client repository (Web, Android or iOS):","У клієнтському репозиторії (Web, Android або iOS):"),T("/sdd:implement tasks-issues\n\nBuild the ui tasks against the mock generated from docs/features/tasks-issues/contracts/openapi.yaml. If the contract lacks something a screen needs, stop and tell me: do not work around it. Leave the task “switch to the staging API” until the backend is on staging.","/sdd:implement tasks-issues\n\nЗбирай ui-задачі на моку, згенерованому з docs/features/tasks-issues/contracts/openapi.yaml. Якщо в контракті бракує чогось потрібного екрану, зупинись і скажи мені: не обходь це. Задачу «перемикання на API стенду» лиши, доки backend не буде на стенді.")]
];
PROMPT.review=T("/sdd:review tasks-issues\n\nReview the whole branch of this repository against spec.md and screens.md in a clean context. For every AC this team covers, name the test that proves it, or say that none does. Flag anything that was built but that the spec does not ask for, and anything that differs from contracts/openapi.yaml.",
  "/sdd:review tasks-issues\n\nПеревір усю гілку цього репозиторію проти spec.md і screens.md у чистому контексті. Для кожного AC, який закриває ця команда, назви тест, що його доводить, або скажи, що такого немає. Познач усе, що зроблено, але чого spec не просить, і все, що розходиться з contracts/openapi.yaml.");
PROMPT.ship=T("/sdd:ship tasks-issues\n\nRun our part of the feature and walk the AC it covers for real before opening the merge request. Write the changelog for Marketplace staff, not for developers. Open the merge request in GitLab and do not merge it. Move our Jira stories to Ready for Staging with a link to the merge request.",
  "/sdd:ship tasks-issues\n\nЗапусти нашу частину фічі й по-справжньому пройди AC, які вона закриває, перед відкриттям merge request. Changelog пиши для працівників маркетплейсу, а не для розробників. Відкрий merge request у GitLab і не мерж його. Переведи наші задачі в Jira в Ready for Staging з посиланням на merge request.");
PROMPT.staging=T("Check the pipelines of the tasks-issues merge requests in backend, web-admin, android-app and ios-app. Confirm that the backend is on staging and its migrations ran, and that each client build points at staging and not at the mock. Then run the smoke flow on each client: sign in as the test order manager, open order 1042, create a task. Post the staging URL and the Android and iOS build numbers to epic SHOP-412 and move it to QA. Do not deploy anything to production.",
  "Перевір пайплайни merge request для tasks-issues у backend, web-admin, android-app та ios-app. Підтвердь, що backend на стенді й міграції пройшли, а кожна клієнтська збірка дивиться на стенд, а не на мок. Потім пройди smoke-сценарій на кожному клієнті: увійди як тестовий менеджер замовлень, відкрий замовлення 1042, створи завдання. Додай в епік SHOP-412 адресу стенду й номери збірок Android та iOS і переведи його в QA. На продакшен нічого не викладай.");
PROMPT.verify=[
 [T("Web admin, through Playwright:","Вебадмінка, через Playwright:"),T("Open the web admin on staging, signed in as the test order manager. Walk every path in docs/features/tasks-issues/ux-flows.md and check AC-1…AC-5 from spec.md. For each AC give a verdict: passed, failed or cannot verify, with a screenshot. Then propose 10 edge cases the AC do not cover, such as revoked access or a deactivated assignee. Do not create Jira bugs yet: show me the list first.","Відкрий вебадмінку на стенді під обліковим записом тестового менеджера замовлень. Пройди кожен шлях із docs/features/tasks-issues/ux-flows.md і перевір AC-1…AC-5 зі spec.md. Для кожного AC дай вердикт: пройдено, не пройдено або не можу перевірити, зі скриншотом. Потім запропонуй 10 крайових випадків, яких немає в AC, наприклад відкликаний доступ або вимкнений виконавець. Баги в Jira поки не створюй: спершу покажи список мені.")],
 [T("Android, through Maestro. The same for iOS on a simulator:","Android, через Maestro. Те саме для iOS на симуляторі:"),T("Using Maestro, open the Android internal build 2.31.0 (4127) on the emulator, signed in as the same test order manager. Walk the same paths and check the same AC. Report only what differs from the web result. Save every path that passed as a Maestro flow under e2e/ in the android-app repository.","Через Maestro відкрий на емуляторі внутрішню збірку Android 2.31.0 (4127) під тим самим тестовим менеджером замовлень. Пройди ті самі шляхи й перевір ті самі AC. Повідом лише те, що відрізняється від результату на вебі. Кожен шлях, що пройшов, збережи як flow Maestro в e2e/ у репозиторії android-app.")]
];
PROMPT.fix=T("/sdd:fix tasks-issues\n\nBug SHOP-431 in Jira, owner backend: a staff member whose access to an order was revoked still sees its task in “My tasks”, on every platform. Reproduce it and tell me which AC it breaks and whether it is a regression or a gap in the spec. Pin it with a failing test before fixing. Return the bug to QA with a link to the commit.",
  "/sdd:fix tasks-issues\n\nБаг SHOP-431 у Jira, власник backend: працівник, якому забрали доступ до замовлення, досі бачить його завдання у «Мої завдання», на всіх платформах. Відтвори його й скажи, який AC порушено і чи це регресія, чи прогалина в spec. Зафіксуй тестом, що падає, і лише тоді виправляй. Поверни баг у QA з посиланням на коміт.");
PROMPT.accept=T("Read the changelogs in the four tasks-issues merge requests in GitLab and the QA report in Confluence. Write release notes for Marketplace staff: what is new, where to find it in the web admin and in the apps, what is not included yet. Save them as a draft in the SHOP space and move epic SHOP-412 to Acceptance.",
  "Прочитай changelog у чотирьох merge request для tasks-issues у GitLab і звіт QA в Confluence. Напиши нотатки до релізу для працівників маркетплейсу: що нового, де це знайти у вебадмінці та в застосунках, чого ще немає. Збережи їх як чернетку в просторі SHOP і переведи епік SHOP-412 в Acceptance.");
PROMPT.release=T("Read the pipelines and tags of the four tasks-issues merge requests in GitLab. Prepare a release checklist in this order: backend, web admin, Android, iOS. For each item give the version, the rollback step and who presses the button. Do not start any production job yourself. After I confirm each deploy, compare the error and crash rates with the last 7 days and tell me if anything moved.",
  "Прочитай пайплайни й теги чотирьох merge request для tasks-issues у GitLab. Підготуй чекліст релізу в такому порядку: backend, вебадмінка, Android, iOS. Для кожного пункту вкажи версію, крок відкату й хто натискає кнопку. Сам не запускай жодної job на продакшені. Після того як я підтверджу кожну викладку, порівняй рівень помилок і крешів з останніми 7 днями й скажи, чи щось змінилося.");

S.exShort=T("Example:","Приклад:");
S.featMeta=T("","");
S.restart=T("Start from step 1","Почати з кроку 1");
S.aboutBtn=T("About","Про приклад");
S.ver=T("Version 1","Версія 1");
S.introEyebrow=T("About this example","Про цей приклад");
S.introH=T("One feature, built with spec-driven development and an AI coding assistant","Одна фіча, зроблена через spec-driven development з ШІ-асистентом");
S.introLead=T("How a team builds a feature when an LLM assistant does most of the writing and people make the decisions. Shown in Claude Code; the same SDD plugin also installs into Codex CLI and Cursor.",
  "Як команда робить фічу, коли більшість тексту й коду пише LLM-асистент, а рішення приймають люди. Показано в Claude Code; той самий плагін SDD ставиться також у Codex CLI та Cursor.");
S.introSdd=T("<b>Spec-Driven Development.</b> The feature moves through fixed stages. Each stage writes a file (spec, design, contract, tasks), and the next stage and the code are derived from it. <a href='https://github.com/genkovich/sdd' target='_blank' rel='noopener'>What SDD is: genkovich/sdd</a>",
  "<b>Spec-Driven Development, розробка від специфікації.</b> Фіча проходить фіксовані стадії. Кожна стадія пише файл (spec, дизайн, контракт, задачі), а наступна стадія й код виводяться з нього. <a href='https://github.com/genkovich/sdd' target='_blank' rel='noopener'>Що таке SDD: genkovich/sdd</a>");
S.introTdd=T("<b>Test-Driven Development.</b> First a test that fails, then the code that makes it pass. The implement stage of SDD writes every task this way. <a href='https://en.wikipedia.org/wiki/Test-driven_development' target='_blank' rel='noopener'>What TDD is</a>",
  "<b>Test-Driven Development, розробка через тести.</b> Спершу тест, що падає, потім код, який його проходить. Так стадія implement у SDD пише кожну задачу. <a href='https://en.wikipedia.org/wiki/Test-driven_development' target='_blank' rel='noopener'>Що таке TDD</a>");
S.introFeatK=T("Example: how it works on the following feature","Приклад: як це працює на такій фічі");
S.introFeat=T("Staff who manage orders create a task or an issue for a colleague straight from an order, a product or a customer, and follow it until it is done.",
  "Працівники, які ведуть замовлення, створюють колезі завдання або проблему прямо із замовлення, товару чи клієнта й стежать за ним до виконання.");
S.introShowK=T("What you will see","Що ви побачите");
S.introShow=T("The whole development of this feature in 18 steps, from idea to release, by role: what each role does, with which tools, what it produces and whom it hands off to. Plus the return paths when QA or review finds a problem.",
  "Уся розробка цієї фічі за 18 кроків, від ідеї до релізу, по ролях: що робить кожна роль, якими інструментами, що лишає на виході й кому передає. А ще шляхи повернення, коли QA або рев'ю знаходить проблему.");

    '<li>'+fmt(T("Run your stage. Start each one with `/clear` so it reads its inputs from disk.","Запустіть свою стадію. Кожну починайте з `/clear`, щоб вона читала вхідні файли з диска."))+(cmds.length?'<div class="chips" style="margin-top:4px">'+cmds.map(function(c){return '<code>'+esc(c)+'</code>';}).join("")+'</div>':'')+'</li>'+

        :T("Stay in Manual mode: Claude asks before every edit and command. Add the rules below to `.claude/settings.local.json` so it edits only your files.","Лишайтесь у режимі Manual: Claude питає перед кожною правкою й командою. Додайте правила нижче в `.claude/settings.local.json`, щоб він редагував лише ваші файли."))+'</span></li></ul>'+

    '<ul class="rule-list">'+
    '<li><b>'+esc(tr(U.onGit))+'</b><span>'+(d.git?fmt(d.git):fmt(T("Developer role on the project, so you can push your branch and open merge requests. `main` is protected: changes land through a merge request with an approval. Code Owners send ","Роль Developer у проєкті, щоб пушити свою гілку й відкривати merge request. `main` захищена: зміни потрапляють через merge request із погодженням. Code Owners надсилають "))+fmt(d.owns)+fmt(T(" to your role for review."," на рев'ю вашій ролі.")))+'</span></li>'+
    '<li><b>'+esc(tr(U.inApps))+'</b><span>'+fmt(T("MCP uses your own sign-in, so Claude can do only what your account can.","MCP працює під вашим входом, тож Claude може лише те, що може ваш обліковий запис."))+'</span></li></ul>'+
    '<p class="plain">'+fmt(T("Claude Code rules guide its file tools; they are not a security boundary. Protected branches in GitLab are what enforce who can change what. Required approvals and Code Owners need GitLab Premium or Ultimate.","Правила Claude Code скеровують його файлові інструменти, але не є межею безпеки. Хто що може змінювати, насправді забезпечують захищені гілки в GitLab. Обов'язкові погодження й Code Owners потребують GitLab Premium або Ultimate."))+'</p>'+

S.ver=T("Version 2","Версія 2");
S.introLead=T("How a team builds a feature when an LLM assistant does most of the writing and people make the decisions. Shown in Claude Code with GitLab; the same SDD plugin also installs into Codex CLI and Cursor.",
  "Як команда робить фічу, коли більшість тексту й коду пише LLM-асистент, а рішення приймають люди. Показано в Claude Code з GitLab; той самий плагін SDD ставиться також у Codex CLI та Cursor.");
S.introShow=T("The whole development of this feature in 18 steps, from idea to production: what each role does, with which tools, what it produces and whom it hands off to. Engineering is four teams, each with its own GitLab repository; Web, Android and iOS build against the backend's contract.",
  "Уся розробка цієї фічі за 18 кроків, від ідеї до продакшену: що робить кожна роль, якими інструментами, що лишає на виході й кому передає. Розробка складається з чотирьох команд, кожна зі своїм репозиторієм у GitLab; Web, Android та iOS будують під контракт backend.");
INTRO_ROLE.pm=T("confirms size and route, moves the tasks of four teams into Jira, gives the go or no-go","підтверджує розмір і маршрут, переносить задачі чотирьох команд у Jira, дає go або no-go");
INTRO_ROLE.des=T("designs the user flows and every screen in every state, for web, Android and iOS","проєктує шляхи користувача й кожен екран у кожному стані для вебу, Android та iOS");
INTRO_ROLE.dev=T("Backend, Web, Android, iOS: design, API contract, code through TDD, review and merge requests","Backend, Web, Android, iOS: дизайн, контракт API, код через TDD, рев'ю і merge request");
INTRO_ROLE.qa=T("test plan from the criteria, AI-assisted checks on web and mobile, bugs traced to the criteria","план тестів від критеріїв, перевірка з ШІ на вебі й мобільних, баги з прив'язкою до критеріїв");
INTRO_ROLE.ops=T("seats and policy, pipelines, staging, the release order, rollout and monitoring","місця й політики, пайплайни, стенд, порядок релізу, розкатка й моніторинг");
TABS=[["step",T("Details","Деталі")],["hand",T("Handoffs","Передачі")],["mcp",T("Tools","Інструменти")],["files",T("Repos & files","Репо й файли")],["cost",T("Cost","Вартість")],["rules",T("Rules","Правила")],["setup",T("Role setup","Інструкції")]];
LB.contract=T("Contract gap","Контракт"); LB.prod=T("Hotfix","Хотфікс");
U.roleProposal=T("SDD does not bind stages to roles and assumes one repository. The split by role and team, the hub repository, and the steps with Jira, Confluence, staging and the release are a proposal for your team.","SDD не закріплює стадії за ролями й розрахований на один репозиторій. Розподіл по ролях і командах, репозиторій-хаб і кроки з Jira, Confluence, стендом та релізом запропоновані під вашу команду.");

SUM.epic=T("The PM confirms size and route, places the feature in the roadmap and assigns the designer and four team leads.","PM підтверджує розмір і маршрут, ставить фічу в roadmap і призначає дизайнера та чотирьох лідів команд.");
SUM.uxflows=T("The designer maps one flow per user story and lists every screen, for web, Android and iOS.","Дизайнер описує шлях на кожну історію й складає перелік екранів для вебу, Android та iOS.");
SUM.design=T("The backend lead fits the feature into the existing architecture and the client leads review it. This is architecture, not UI.","Лід backend вписує фічу в наявну архітектуру, а ліди клієнтів це рев'юють. Це архітектура, а не UI.");
SUM.datamodel=T("Backend only: schema plus forward and rollback migrations. The client teams wait here.","Лише backend: схема й міграції вперед і назад. Клієнтські команди тут чекають.");
SUM.api=T("Backend derives the OpenAPI contract and the Web, Android and iOS leads approve it. After that the clients stop waiting.","Backend виводить OpenAPI-контракт, а ліди Web, Android та iOS його погоджують. Після цього клієнти перестають чекати.");
SUM.screens=T("The designer specifies every screen in every state for web, Android and iOS and links the Figma frames.","Дизайнер описує кожен екран у кожному стані для вебу, Android та iOS і додає фрейми Figma.");
SUM.tasks=T("Each of the four teams splits its own work into tasks of a day or less, in its own repository.","Кожна з чотирьох команд ділить свою роботу на задачі до одного дня у своєму репозиторії.");
SUM.sprint=T("Claude turns four tasks.json files into Jira stories and the PM plans the sprint around the backend dependency.","Claude переносить чотири tasks.json у задачі Jira, а PM планує спринт з урахуванням залежності від backend.");
SUM.plantests=T("QA maps every acceptance criterion to at least one test on each platform.","QA зіставляє кожен критерій приймання щонайменше з одним тестом на кожній платформі.");
SUM.implement=T("Backend builds the real API through TDD while Web, Android and iOS build against a mock of the contract.","Backend будує справжній API через TDD, а Web, Android та iOS тим часом будують на моку контракту.");
SUM.review=T("A clean-context reviewer checks each change against the spec, and a human code owner approves the merge request.","Рев'юер у чистому контексті звіряє кожну зміну зі spec, а merge request погоджує людина, власник коду.");
SUM.ship=T("Each team runs its part for real, writes the changelog and opens a merge request.","Кожна команда запускає свою частину по-справжньому, пише changelog і відкриває merge request.");
SUM.staging=T("Backend goes to staging first, the clients switch off the mock, and QA gets a web address and two test builds.","Backend першим іде на стенд, клієнти вимикають мок, а QA отримує вебадресу й дві тестові збірки.");
SUM.verify=T("QA and Claude walk staging in a browser and on mobile emulators and file bugs traced to AC.","QA з Claude проходять стенд у браузері й на мобільних емуляторах і заводять баги з прив'язкою до AC.");
SUM.fix=T("The team that owns the bug reproduces it, pins it with a failing test and fixes it through the same gate.","Команда-власник бага відтворює його, фіксує тестом, що падає, і виправляє через той самий гейт.");
SUM.accept=T("The analyst accepts the feature on staging and the PM gives the go or no-go.","Аналітик приймає фічу на стенді, а PM дає go або no-go.");
SUM.release=T("Backend, then web, then the mobile apps as a staged rollout, watched for the first day.","Backend, далі веб, далі мобільні застосунки поетапно, з наглядом першу добу.");

S.toolsIntro=T("The SDD plugin runs the stages inside Claude Code, Claude Design covers prototypes, MCP servers connect Claude to Jira, Figma and GitLab, and GitLab CI/CD does the deploys. Open a tool to see what it is for and where it is used.",
  "Плагін SDD запускає стадії всередині Claude Code, Claude Design закриває прототипи, MCP-сервери з'єднують Claude з Jira, Figma та GitLab, а GitLab CI/CD робить викладки. Відкрийте інструмент, щоб побачити, для чого він і де використовується.");
