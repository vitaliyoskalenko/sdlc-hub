 export of the current filter saves hours a week.\n\n## 4. User stories\n\n- **US-01** A staff member exports the orders of the current filter as a CSV file.\n- **US-02** A staff member downloads the file later from a link.\n\n## 5. Acceptance criteria\n\n- **AC-01** An export starts from the orders list with the current filter.\n- **AC-02** The staff member sees the progress of the export.\n- **AC-03** The CSV has one row per order, with the columns of the list.\n- **AC-04** The download link works for 24 hours.\n\n## 8. Open questions\n\nNone.\n","/api/features/bulk-order-export/file?path=.size":"M\n","/api/features/bulk-order-export/file?path=.route":"standard\n","/api/features/bulk-order-export/file?path=ux-flows.md":"# UX flows — bulk-order-export\n\n- SCR-01 Orders list: Export button\n- SCR-02 Export dialog with progress\n- SCR-03 Exports: the download links\n\nUS-01 → SCR-01 → SCR-02 → the file is ready (AC-01, AC-02).\n","/api/features/bulk-order-export/file?path=sad.md":"---\nstatus: Accepted\nfeature_size: \"M\"\ntarget_surfaces: [backend-service, worker, web-frontend, mobile-app]\n---\n\n# SAD — bulk-order-export\n\nExports run as jobs in the existing worker; files go to object storage with signed links.\n","/api/features/bulk-order-export/file?path=data-model.md":"# Data model — bulk-order-export\n\n`export_jobs`: id, requested_by, filter, status, progress, file_key, expires_at.\n","/api/features/bulk-order-export/file?path=contracts%2Fopenapi.yaml":"openapi: 3.1.0\ninfo: { title: Exports, version: 1.0.0 }\npaths:\n  /admin/exports:\n    post: { summary: Start an export of the current filter (AC-01), responses: { '202': { description: Accepted } } }\n  /admin/exports/{id}:\n    get: { summary: Job status and link (AC-02, AC-04), responses: { '200': { description: OK }, '410': { description: Link expired } } }\n","/api/features/bulk-order-export/file?path=screens.md":"# Screens — bulk-order-export\n\n| Screen | State | Criteria |\n|---|---|---|\n| SCR-02 h follow-up an owner and a due date.\n\n## 4. User stories\n\n- **US-01** A staff member creates a task from an order and assigns it to a colleague.\n- **US-02** The assignee sees all their tasks in one list.\n- **US-03** The author sees on the order when the task is done.\n\n## 5. Acceptance criteria\n\n- **AC-01** A task is created from an order page and stays linked to that order.\n- **AC-02** A task has one assignee, a due date and a status.\n- **AC-03** The assignee gets one notification per assignment.\n- **AC-04** Only staff with access to the order see its tasks.\n- **AC-05** The order page shows a counter of its open tasks.\n\n## 8. Open questions\n\n- [x] Can a task have several assignees? No: one, per AC-02.\n","/api/features/tasks-issues/file?path=.size":"M\n","/api/features/tasks-issues/file?path=.route":"standard\n","/api/features/tasks-issues/file?path=ux-flows.md":"# UX flows — tasks-issues\n\n## Screens\n\n- SCR-01 Order page: tasks block\n- SCR-02 Task form\n- SCR-03 My tasks\n\n## Flow for US-01\n\n```mermaid\nflowchart LR\n  A[SCR-01 order page] --> B[SCR-02 task form]\n  B -->|saved| C[the task shows on the order]\n  B -->|assignee has no access to the order| E[error in the form]\n```\n\nCovers AC-01 and AC-04.\n","/api/features/tasks-issues/file?path=sad.md":"---\nstatus: Accepted\nfeature_size: \"M\"\ntarget_surfaces: [backend-service, web-frontend, mobile-app]\n---\n\n# SAD — tasks-issues\n\nTasks live in the orders module as a new aggregate, `StaffTask`. Notifications go through the existing outbox. The ADRs are in the backend repository.\n","/api/features/tasks-issues/file?path=data-model.md":"# Data model — tasks-issues\n\n`staff_tasks`: id, order_id, assignee_id, due_date, status, created_by, created_at. Index on (assignee_id, status) and on (order_id). Rollback drops the table.\n","/api/features/tasks-issues/file?path=contracts%2Fopenapi.yaml":"openapi: 3.1.0\ninfo: { title: Tasks, version: 1.0.0 }\npaths:\n  /admin/tasks:\n    post: { summary: Create a task (AC-01, AC-02, AC-04), responses: { '201': { description: Created }, '403': { description: No access to the order }, '422': { description: Invalid } } }\n    get: { summary: My tasks (AC-04), parameters: [{ name: assignee, in: query, schema: { type: string } }], responses: { '200': { description: OK } } }\n  /admin/tasks/{id}:\n    patch: { summary: Change a task (AC-02), responses: { '200': { description: OK }, '403': { description: No access }, '409': { description: Changed meanwhile } } }\n  /admin/orders/{id}/tasks:\n    get: { summary: Tasks of an order (AC-04), responses: { '200': { description: OK } } }\n","/api/features/tasks-issues/file?path=screens.md":"# Screens — tasks-issues\n\n| Screen | State | Components | Criteria |\n|---|---|---|---|\n| SCR-02 Task form | default | TextField, Select, DatePicker from the design system | AC-02 |\n| SCR-02 Task form | validation | empty title, due date in the past (422) | AC-02 |\n| SCR-02 Task form | loading | button busy | — |\n| SCR-02 Task form | success | the task shows in the order's block, counter +1 | AC-05 |\n| SCR-02 Task form | error | assignee has no access to the order (403), InlineBanner | AC-04 |\n","/api/features/tasks-issues/file?path=test-plan.md":"# Test plan — tasks-issues\n\n| AC | Level | Platforms | Test |\n|---|---|---|---|\n| AC-01 | e2e | web, android, ios | order page → create task → it shows in the block |\n| AC-02 | e2e | web, android, ios | assignee, due date and status all change |\n| AC-03 | integration | backend | reassigning twice gives one notification each |\n| AC-04 | integration | backend | no access to the order gives 403 and no listing |\n| AC-05 | e2e | web, android, ios | the counter goes down after closing a task |\n","/api/features/tasks-issues/file?path=hub%2Ffeature.yaml":"title: Tasks & issues in the Marketplace admin\nowner: olena.k\nteams:\n  backend: { lead: taras.m }\n  web: { lead: petro.v }\n  android: { lead: andrii.p }\n  ios: { lead: sofiia.h }\nlinks:\n  jira: https://jira.example.com/browse/SHOP-412\n  confluence: https://confluence.example.com/display/SHOP/Tasks+and+issues+in+the+Marketplace+admin\n  figma: https://www.figma.com/design/SHOP412a7Kq/Tasks-and-issues-in-the-Marketplace-admin\n  staging: https://staging-shop-412.admin.example.com\nestimate:\n  days: 15\n  tokens_m: [52, 118]\n","/api/features/tasks-issues/file?path=hub%2Frelease.yaml":"staging: { smoke: passed, at: 2026-10-02T10:00:00Z }\nversions: { backend: v2.31.0, web: admin build 885, android: 2.31.0 (4131), ios: 2.31.0 (513) }\n","/api/features/tasks-issues/file?path=hub%2Fbugs%2FBUG-0012.md":"---\nid: BUG-0012\ntitle: Task visible after access to the order was revoked\nac: AC-04\nplatforms: [web, android, ios]\nteam: backend\nseverity: high\nstatus: retest\nfound_by: iryna.s\nfound_in: verify\n---\nOpen an order as a staff member whose access to it was revoked.\n\nExpected: the tasks block is hidden. Actual: the task is listed, on all three clients.\n","/api/features/tasks-issues/file?path=hub%2Fbugs%2FBUG-0013.md":"---\nid: BUG-0013\ntitle: Due date picker opens one day early on iOS\nac: AC-02\nplatforms: [ios]\nteam: ios\nseverity: low\nstatus: closed\nfound_by: iryna.s\nfound_in: verify\n---\nFixed in build 2.31.0 (513).\n","/api/features/tasks-issues/file?path=hub%2Fbugs%2FBUG-0014.md":"---\nid: BUG-0014\ntitle: Task form has no state for a 403 response\nac: AC-04\nplatforms: [web]\nteam: web\nseverity: medium\nstatus: fixing\nfound_by: iryna.s\nfound_in: verify\n---\nAssign a task to a colleague without access to the order. Expected: an inline error. Actual: a blank form.\n","/api/features/tasks-issues/costs":{"months":["2026-10"],"totals":[{"month":"2026-10","feature":{"month":"2026-10","dimension":"feature","key":"tasks-issues","people":7,"messages":1210,"tokens":{"input":450000,"cache_write_5m":0,"cache_write_1h":12300000,"cache_read":140300000,"output":2420000},"cost":156.52},"steps":[{"month":"2026-10","dimension":"feat =!1}},[e]),V(C,{children:[V(`div`,{class:`ph`,children:V(`div`,{children:[V(`h1`,{children:`Releases`}),V(`p`,{class:`sub`,children:[`Every feature from staging on, and a released one until its watch period ends. `,t.roles.includes(`ops`)?`Open a feature's Release tab to record what you did.`:`Ops records each step on the feature's Release tab.`]})]})}),n?n.releases.length?V(`div`,{class:`card scroll`,children:V(`table`,{id:`releases`,children:[V(`thead`,{children:V(`tr`,{children:[V(`th`,{children:`Feature`}),V(`th`,{children:`Step`}),V(`th`,{children:`Smoke`}),V(`th`,{children:`Go`}),V(`th`,{children:`Versions`}),V(`th`,{children:`Rollout`}),V(`th`,{children:`Watch`})]})}),V(`tbody`,{children:n.releases.map(({summary:e,release:t})=>{let r=t.watchEnds?Math.ceil((Date.parse(t.watchEnds)-Date.parse(n.now))/864e5):null;return V(`tr`,{"data-release":e.slug,children:[V(`td`,{class:`wide`,children:V(U,{to:`/features/${e.slug}/release`,children:e.title})}),V(`td`,{class:`nw`,children:e.released?V(W,{kind:`ok`,children:`released`}):V(C,{children:[V(`code`,{children:e.current}),` `,V(at,{status:e.status})]})}),V(`td`,{class:`nw`,children:V(W,{kind:t.staging?.smoke===`passed`?`ok`:t.staging?.smoke===`failed`?`bad`:`mute`,children:t.staging?.smoke??`not run`})}),V(`td`,{class:`nw`,children:t.go?V(W,{kind:t.go.value===`go`?`ok`:`bad`,children:t.go.value}):V(`span`,{class:`muted`,children:`not yet`})}),V(`td`,{children:t.versions&&Object.keys(t.versions).length?Object.entries(t.versions).map(([e,t])=>`${e} ${t}`).join(`, `):V(`span`,{class:`muted`,children:`none`})}),V(`td`,{class:`nw`,children:[t.rollout?.stage??0,`%`]}),V(`td`,{class:`nw`,children:t.watchEnds?r!==null&&r<=0?V(W,{kind:`ok`,children:`over`}):`until ${Js(t.watchEnds)}`:V(`span`,{class:`muted`,title:`The watch period starts when the rollout reaches 100%`,children:`not started`})})]},e.slug)})})]})}):V(`div`,{class:`lockbox`,children:`No feature is at staging or in release now.`}):V(`p`,{class:`muted`,children:`Loading…`})]})}var Xs={gitlab:{title:`Install on GitLab`,text:"# Install SDLC Hub on GitLab\n\nFor the admin who installs the hub for a team on GitLab, self-managed or gitlab.com. It takes about 15 minutes. Setup runs on your own machine and writes everything through the GitLab API and git; nothing is hosted.\n\n## What you need\n\n| | |\n|---|---|\n| GitLab | Self-managed, Free tier or higher (tested on GitLab CE 19.4.1). On gitlab.com you need Premium or Ultimate, because project access tokens are not available on gitlab.com Free. |\n| Your role | **Owner** of the group that holds the repositories. You do not need to be an instance administrator. |\n| Repositories | The specifications repository (usually `product-specs`; setup can create it) and one repository per team (backend, web, mobile and so on), all in the same group. |\n| A CI runner | At least one runner online for the group: an instance, group or project runner. Without one, no change to `product-specs` can ever merge, because every merge waits for the `hub-guard` job. |\n| On your machine | Node.js 22 or newer and git. |\n\n## 1. Create your personal access token\n\nSetup acts as you, so it needs a token of yours with the `api` scope.\n\n1. In GitLab, open your avatar, then **Edit profile → Access tokens** (or go to `https://<your-gitlab>/-/user_settings/personal_access_tokens`). The setup site has a link that opens this page with the name and the scope already filled in.\n2. Choose **Add new token**.\n3. Name: `SDLC Hub setup`. Expiration: a few days is enough. You need it only while you run setup.\n4. Scopes: tick **`api`** only.\n5. Choose **Create personal access token** and copy it.\n\nThe token stays in your system keychain (through git's credential helper) and in the setup's memory. It is never written to a repository, to a setup script or to the site. You can revoke it once the install is done; you need a new one to run setup again, for example after an upgrade.\n\n## 2. Run setup\n\n```\nnpx sdlc-hub init\n```\n\nThe setup site opens at `http://127.0.0.1:4173/setup`. It has five screens:\n\n1. **Git host.** Choose GitLab, enter the address (`gitlab.example.com`, or `gitlab.com`), paste the token and sign in.\n2. **Repositories.** The group, the specifications repository, and one row per team repository. Mark the team that publishes the API contract, if any.\n3. **Project and tracker.** The project name, and Jira if you use it.\n4. **Assistants and engine.** Which assistants people may use (Claude Code is always on), the engine, whether the site may start a read-only validation run, and how strict `hub-guard` is (see [Settings](settings.md)).\n5. **Review and install.** Setup runs its checks first:\n   - your Owner role;\n   - a runner online;\n   - the GitLab version;\n   - forking of the specifications repository.\n\n   **Install** stays disabled until the checks pass.\n\n## 3. What Install does\n\n| Step | What it does |\n|---|---|\n| Files | Writes `.hub/` (configuration, roles, flow, engine), the hub as one file `hub/cli.js`, the assistant plugin and skills, and the hub sections of `CLAUDE.md` and `AGENTS.md` into the specifications repository. You are the first person in `.hub/roles.yaml`, as admin. |\n| Forking | Turns off forking of the specifications repository, so no change can come from a fork. |\n| `hub-state` | Creates the branch `hub-state` for machine data: team snapshots, test results, stage events, encrypted usage. It is a display cache, never trusted for a gate. |\n| `HUB_STATE_TOKEN` | Creates a project access token on `product-specs` (Developer role; `read_repository` and `write_repository`; expires in 364 days). Stores it as a **masked group variable** `HUB_STATE_TOKEN`, so every team pipeline can write `hub-state`. |\n| `hub-ci` | Creates the project `hub-ci` with the job configuration of `product-specs`: `hub-guard` on merge requests, and `hub-fanout` on `main`. Its `main` is protected; only Maintainers push and merge. |\n| `HUB_GUARD_TOKEN` | Creates a read-only project access token (`read_api`, Reporter role, 364 days), stored as a **masked variable** of `product-specs`. The guard uses it to ask who opened a merge request and who pushed to it. |\n| `HUB_RECHECK_TOKEN` | A project access token on `product-specs` (Developer role; `api`; 364 days), stored as a **protected, masked variable**: only pipelines on `main` see it, never a merge request's. When `.hub/` changes on `main` (a person's role, the guard settings), the `hub-recheck` job starts a new pipeline for every open merge request, so `hub-guard` judges it again under the new rules. |\n| `HUB_FANOUT_TOKEN_<TEAM>` | For each team repository, a project access token on that repository (Developer role; `read_repository` and `write_repository`; 364 days), stored as a **masked variable** of `product-specs`. With it, `hub-fanout` brings the shared files of each feature (spec, flows, screens, test plan, contracts) to the repositories of its teams, as a merge request on the branch `hub/fanout` that the team lead merges. |\n| CI configuration | Points the CI configuration of `product-specs` at `ci/product-specs.yml@<group>/hub-ci`, so a merge request cannot change its own check. Turns on **Pipelines must succeed**. |\n| Protect `main` | Protects `main` of `product-specs`: **no one pushes**; Developers and Maintainers merge. Every change, yours included, now arrives as a merge request that merges itself once `hub-guard` passes. |\n| Team repositories | Opens one merge request per team repository that adds the `hub-report` job (`ci/hub-report.gitlab-ci.yml`, included from `.gitlab-ci.yml`). It publishes the team's tasks, tracker, review verdict and pipeline result to `hub-state`. |\n\nInstall can be run again at any time. Each step checks first, so a second run skips what is done and continues where it stopped. Once `main` is protected, its own changes arrive as a merge request too.\n\n## 4. After Install\n\nThe setup page lists what is left for people:\n\n- **Each team lead merges the `hub/fanout` merge requests** that bring the shared files of their features. They come after each change on `main` of `product-specs` to a feature that names the team (in `feature.yaml`, at the epic step). The copies are read-only there: they change in `product-specs`.\n\n- **Each team lead merges** the merge request that adds `hub-report` to their repository.\n- **Renew the tokens before they expire.** The page names the day for each one:\n  - When `HUB_STATE_TOKEN` expires, team pipelines stop publishing.\n  - When `HUB_GUARD_TOKEN` expires, `hub-guard` fails and **nothing can merge into `product-specs`**.\n  - When a `HUB_FANOUT_TOKEN_<TEAM>` expires, that team stops getting the shared files.\n  - When `HUB_RECHECK_TOKEN` expires, a change of roles no longer checks open merge requests again.\n  - Settings shows each token with its expiry date and warns 30 days ahead.\n\n  To renew, create a new project access token with the same name, role and scopes on `product-specs` (**Settings → Access tokens**), and replace the variable's value: the group's **Settings → CI/CD → Variables** for `HUB_STATE_TOKEN`, the project's for `HUB_GUARD_TOKEN`. Running setup again also creates a missing token.\n- **Keep the people of the hub at the Developer role** in the group. On GitLab Free a protected branch cannot be limited to the Owner, so a Maintainer could change `hub-ci` or the protection of `main`.\n- **Optional, self-managed only:** a pre-receive server hook, which needs access to the GitLab server.\n- **Add each person** on the Team page, then send them their setup script (see [People](people.md)).\n\n## Upgrade the hub\n\nThe hub's version is in `hub/package.json`. To upgrade, run the newer hub in your clone of `product-specs`, as the admin:\n\n```\nnpx sdlc-hub@<version> upgrade\n```\n\nIt proposes the newer `hub/cli.js`, its version, the plugin and the assistants' files as one merge request in your name. The merge request merges itself when `hub-guard` passes. `.hub/` stays as you wrote it, and the hub never goes back to an older version.\n\nWhen a release changes the default engine adapter (`.hub/engines/sdd.yaml`) or another `.hub/` file, its release note says what changed. Make the change in your `.hub/` yourself, once the upgrade merged: the hub on `main` then reads the new rules. Setup run again also keeps your `.hub/` and adds only the files that are missing.\n\nEveryone gets the upgrade with `node hub/cli.js sync`. A site still running the older hub turns read only, and says to sync and start it again.\n\n`hub-ci` keeps its job configuration. If a release note says it changed, run setup again.\n\n## Remove the hub\n\nAs the admin, in your clone of `product-specs`:\n\n```\nnode hub/cli.js uninstall\n```\n\nIt proposes one change that removes `hub/`, `.hub/` and the assistants' hub files; the feature documents stay. Then it lists what install set up on the host, to lift by hand once the change has merged.\n\n## What each person needs on GitLab\n\n- Membership in the group with the **Developer** role.\n- A way for git to reach GitLab over **HTTPS**. Setup scripts clone with `https://` addresses, and nothing secret is in the script. Either of these works:\n  - Git Credential Manager, which signs in through the browser the first time;\n  - a personal access token with **`read_repository`** and **`write_repository`**, stored by git's credential helper on first use (username: your GitLab username, password: the token).\n- Saving from the site needs nothing more: a save is a git push with push options that open the merge request and set it to merge when the pipeline succeeds.\n\n## Troubleshooting\n\n| What you see | Why, and what to do |\n|---|---|\n| \"GitLab refused the token\" | The token lacks the `api` scope, has expired, or belongs to another instance. Make a new one. |\n| \"You need the Owner role\" | Ask the group's Owner to install, or to make you Owner for the install. |\n| \"No runner is online\" | Register a runner for the group, or ask the instance administrator to enable instance runners. |\n| Every merge request into `product-specs` fails at `hub-guard` | Open the job log: it names each file and the rule it broke. If it says the token was refused, `HUB_GUARD_TOKEN` has expired. |\n| A team's snapshot never appears | The team lead has not merged the `hub-report` merge request, or `HUB_STATE_TOKEN` has expired. |\n"},github:{title:`Install on GitHub`,text:"# Install SDLC Hub on GitHub\n\nFor the admin who installs the hub for a team on GitHub (github.com, or GitHub Enterprise Server). It takes about 15 minutes. Setup runs on your own machine and writes everything through the GitHub API and git; nothing is hosted.\n\n## What you need\n\n| | |\n|---|---|\n| Your role | **Owner** of the organization that holds the repositories. |\n| Plan | **Team** or higher for private repositories. On **Free**, public repositories work in full. Private repositories on Free have no rulesets and no auto-merge, so they install only in advisory mode: `hub-guard` warns instead of refusing, and every pull request waits for someone to merge it. |\n| Repositories | The specifications repository (usually `product-specs`; setup can create it) and one repository per team, all in the same organization. Each team repository should have its CI workflow already; the hub reports after it. |\n| GitHub Actions | Allowed for the organization's repositories. GitHub-hosted runners are enough. |\n| Deploy keys | Allowed in the organization (see step 1). |\n| On your machine | Node.js 22 or newer, git and `ssh-keygen` (it comes with OpenSSH). |\n\n## 1. Prepare the organization\n\nThree settings, all under the organization's **Settings**:\n\n1. **Fine-grained personal access tokens may access the organization.** Under **Third-party Access → Personal access tokens → Settings**, allow access through fine-grained tokens. If you require administrator approval, you approve your own token after step 2 under **Pending requests**.\n2. **Deploy keys are allowed.** A new organization may have them turned off, and team CI writes `hub-state` with a deploy key. Allow them in the organization's repository policies (the setting is named *Deploy keys*), or with the GitHub CLI:\n\n   ```\n   gh api -X PATCH /orgs/<org> -F deploy_keys_enabled_for_repositories=true\n   ```\n\n   Setup checks this and says so when it is off.\n3. **GitHub Actions may open pull requests.** Under **Actions → General → Workflow permissions**, tick *Allow GitHub Actions to create and approve pull requests*. The `hub-fanout` workflow in each team repository needs it to propose the shared files. Without it, the files still reach the branch `hub/fanout`, but no pull request opens. Setup warns when it is off.\n\n## 2. Create your fine-grained token\n\nSetup acts as you, so it needs a fine-grained personal access token of yours that belongs to the organization.\n\n1. Open https://github.com/settings/personal-access-tokens/new (on Enterprise Server, your server's address instead of github.com). The setup site has a link to this page.\n2. **Token name:** `SDLC Hub setup`. **Expiration:** a few days is enough. You need it only while you run setup.\n3. **Resource owner:** the **organization**, not your own account. If the organization is not in the list, step 1.1 is not done.\n4. **Repository access:** **All repositories**. If that is not offered, create the specifications and team repositories first and choose **Only select repositories** with all of them.\n5. **Permissions.** Under **Repositories**, add:\n\n   | Permission | Access |\n   |---|---|\n   | Administration | Read and write |\n   | Contents | Read and write |\n   | Pull requests | Read and write |\n   | Workflows | Read and write |\n   | Secrets | Read and write |\n   | Actions | Read-only |\n   | Metadata | Read-only (added by GitHub) |\n\n   Under **Organization** (the tab appears once the resource owner is the organization), add:\n\n   | Permission | Access |\n   |---|---|\n   | Members | Read-only |\n   | Administration | Read and write |\n\n   Leave **Account** permissions empty.\n6. **Generate token** and copy it (`github_pat_…`).\n\nThe token stays in your system keychain (through git's credential helper) and in the setup's memory. It is never written to a repository, to a setup script or to the site. You can revoke it once the install is done; you need a new one to run setup again, for example after an upgrade.\n\n## 3. Run setup\n\n```\nnpx sdlc-hub init\n```\n\nThe setup site opens at `http://127.0.0.1:4173/setup`. It has five screens:\n\n1. **Git host.** Choose GitHub. The address is `github.com`, or your Enterprise Server. Paste the token and sign in.\n2. **Repositories.** The organization, the specifications repository, and one row per team repository. Mark the team that publishes the API contract, if any.\n3. **Project and tracker.** The project name, and Jira if you use it.\n4. **Assistants and engine.** Which assistants people may use (Claude Code is always on), the engine, whether the site may start a read-only validation run, and how strict `hub-guard` is (see [Settings](settings.md)). Choose **Advisory** here if you install private repositories on GitHub Free.\n5. **Review and install.** Setup runs its checks first:\n   - your owner role;\n   - the plan;\n   - deploy keys allowed;\n   - the team repositories;\n   - `ssh-keygen`.\n\n   **Install** stays disabled until the checks pass.\n\n## 4. What Install does\n\n| Step | What it does |\n|---|---|\n| Files | Writes `.hub/` (configuration, roles, flow, engine), the hub as one file `hub/cli.js`, the assistant plugin and skills, the `hub-guard` workflow (`.github/workflows/hub-guard.yml`), and the hub sections of `CLAUDE.md` and `AGENTS.md` into the specifications repository. You are the first person in `.hub/roles.yaml`, as admin. Once `main` is protected, these changes arrive as a pull request that setup merges as soon as `hub-guard` passes. |\n| Recheck | The workflow `.github/workflows/hub-recheck.yml` runs when `.hub/` changes on the default branch. It runs the `hub-guard` job of every open pull request again, so a result under the old roles does not merge. |\n| Settings | Allows auto-merge, deletes a branch once it merged, and turns forking off for a private repository. A public repository can always be forked; a pull request from a fork goes through `hub-guard` like any other. |\n| `hub-state` | Creates the branch `hub-state` for machine data: team snapshots, test results, stage events, encrypted usage. It is a display cache, never trusted for a gate. |\n| Deploy key | Makes a new SSH key pair. The public half becomes a deploy key with write access on `product-specs` (named `sdlc-hub hub-state <date>`). The private half becomes the repository secret **`HUB_STATE_KEY`** in each team repository. The private key is stored nowhere else. |\n| Ruleset | Adds the ruleset **`sdlc-hub: main`** on the default branch: pull requests only, the status check **`hub-guard`** required (on github.com, only from GitHub Actions, so a status a person posts does not count), no deletion and no force push, with nobody allowed to bypass it. Skipped on Free with private repositories. |\n| Team repositories | Opens one pull request per team repository that adds two workflows. `hub-report` (`.github/workflows/hub-report.yml`) runs after the team's own workflows and publishes the team's tasks, tracker, review verdict and workflow result to `hub-state`. `hub-fanout` (`.github/workflows/hub-fanout.yml`) runs every hour and on demand: it reads `product-specs` with the deploy key and opens a pull request on `hub/fanout` with the shared files of the team's features (spec, flows, screens, test plan, contracts). Install also lets the repository's workflows open pull requests (*Allow GitHub Actions to create pull requests*). |\n\n`hub-guard` runs on `pull_request_target`, so the workflow and the hub it runs always come from the default branch: a pull request cannot change its own check. It reads the pull request only as data.\n\nInstall can be run again at any time. Each step checks first, so a second run skips what is done and continues where it stopped.\n\n## 5. After Install\n\n- **Each team lead merges** the pull request that adds the hub workflows to their repository, and later the `hub/fanout` pull requests with the shared files of their features. The copies are read-only there: they change in `product-specs`.\n- If the organization's policy forbids workflows to open pull requests, allow it for the team repositories (organization **Settings → Actions → General**). Setup says so when it cannot.\n- **Add each person** on the Team page, then send them their setup script (see [People](people.md)). Each person must be a member of the organization with **write** access to `product-specs` and to their team's repository.\n- **A new team repository later** needs the `HUB_STATE_KEY` secret too. Run setup again: it makes a new deploy key for all team repositories. Remove older `sdlc-hub hub-state` keys from `product-specs` once team CI uses the newest.\n- Nothing expires on its own: the deploy key and the secrets have no end date.\n\n## Upgrade the hub\n\nThe hub's version is in `hub/package.json`. To upgrade, run the newer hub in your clone of `product-specs`, as the admin:\n\n```\nnpx sdlc-hub@<version> upgrade\n```\n\nIt proposes the newer `hub/cli.js`, its version, the plugin and the assistants' files as one pull request in your name. The pull request merges itself when `hub-guard` passes. `.hub/` stays as you wrote it, and the hub never goes back to an older version.\n\nWhen a release changes the default engine adapter (`.hub/engines/sdd.yaml`) or another `.hub/` file, its release note says what changed. Make the change in your `.hub/` yourself, once the upgrade merged: the hub on `main` then reads the new rules. Setup run again also keeps your `.hub/` and adds only the files that are missing.\n\nEveryone gets the upgrade with `node hub/cli.js sync`. A site still running the older hub turns read only, and says to sync and start it again.\n\nThe upgrade also carries the `hub-guard` workflow of the new version.\n\n## Remove the hub\n\nAs the admin, in your clone of `product-specs`:\n\n```\nnode hub/cli.js uninstall\n```\n\nIt proposes one change that removes `hub/`, `.hub/` and the assistants' hub files; the feature documents stay. Then it lists what install set up on the host, to lift by hand once the change has merged.\n\n## What each person needs on GitHub\n\n- Membership in the organization, with write access to `product-specs` and their team's repository.\n- A way for git to reach GitHub over **HTTPS** with a token. Setup scripts clone with `https://` addresses, and nothing secret is in the script. The site also uses that token to open each save's pull request, because GitHub, unlike GitLab, cannot open a pull request from a plain `git push`. The simplest way:\n\n  ```\n  gh auth login\n  gh auth setup-git\n  ```\n\n  Or a fine-grained token of their own, with the organization as resource owner. On `product-specs` it needs **Contents** and **Pull requests**, read and write. On their team's repository it needs **Contents**, read and write. Git's credential helper stores it on first use.\n- SSH alone is not enough for saving from the site; the site says how to sign in when no token is found.\n\n## Troubleshooting\n\n| What you see | Why, and what to do |\n|---|---|\n| \"GitHub refused the token\" | The resource owner is your account instead of the organization, the token has expired, or the organization has not approved it yet. |\n| The organization is missing from *Resource owner* | The organization does not allow fine-grained tokens yet (step 1.1). |\n| \"Deploy keys are disabled for this repository\" | Allow deploy keys in the organization (step 1.2). |\n| \"GitHub Free gives private repositories no rulesets\" | Upgrade to Team, make the repositories public, or choose Advisory on screen 4. |\n| A save stays \"waiting to merge\" | `hub-guard` has not passed yet, or it failed: open the pull request's checks. The site merges a save that auto-merge left open once the check passes. |\n| A team's snapshot never appears | The team lead has not merged the `hub-report` pull request, or `HUB_STATE_KEY` is missing (run setup again). |\n"},people:{title:`People`,text:"# Add people and set up their machines\n\nFor the admin who adds people to the hub, and for each person who sets it up on their own machine.\n\n## The admin adds a person\n\n1. Make sure the person can reach the repositories:\n   - **GitLab:** member of the group with the Developer role.\n   - **GitHub:** member of the organization with write access to `product-specs` and to their team's repository.\n2. Open the hub's site, **Team**, then **Add a person**:\n   - the username on the git host;\n   - the name;\n   - the roles (PO, PM, designer, Engineering, QA, Ops, admin);\n   - for Engineering, the team, and whether they lead it;\n   - the assistant they use (Claude Code, Codex or Cursor);\n   - their system (macOS, Linux or Windows).\n3. **Save.** The change is a merge request on `.hub/roles.yaml` that only the admin role passes; it merges by itself. The admin's view of the Team page marks anyone who is not in the group or organization on the host, asked with the admin's own git credential.\n4. Open the person's **Setup script** on the same page and send it to them: a bash script for macOS and Linux, a PowerShell script for Windows. It contains no token, key or password, so it is safe to send by chat or email.\n\nAfter a change of PM or admin, run `node hub/cli.js usage rekey` on your machine, so the new readers can read everyone's usage records (see [Settings](settings.md)).\n\n## The person runs the script\n\nWhat the machine needs first:\n\n- **git**, and a way for git to reach the host over HTTPS. Both guides say how:\n  - [GitLab](gitlab.md#what-each-person-needs-on-gitlab);\n  - [GitHub](github.md#what-each-person-needs-on-github).\n- **Node.js 22** or newer.\n- **The assistant** named on the Team page: Claude Code, Codex or Cursor's CLI.\n\nThen run the script:\n\n```\nbash setup-<you>.sh\n```\n\nOn Windows, run `setup-<you>.ps1` in PowerShell instead.\n\nIt takes a few minutes and is safe to run again. It:\n\n1. checks git, Node.js and the assistant;\n2. signs in to the host through git (your credential manager, or the token you stored);\n3. clones `product-specs` and the repositories of your role into one folder;\n4. runs `node hub/cli.js setup`, which:\n   - checks your role on `main`;\n   - sets up the assistant with the hub plugin;\n   - makes your usage key: the private half stays in your system keychain, the public half goes to `.hub/keys/<you>/` by a merge request that merges itself;\n   - tells the admin it is done;\n5. runs `node hub/cli.js doctor`;\n6. opens Your guide.\n\n## Every day\n\n| Command | What it does |\n|---|---|\n| `node hub/cli.js serve` | Starts the site at `http://127.0.0.1:4173`, on your machine only. `/hub:start` in Claude Code does the same. |\n| `node hub/cli.js sync` | Pulls `main` and `hub-state`, and refreshes Claude Code's copy of the hub plugin. Also sends what waited on this machine: saves made offline, stage events, and your usage (encrypted to you, the admins and the PMs). |\n| `node hub/cli.js doctor` | Checks Node.js, `.hub/`, who you are, the git host and your assistant's plugin. |\n| `/hub:status`, `/hub:next <slug>` | In Claude Code: where features are, and your next step. In Codex, `$hub-status`; in Cursor, `/hub-status`. |\n\nOn the site:\n\n- **Changed since you last looked.** A feature whose step moved since your last visit is marked in the features table; opening it takes it as seen, and **Mark all as seen** clears the rest.\n- **Notify me**, on Home: the browser tells you when a new action reaches you while the site's tab is in the background.\n- **Keyboard:** `g` then `h`, `f`, `r`, `t`, `s` or `g` opens Home, Features, Releases, Team, Settings or Your guide; `/` finds a feature; `?` opens Help.\n\nWhat you have seen, the notifications choice and the role you work as are kept in your browser only.\n\n## Who you are\n\nThe hub matches your git identity (`user.name` and `user.email`, or `git config hub.user <username>`) to a person in `.hub/roles.yaml`. If the site says you are not in `roles.yaml`, ask the admin to add you, then run your setup script again.\n"},settings:{title:`Settings`,text:"# Settings\n\nFor the admin. The hub's settings live in `.hub/config.yaml` in `product-specs`. The admin changes them on the site's **Settings** page; everyone else can read the page. A change is a save: a merge request on `config.yaml` that only the admin role passes, and that merges by itself. Repositories and the engine are set at install, and teams can be added, edited and removed here (see below). To change the engine, add its adapter under `.hub/engines/` and set `engine` in `.hub/config.yaml`.\n\n## How strict hub-guard is\n\n`hub-guard` runs on every merge request (pull request on GitHub) into `main` of `product-specs`. It decides by the settings on `main`, so a merge request cannot loosen its own check.\n\n**Mode**\n\n| Mode | What happens to a change that breaks a rule |\n|---|---|\n| **Enforce** (default) | It does not merge. For a save from the site, the reason appears on the site and the branch is deleted. |\n| **Advisory** | It merges anyway. `hub-guard` lists the problems in its log and, for a save from the site, in `hub-state`; the site shows the save as \"merged with warnings\". |\n\nChoose Advisory for a team that wants the flow and the site without the restrictions, and for private repositories on GitHub Free, which have no rulesets or auto-merge.\n\n**Checks you can switch off**\n\n| Check | When it is on | When it is off |\n|---|---|---|\n| Files by role | Each role changes only its own files (`.hub/roles.yaml` lists them). | Anyone in `roles.yaml` may change any file. |\n| Who signs a gate | A sign-off or a QA decision comes from the step's role and the right lead. | Anyone in `roles.yaml` may sign any gate, in their own name. |\n| Everyone who pushed | Every person who pushed to the branch is judged, not only its author. | Only the author is judged. |\n| People not in roles.yaml | A change from someone who is not in `roles.yaml` is refused. | Anyone with access to the repository may change files. |\n\n**Never relaxed.** Whatever the mode and the checks say, these stay admin-only and are refused even in advisory mode, because they run on every machine:\n\n- `.hub/` and `hub/`;\n- the assistants' files: `.claude/`, `.claude-plugin/`, `.agents/`, `.codex/`, `.cursor/`, `CLAUDE.md`, `AGENTS.md`;\n- CI files: `.github/`, `.gitlab-ci.yml`, `ci/`.\n\n`signoffs.yaml` stays append-only, and a new sign-off must name its author. A hub file that would not load (`.hub/`, `feature.yaml`, `signoffs.yaml`, `release.yaml`, `verification.yaml`, a bug file) is refused too, so a typo can never break the site for everyone.\n\nThe checks change what the guard lets through, not what the site offers: a Sign off button still appears only for the step's owner.\n\nIn `config.yaml`:\n\n```yaml\nguard:\n  mode: enforce        # or advisory\n  checks:\n    files: true\n    signoffs: true\n    pushers: true\n    members: true\n```\n\n## Other settings\n\n| Setting | What it does |\n|---|---|\n| Assistants | Which assistants people may choose. Claude Code is always on. A newly allowed assistant gets its files with the next install run. |\n| Headless runs | Lets the PO and the team leads start a read-only validation run from the site, under their own assistant seat. Off by default. |\n| Links | The Confluence space and the Figma project for the whole project. Each feature's own links (Jira, Figma, staging) are on the feature's page, where the PM edits them with **Edit details**. |\n\n## The host checklist\n\nThe admin's Settings page reads, on the host, what install set up, with the admin's own git credential:\n- **GitLab:** the protection of `main`, the CI configuration, \"Pipelines must succeed\", forking, `hub-state`, and each token with its expiry date. A token that expires within 30 days is marked \"to do\".\n- **GitHub:** the ruleset, auto-merge, `hub-state`, the two organization settings, and each team's secret and workflows.\n\nIt only reads. What it marks \"to do\" says what to do: renew a token, run setup or `hub connect-teams` again, or merge a team's pull request.\n\n## Prices\n\nCosts are API-equivalent: what the same work would cost at the provider's list prices. On seats, work is not billed per token. Settings shows the hub's table, with the day it was read, and the project's overrides. The admin changes a model's prices with **Edit**, saved under `prices` in `config.yaml`, and goes back to the hub's with **Use the hub's**. An override applies to that model and to every model id it starts.\n\n## Teams\n\nThe project's teams are listed on Settings. The admin:\n\n- **Edits** a team's name, repository, kind and test command, and chooses which team publishes the API contract (one at most). A team's id stays: features refer to it.\n- **Removes** a team. A team that people are still in is refused, with the reason: move them to another team on the Team page first. The removal leaves the team's repository and its jobs as they are.\n\n## Add a team after install\n\nOn Settings, **Add a team** with its name, its repository in the group or organization, and its kind. That is a save on `config.yaml`. When it has merged, run this in your clone of `product-specs`:\n\n```\nnode hub/cli.js connect-teams\n```\n\nIt runs install's team steps for every team, and skips those already connected:\n- **GitLab:** the `hub-report` merge request in the new repository, and its fan-out token.\n- **GitHub:** the deploy key's secret, and the pull request with the `hub-report` and `hub-fanout` workflows.\n\nIt uses your setup token: the one git's credential helper keeps from setup, or `HUB_SETUP_TOKEN`. Running setup again instead also works, but rewrites `config.yaml` from the setup answers, so enter the new team there too.\n\n## Usage records\n\nPer-person usage is encrypted to the person, the admins and the PMs, as `.hub/roles.yaml` names them when it is published. After the PM or an admin changes, run this on the admin's or a PM's machine:\n\n```\nnode hub/cli.js usage rekey\n```\n\nIt encrypts every record in `hub-state` again for the people `roles.yaml` names now. A record that was not encrypted to your key stays as it is, and the command says which.\n"}},Zs=e=>e.toLowerCase().replace(/[^a-z0-9 -]/g,``).trim().replace(/ /g,`-`),Qs=new $({html:!1,linkify:!1,typographer:!1});Qs.renderer.rules.heading_open=(e,t,n,r,i)=>{let a=e[t+1]?.children?.map(e=>e.content).join(``)??``;return e[t].attrSet(`id`,Zs(a)),i.renderToken(e,t,n)},Qs.renderer.rules.link_open=(e,t,n,r,i)=>{let a=e[t].attrGet(`href`)??``;return/^https?:\/\//.test(a)&&(e[t].attrSet(`target`,`_blank`),e[t].attrSet(`rel`,`noopener noreferrer`)),i.renderToken(e,t,n)};var $s=e=>e.replace(/\]\((gitlab|github|people|settings)\.md(#[^)]*)?\)/g,`](/guides/$1$2)`);function ec({name:e}){let{go:t}=H(),n=Xs[e];return L(()=>{let e=Qe();e&&setTimeout(()=>document.getElementById(e)?.scrollIntoView(),30)},[e]),n?V(C,{children:[V(`nav`,{class:`crumb`,"aria-label":`Breadcrumb`,children:[V(U,{to:`/help`,children:`Help`}),V(`span`,{"aria-hidden":`true`,children:`›`}),V(`span`,{children:n.title})]}),V(`div`,{class:`row guides-nav`,children:Object.entries(Xs).map(([t,n])=>V(U,{to:`/guides/${t}`,class:`chipbtn${t===e?` on`:``}`,children:n.title},t))}),V(`article`,{class:`card md guide`,id:`guide`,dangerouslySetInnerHTML:{__html:Qs.render($s(n.text))},onClick:e=>{let n=e.target.closest(`a`)?.getAttribute(`href`)??``;if(!n.startsWith(`/guides/`))return;e.preventDefault();let[r,i]=n.split(`#`)
